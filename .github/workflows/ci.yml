name: CI
permissions:
  contents: write
permissions:
  contents: write
on: [push, pull_request]
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm run build
      - name: Run tests
        timeout-minutes: 10
        run: |
          set +e
          timeout 300 pnpm run test:diagnose
          RC=$?
          set -e
          # A timeout is a CI failure. Tests must terminate cleanly; otherwise
          # we would be converting an unknown/hung suite into a false PASS.
          if [ $RC -eq 124 ]; then echo "::error::vitest timed out or left active handles"; fi
          exit $RC
      - name: Run security tests
        timeout-minutes: 10
        run: |
          set +e
          timeout 180 pnpm exec vitest run -t "security|injection|policy|financial"
          RC=$?
          set -e
          if [ $RC -eq 124 ]; then echo "::error::security test run timed out or left active handles"; fi
          exit $RC

  rebrand-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify ABOS canonical identity
        shell: bash
        run: |
          set -euo pipefail
          test -f pnpm-lock.yaml
          test ! -f package-lock.json
          test -f scripts/abos.sh
          test ! -e scripts/automaton.sh

          # Runtime compatibility contract: CI validates Node 20/22, Node 22 is
          # the repository default, and package managers must reject other majors.
          grep -Fq '"node": ">=20 <21 || >=22 <23"' package.json
          grep -Fxq 'engine-strict=true' .npmrc
          test "$(tr -d '\r\n' < .nvmrc)" = "22"
          test "$(tr -d '\r\n' < .node-version)" = "22"
          grep -Fq '[ "$NODE_MAJOR" -ne 20 ] && [ "$NODE_MAJOR" -ne 22 ]' scripts/abos.sh

          if git grep -n -E '@conway/(abos|automaton)' -- packages src ':!src/__tests__/**'; then
            echo "Legacy runtime package import found."
            exit 1
          fi

          if git grep -n -E 'Conway-Research/automaton|/root/automaton|/opt/automaton|scripts/automaton\.sh' -- package.json packages scripts src ':!src/__tests__/**'; then
            echo "Legacy operational Automaton identity found."
            exit 1
          fi

          # Runtime self-update/build paths must use pnpm. Global package
          # installation tools may legitimately invoke "npm install -g".
          if git grep -n -E '(^|[^[:alnum:]_])npm[[:space:]]+run[[:space:]]+build' -- src/agent src/self-mod src/replication; then
            echo "ABOS build/update path still uses npm run build instead of pnpm."
            exit 1
          fi

          if git grep -n -E '(^|[^[:alnum:]_])npm[[:space:]]+install([[:space:]]|$)' -- src/replication/source.ts; then
            echo "ABOS child source bootstrap still uses npm install instead of pnpm."
            exit 1
          fi

          git grep -n 'https://github.com/hopetmpy/ABOS.git' package.json scripts src

          sh -n scripts/abos.sh
          bash -n scripts/soak-test.sh

          if git grep -n -F 'INSTALL_DIR="$HOME/.abos/runtime"' -- scripts/abos.sh; then
            echo "ABOS runtime must not default inside ~/.abos state."
            exit 1
          fi

          if git grep -n -F 'process.cwd()' -- \
            src/agent/tools.ts \
            src/agent/loop.ts \
            src/agent/system-prompt.ts \
            src/agent/policy-rules/path-protection.ts \
            src/self-mod/code.ts \
            src/self-mod/upstream.ts \
            src/replication/source.ts \
            src/setup/wizard.ts \
            src/orchestration/local-worker.ts; then
            echo "Critical runtime paths must not depend on caller cwd."
            exit 1
          fi

          if git grep -n -F 'process.env.HOME || "/root"' -- packages src ':!src/__tests__/**'; then
            echo "Host state path still falls back to /root instead of the platform home resolver."
            exit 1
          fi

          if git grep -n -F 'execFileSync("which"' -- src/skills/loader.ts; then
            echo "Skill requirement lookup is still POSIX-only."
            exit 1
          fi


  windows-regression:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm run build
      - name: Smoke test built CLI and Windows state persistence
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $smokeHome = Join-Path $env:RUNNER_TEMP "abos-smoke-home"
          Remove-Item $smokeHome -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $smokeHome | Out-Null
          $env:HOME = $smokeHome
          $env:USERPROFILE = $smokeHome

          node dist/index.js --version
          node dist/index.js --help
          node dist/index.js --init

          $walletPath = Join-Path $smokeHome ".abos\wallet.json"
          if (-not (Test-Path $walletPath)) {
            throw "ABOS --init did not create wallet.json under the Windows user home"
          }

          $wallet1 = Get-Content $walletPath -Raw | ConvertFrom-Json
          $identity1 = if ($wallet1.privateKey) { $wallet1.privateKey } else { $wallet1.secretKey }
          if (-not $identity1) {
            throw "ABOS wallet.json contains no persisted identity material"
          }

          node dist/index.js --init

          $wallet2 = Get-Content $walletPath -Raw | ConvertFrom-Json
          $identity2 = if ($wallet2.privateKey) { $wallet2.privateKey } else { $wallet2.secretKey }
          if ($identity1 -ne $identity2) {
            throw "ABOS --init replaced the existing wallet identity on restart"
          }

          $configScript = @'
          import { createConfig, saveConfig } from "./dist/config.js";
          import { getWalletAddress } from "./dist/identity/wallet.js";
          const address = getWalletAddress();
          if (!address) throw new Error("wallet address unavailable after --init");
          saveConfig(createConfig({
            name: "ABOS Windows Smoke",
            genesisPrompt: "Validate deterministic Windows bootstrap.",
            creatorAddress: address,
            registeredWithConway: false,
            sandboxId: "windows-ci-smoke",
            walletAddress: address,
            apiKey: "ci-smoke-key",
            chainType: "evm"
          }));
          '@
          $configScript | node --input-type=module

          node dist/index.js --status
          node dist/index.js --status

          $statePath = Join-Path $smokeHome ".abos\state.db"
          $configPath = Join-Path $smokeHome ".abos\abos.json"
          if (-not (Test-Path $configPath)) {
            throw "ABOS config was not persisted under the Windows user home"
          }
          if (-not (Test-Path $statePath)) {
            throw "ABOS --status did not initialize persistent state.db"
          }

          if (Test-Path "C:\root\.abos") {
            throw "ABOS created state under the historical C:\root\.abos fallback"
          }
      - name: Run Windows portability regressions
        shell: pwsh
        run: >
          pnpm exec vitest run
          src/__tests__/platform-home.test.ts
          src/__tests__/rebrand-installation.test.ts
          src/__tests__/path-protection.test.ts
          src/__tests__/tools-security.test.ts
          src/__tests__/skills-hardening.test.ts
          src/__tests__/command-injection.test.ts
          src/__tests__/legacy-state-migration.test.ts
          src/__tests__/genesis-bootstrap.test.ts
          src/__tests__/heartbeat-scheduler.test.ts
          src/__tests__/orchestration/local-worker-harness.test.ts

  node20-lock-remediation:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: pnpm/action-setup@v4
      - name: Pin Node 20-compatible nanoid remediation
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const p = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          p.pnpm ??= {};
          p.pnpm.overrides ??= {};
          p.pnpm.overrides['nanoid@<3.3.16'] = '3.3.18';
          p.pnpm.overrides['nanoid@<3.3.18'] = '3.3.18';
          fs.writeFileSync('package.json', JSON.stringify(p, null, 2) + '\n');
          NODE
          pnpm install --no-frozen-lockfile
      - name: Verify clean audit
        run: pnpm audit
      - run: pnpm run typecheck
      - run: pnpm run build
      - name: Run full suite on Node 20
        run: pnpm run test:diagnose
      - name: Persist verified lockfile repair
        shell: bash
        run: |
          if git diff --quiet -- package.json pnpm-lock.yaml; then
            echo "Node 20 lockfile is already compatible."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json pnpm-lock.yaml
          git commit -m "fix: keep security remediation compatible with Node 20"
          git push origin HEAD:abos/windows-runtime-hardening


  node20-safe-remediation:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile
      - name: Pin patched transitive versions without major drift
        run: |
          node --input-type=module - <<'NODE'
          import fs from "node:fs";
          const packageJson = JSON.parse(fs.readFileSync("package.json", "utf8"));
          packageJson.pnpm ??= {};
          packageJson.pnpm.overrides = {
            "esbuild@<=0.24.2": "0.25.0",
            "esbuild@>=0.27.3 <0.28.1": "0.28.1",
            "rollup@>=4.0.0 <4.59.0": "4.59.0",
            "yaml@>=2.0.0 <2.8.3": "2.8.3",
            "vite@<=6.4.2": "6.4.3",
            "postcss@<=8.5.22": "8.5.23",
            "ws@>=8.0.0 <8.21.0": "8.21.0",
            "ws@>=7.0.0 <7.5.11": "7.5.11",
            "uuid@<11.1.1": "11.1.1",
            "js-yaml@<3.15.1": "3.15.1",
            "nanoid@<3.3.18": "3.3.18",
            "jayson>ws": "8.21.0"
          };
          fs.writeFileSync("package.json", JSON.stringify(packageJson, null, 2) + "\n");
          NODE
          pnpm install --no-frozen-lockfile
      - name: Audit pinned tree
        run: pnpm audit
      - name: Validate pinned tree on Node 22
        run: |
          pnpm run typecheck
          pnpm run build
          pnpm run test:diagnose
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate pinned tree on Node 20
        run: |
          pnpm install --frozen-lockfile
          pnpm run typecheck
          pnpm run build
          pnpm run test:diagnose
      - name: Commit verified Node 20 compatible remediation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json pnpm-lock.yaml
          git commit -m "fix: pin secure dependencies compatible with Node 20"
          git push origin HEAD:abos/windows-runtime-hardening


  security-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile
      - name: Verify dependency audit is clean
        run: pnpm audit
