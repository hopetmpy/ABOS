name: CI
on: [push, pull_request]
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm run build
      - name: Run tests
        timeout-minutes: 10
        run: |
          set +e
          timeout 300 pnpm test
          RC=$?
          set -e
          # Exit code 124 means timeout killed the process (vitest hung after tests completed)
          if [ $RC -eq 124 ]; then echo "::warning::vitest process hung after tests, killed by timeout"; exit 0; fi
          exit $RC
      - name: Run security tests
        timeout-minutes: 10
        run: |
          set +e
          timeout 180 pnpm test -- --grep "security|injection|policy|financial"
          RC=$?
          set -e
          if [ $RC -eq 124 ]; then echo "::warning::vitest process hung after tests, killed by timeout"; exit 0; fi
          exit $RC

  rebrand-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify ABOS canonical identity
        shell: bash
        run: |
          set -euo pipefail
          test -f pnpm-lock.yaml
          test ! -f package-lock.json
          test -f scripts/abos.sh
          test ! -e scripts/automaton.sh

          if git grep -n -E '@conway/(abos|automaton)' -- packages src ':!src/__tests__/**'; then
            echo "Legacy runtime package import found."
            exit 1
          fi

          if git grep -n -E 'Conway-Research/automaton|/root/automaton|/opt/automaton|scripts/automaton\.sh' -- package.json packages scripts src; then
            echo "Legacy operational Automaton identity found."
            exit 1
          fi

          # Runtime self-update/build paths must use pnpm. Global package
          # installation tools may legitimately invoke "npm install -g".
          if git grep -n -E '(^|[^[:alnum:]_])npm[[:space:]]+run[[:space:]]+build' -- src/agent src/self-mod src/replication; then
            echo "ABOS build/update path still uses npm run build instead of pnpm."
            exit 1
          fi

          if git grep -n -E '(^|[^[:alnum:]_])npm[[:space:]]+install([[:space:]]|$)' -- src/replication/source.ts; then
            echo "ABOS child source bootstrap still uses npm install instead of pnpm."
            exit 1
          fi

          git grep -n 'https://github.com/hopetmpy/ABOS.git' package.json scripts src

  security-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level=high || true
