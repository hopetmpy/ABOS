name: P003 Reconcile Unknown Balance Consumers

on:
  push:
    branches:
      - abos/p003-child-capital-reconciliation-v2
    paths:
      - .github/workflows/p003-consumer-truth.yml

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: abos/p003-child-capital-reconciliation-v2
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
      - name: Patch UNKNOWN balance consumers
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one match, found {count}")
              p.write_text(text.replace(old, new, 1))

          replace_once(
              "src/orchestration/health-monitor.ts",
              '''      const balance = await this.funding.getBalance(address);\n      if (!Number.isFinite(balance)) {\n        return null;\n      }\n      return Math.max(0, Math.floor(balance));\n''',
              '''      const balance = await this.funding.getBalance(address);\n      if (typeof balance !== "number" || !Number.isFinite(balance)) {\n        return null;\n      }\n      return Math.max(0, Math.floor(balance));\n''',
          )

          replace_once(
              "src/orchestration/health-monitor.ts",
              '''  private async fundAgent(agent: AgentHealthStatus): Promise<HealAction> {\n    const currentBalance = agent.creditBalance ?? 0;\n    const amountCents = Math.max(\n''',
              '''  private async fundAgent(agent: AgentHealthStatus): Promise<HealAction> {\n    if (agent.creditBalance === null) {\n      return {\n        type: "fund",\n        agentAddress: agent.address,\n        reason: "child credit balance is unknown; refusing automatic funding without an observed low balance",\n        success: false,\n      };\n    }\n\n    const currentBalance = agent.creditBalance;\n    const amountCents = Math.max(\n''',
          )

          replace_once(
              "src/orchestration/planner-context.ts",
              '''async function resolveCreditsCents(\n  options: PlannerContextOptions,\n  cachedCreditsCents?: number,\n): Promise<number> {\n  if (typeof options.creditsCents === "number" && Number.isFinite(options.creditsCents)) {\n    return Math.max(0, Math.floor(options.creditsCents));\n  }\n\n  if (options.funding && options.identityAddress) {\n    try {\n      const balance = await options.funding.getBalance(options.identityAddress);\n      if (Number.isFinite(balance)) {\n        return Math.max(0, Math.floor(balance));\n      }\n    } catch {\n      // Fall back to cached or default balances.\n    }\n  }\n\n  return Math.max(0, Math.floor(cachedCreditsCents ?? 0));\n}\n''',
              '''async function resolveCreditsCents(\n  options: PlannerContextOptions,\n  cachedCreditsCents?: number,\n): Promise<number | null> {\n  if (typeof options.creditsCents === "number" && Number.isFinite(options.creditsCents)) {\n    return Math.max(0, Math.floor(options.creditsCents));\n  }\n\n  // FundingProtocol describes child funding/balance observation. It is not a\n  // parent-wallet balance authority, so do not query it with identityAddress.\n  // A fresh explicit observation wins; otherwise use a valid cached parent\n  // observation. If neither exists, preserve UNKNOWN instead of manufacturing 0.\n  if (typeof cachedCreditsCents === "number" && Number.isFinite(cachedCreditsCents)) {\n    return Math.max(0, Math.floor(cachedCreditsCents));\n  }\n\n  return null;\n}\n''',
          )

          replace_once(
              "src/orchestration/planner-context.ts",
              '''function toSurvivalTier(creditsCents: number): string {\n  if (creditsCents <= 0) {\n''',
              '''function toSurvivalTier(creditsCents: number | null): string {\n  if (creditsCents === null) {\n    return "unknown";\n  }\n  if (creditsCents <= 0) {\n''',
          )

          replace_once(
              "src/orchestration/planner.ts",
              '''export interface PlannerContext {\n  creditsCents: number;\n''',
              '''export interface PlannerContext {\n  creditsCents: number | null;\n''',
          )

          replace_once(
              "src/orchestration/planner.ts",
              '''  const creditsDisplay = `${context.creditsCents} cents`;\n''',
              '''  const creditsDisplay = context.creditsCents === null\n    ? "UNKNOWN (no current parent credit observation)"\n    : `${context.creditsCents} cents`;\n''',
          )
          PY
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm run build
      - name: Run affected orchestration tests
        run: >-
          pnpm exec vitest run
          src/__tests__/orchestration/health-monitor.test.ts
          src/__tests__/orchestration/planner.test.ts
          src/__tests__/orchestration/orchestrator.test.ts
      - name: Commit validated consumer reconciliation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/orchestration/health-monitor.ts \
            src/orchestration/planner-context.ts \
            src/orchestration/planner.ts
          git diff --cached --quiet && { echo "No consumer changes produced"; exit 1; }
          git commit -m "fix(economics): preserve unknown balances in health and planning"
          git push origin HEAD:abos/p003-child-capital-reconciliation-v2
