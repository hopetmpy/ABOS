name: P008 Surgical Runtime Truth Patch

on:
  push:
    branches:
      - abos/p008-runtime-truth-v1
    paths:
      - .github/workflows/p008-surgical-patch.yml

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4
        with:
          ref: abos/p008-runtime-truth-v1
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply guarded exact replacements
        run: python scripts/p008-surgical-patch.py

      - name: Typecheck
        run: pnpm run typecheck

      - name: Run P-008 targeted adversarial tests
        run: pnpm exec vitest run src/__tests__/installed-tools-runtime-truth.test.ts src/__tests__/runtime-truth-policy.test.ts src/__tests__/planner-runtime-truth.test.ts src/__tests__/system-prompt-runtime-truth.test.ts src/__tests__/status-runtime-truth.test.ts src/__tests__/skill-runtime-truth.test.ts src/__tests__/capability-registry.test.ts src/__tests__/capability-resolver.test.ts src/__tests__/capability-tools.test.ts

      - name: Commit guarded patch and remove one-shot artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/agent/tools.ts src/agent/loop.ts src/orchestration/orchestrator.ts
          git rm .github/workflows/p008-surgical-patch.yml scripts/p008-surgical-patch.py
          git commit -m "fix(runtime-truth): close nominal MCP exposure and preserve environment evidence"
          git push origin HEAD:abos/p008-runtime-truth-v1

# Trigger after exact source needles were reconciled from run 34795758027 evidence.
