name: P009 Provenance Apply

on:
  push:
    branches:
      - abos/p009-authority-provenance-v1
    paths:
      - .github/workflows/p009-provenance-apply.yml

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: abos/p009-authority-provenance-v1
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile
      - name: Apply guarded P-009 patch
        run: python scripts/p009-provenance-apply.py
      - name: Align legacy messaging fixture with V15 provenance contract
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/__tests__/orchestration/messaging.test.ts")
          text = path.read_text(encoding="utf-8")

          replacements = [
              (
                  '''  raw.exec("ALTER TABLE inbox_messages ADD COLUMN max_retries INTEGER DEFAULT 3;");''',
                  '''  raw.exec("ALTER TABLE inbox_messages ADD COLUMN max_retries INTEGER DEFAULT 3;");\n  raw.exec("ALTER TABLE inbox_messages ADD COLUMN transport TEXT NOT NULL DEFAULT 'legacy_unknown';");\n  raw.exec("ALTER TABLE inbox_messages ADD COLUMN sender_verification TEXT NOT NULL DEFAULT 'unknown';");\n  raw.exec("ALTER TABLE inbox_messages ADD COLUMN transport_sender TEXT;");''',
              ),
              (
                  '''    from: overrides.from ?? "0xsender",\n    to: overrides.to ?? "0xreceiver",''',
                  '''    from: overrides.from ?? "0xfrom",\n    to: overrides.to ?? "0xself",''',
              ),
          ]

          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"fixture patch expected exactly one match, found {count}: {old!r}")
              text = text.replace(old, new, 1)

          path.write_text(text, encoding="utf-8")
          print("aligned messaging.test.ts fixture")
          PY
      - name: Typecheck
        run: pnpm run typecheck
      - name: Targeted adversarial tests
        run: >-
          pnpm exec vitest run
          src/__tests__/authority-provenance.test.ts
          src/__tests__/authority-rules.test.ts
          src/__tests__/inbox-processing.test.ts
          src/__tests__/social.test.ts
          src/__tests__/orchestration/messaging.test.ts
          src/__tests__/orchestration/colony-task-assignment.test.ts
      - name: Commit verified source and remove one-shot helpers
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src
          git rm .github/workflows/p009-provenance-apply.yml scripts/p009-provenance-apply.py
          git diff --cached --check
          git commit -m "fix(authority): preserve inbound provenance (P-009)"
          git push origin HEAD:abos/p009-authority-provenance-v1
