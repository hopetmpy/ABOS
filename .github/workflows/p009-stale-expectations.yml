name: P009 Stale Expectation Reconcile

on:
  push:
    branches:
      - abos/p009-authority-provenance-v1
    paths:
      - .github/workflows/p009-stale-expectations.yml

permissions:
  contents: write

jobs:
  reconcile-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: abos/p009-authority-provenance-v1
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile
      - name: Apply guarded stale-expectation reconciliation
        run: python scripts/p009-stale-expectations.py
      - name: Typecheck
        run: pnpm run typecheck
      - name: Verify affected and adversarial tests
        run: >-
          pnpm exec vitest run
          src/__tests__/adaptive-schema.test.ts
          src/__tests__/continuity-assembler.test.ts
          src/__tests__/loop.test.ts
          src/__tests__/authority-provenance.test.ts
      - name: Commit verified test reconciliation and remove helpers
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/__tests__
          git rm .github/workflows/p009-stale-expectations.yml scripts/p009-stale-expectations.py
          git diff --cached --check
          git commit -m "test(p009): reconcile provenance expectations"
          git push origin HEAD:abos/p009-authority-provenance-v1
