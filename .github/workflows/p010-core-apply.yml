name: P010 Core Validate

on:
  push:
    branches:
      - abos/p010-policy-approval-lifecycle-v1
    paths:
      - .github/workflows/p010-core-apply.yml
      - package.json
      - packages/cli/**
      - src/agent/**
      - src/conway/topup.ts
      - src/heartbeat/**
      - src/identity/**
      - src/state/**
      - src/types.ts
      - src/__tests__/policy-lifecycle-p010.test.ts
      - src/__tests__/p010-authorization-followup.test.ts
      - src/__tests__/p010-creator-rotation.test.ts
      - src/__tests__/policy-engine.test.ts
      - src/__tests__/financial.test.ts
      - src/__tests__/authority-rules.test.ts
      - src/__tests__/heartbeat.test.ts
      - src/__tests__/runtime-truth-policy.test.ts
      - src/__tests__/chain.test.ts
      - src/__tests__/authority-provenance.test.ts
      - src/__tests__/agent/general-harness.test.ts
      - src/__tests__/loop.test.ts
      - src/__tests__/adaptive-schema.test.ts
      - src/__tests__/continuity-assembler.test.ts
      - ProjectOps/**
      - scripts/projectops-integrity-verify.mjs

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: ProjectOps integrity
        run: node scripts/projectops-integrity-verify.mjs
      - name: Typecheck
        run: pnpm run typecheck
      - name: Targeted P-010 policy tests
        run: pnpm exec vitest run src/__tests__/policy-lifecycle-p010.test.ts src/__tests__/p010-authorization-followup.test.ts src/__tests__/p010-creator-rotation.test.ts src/__tests__/policy-engine.test.ts src/__tests__/financial.test.ts src/__tests__/authority-rules.test.ts src/__tests__/heartbeat.test.ts src/__tests__/runtime-truth-policy.test.ts src/__tests__/chain.test.ts src/__tests__/authority-provenance.test.ts src/__tests__/agent/general-harness.test.ts src/__tests__/loop.test.ts src/__tests__/adaptive-schema.test.ts src/__tests__/continuity-assembler.test.ts
      - name: Full test suite
        run: pnpm test
