name: P011 Apply Deterministic Patches

on:
  push:
    branches:
      - abos/p011-lifecycle-recovery-v1
    paths:
      - scripts/p011-apply-patches.mjs
      - .github/workflows/p011-apply.yml

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[p011-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: abos/p011-lifecycle-recovery-v1
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply exact source/test patches
        run: node scripts/p011-apply-patches.mjs
      - name: Commit patched files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/orchestration/health-monitor.ts src/heartbeat/tasks.ts src/__tests__/orchestration/health-monitor.test.ts
          git diff --cached --check
          git diff --cached --quiet && { echo "No patch changes produced"; exit 1; }
          git commit -m "P-011 wire observed lifecycle recovery [p011-applied]"
          git push origin HEAD:abos/p011-lifecycle-recovery-v1
