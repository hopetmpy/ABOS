          replace_once('ProjectOps/plan/P-012.md', 'State: PLANIFICADO', 'State: EN_EJECUCIÓN')
          replace_once(
              'ProjectOps/plan/P-012.md',
              'Dependencies: P-009, P-010, P-011; P-013 evidence antes de cierre completo.\n\n## Objetivo',
              'Dependencies: P-009, P-010, P-011; P-013 evidence antes de cierre completo.\n\nActivation-Baseline:\n- P-011 PR: #38\n- P-011 merge `main`: `cc26ee0c68f699fe9c2621d896ec98a3ec32bd5a`\n- P-011 main CI `34915463559`: SUCCESS\n- P-011 main ProjectOps Integrity `34915463657`: SUCCESS\n- segmento activo al integrar esta transición: `ProjectOps/continuity/C0008.md`\n\n## Objetivo',
          )
          p012 = read('ProjectOps/plan/P-012.md')
          p012 += '\n## Estado de activación\n\n`EN_EJECUCIÓN / AUDIT_REQUIRED`. P-011 está integrado y revalidado, por lo que la dependencia secuencial queda satisfecha. Esta transición no autoriza source P-012: primero debe leerse el Required-Context completo, auditar entrypoints y persistencia self-mod, reproducir write-before-verify/rollback best-effort, evaluar `rate.self_mod_hourly` como guard provisional y alcanzar `DECISION_READY` en C0008. P-013 sigue siendo dependencia de evidencia antes del cierre completo de P-012.\n'
          write('ProjectOps/plan/P-012.md', p012)

          # Project baseline tracks the current critical frontier, not stale P-011 activity.
          replace_once(
              'ProjectOps/PROJECT.md',
              '### 7.4 P-011 activo\n\nP-010 Policy/Authorization/Approval/Quarantine está HECHO / INTEGRATION_VERIFIED. P-011 Lifecycle/Health/Restart/Recovery es la intervención activa: estados críticos deben reflejar observación del runtime; timeout conserva incertidumbre hasta reconciliación y recovery no puede redispatchar a ciegas un efecto que pudo ocurrir.',
              '### 7.4 P-012 activo\n\nP-011 Lifecycle/Health/Restart/Recovery está HECHO / INTEGRATION_VERIFIED sobre `main cc26ee0c...`. P-012 transactional self-modification es la intervención activa: el source activo no debe quedar roto por write-before-verify, failure no puede convertirse en success y cualquier guard fijo de frecuencia debe justificarse como control provisional/configurable, no como sustituto universal de juicio transaccional.',
          )

          # Canonical continuity rotates from C0007/P-011 to C0008/P-012.
          replace_once('ProjectOps/CONTINUITY.md', 'Active-Plan: P-011', 'Active-Plan: P-012')
          replace_once('ProjectOps/CONTINUITY.md', 'Active-Segment: continuity/C0007.md', 'Active-Segment: continuity/C0008.md')
          replace_once('ProjectOps/CONTINUITY.md', 'Active-Intervention: P011_LIFECYCLE_HEALTH_RESTART_RECOVERY — READY_FOR_INTEGRATION', 'Active-Intervention: P012_TRANSACTIONAL_SELF_MODIFICATION — AUDIT_REQUIRED')
          replace_once('ProjectOps/CONTINUITY.md', 'Current-Host-Branch: abos/p011-lifecycle-recovery-v1', 'Current-Host-Branch: abos/p011-close-p012-activate')
          replace_once('ProjectOps/CONTINUITY.md', 'Host-Head-At-Audit-Open: 33e4865b777c9a810cabee370c7bf85600253185', 'Host-Head-At-Audit-Open: cc26ee0c68f699fe9c2621d896ec98a3ec32bd5a')
          replace_once('ProjectOps/CONTINUITY.md', 'Last-Reconciled-Host-Head: af2d19fdf033c5a5a52a162ab0db3065702fd69c', 'Last-Reconciled-Host-Head: cc26ee0c68f699fe9c2621d896ec98a3ec32bd5a')
          replace_once('ProjectOps/CONTINUITY.md', 'Last-Reconciled-Head-Semantics: P011_SOURCE_COMPLETE_READY_FOR_INTEGRATION', 'Last-Reconciled-Head-Semantics: P011_INTEGRATION_VERIFIED_P012_AUDIT_BASELINE')
          replace_once(
              'ProjectOps/CONTINUITY.md',
              'P011-Branch-ProjectOps: 34914283237 SUCCESS\n',
              'P011-Branch-ProjectOps: 34914283237 SUCCESS\nP011-Final-Head: 5c8b903956363c21f6b8b9dc30ae78b25decaeaf\nP011-PR: 38\nP011-Merge: cc26ee0c68f699fe9c2621d896ec98a3ec32bd5a\nP011-Main-CI: 34915463559 SUCCESS\nP011-Main-ProjectOps: 34915463657 SUCCESS\n',
          )
          replace_once(
              'ProjectOps/CONTINUITY.md',
              '`Last-Reconciled-Host-Head` referencia el source P-011 exacto `af2d19fd...` ya validado en branch. El canonical baseline de P-011 sigue siendo `main 33e4865b...` por PR #37; branch está SOURCE_COMPLETE/READY_FOR_INTEGRATION pero no se eleva a HECHO hasta merge + revalidación de `main`.',
              '`Last-Reconciled-Host-Head` es `main cc26ee0c68f699fe9c2621d896ec98a3ec32bd5a`, donde P-011 fue squash-merged por PR #38 y revalidado por CI + ProjectOps. Ese SHA es el baseline exacto de activación P-012; la transición documental no eleva ningún claim a E5/E6.',
          )
          replace_once(
              'ProjectOps/CONTINUITY.md',
              '- P-011: EN_EJECUCIÓN / SOURCE_COMPLETE / READY_FOR_INTEGRATION — C0007 activo; baseline canónico `33e4865b...`; source validado `af2d19fd...`; CI + ProjectOps branch green; integración en main pendiente.\n- P-012..P-036: ver `ProjectOps/PLAN.md`; permanecen en su estado explícito.',
              '- P-011: HECHO / INTEGRATION_VERIFIED — integrado por PR #38 en `main cc26ee0c...`; main CI `34915463559` + ProjectOps `34915463657` green; C0007 cerrado.\n- P-012: EN_EJECUCIÓN / AUDIT_REQUIRED — C0008 activo; baseline `main cc26ee0c...`; source P-012 todavía no autorizado.\n- P-013..P-036: ver `ProjectOps/PLAN.md`; permanecen en su estado explícito.',
          )
          replace_once(
              'ProjectOps/CONTINUITY.md',
              '## P-011 — source completo / integración pendiente\n\nBaseline: `main` `33e4865b777c9a810cabee370c7bf85600253185`, CI `34910026353` y ProjectOps `34910026443` SUCCESS.\n\nRama: `abos/p011-lifecycle-recovery-v1`. Source validado: `af2d19fdf033c5a5a52a162ab0db3065702fd69c`. Branch CI `34914283215` y ProjectOps `34914283237`: SUCCESS.\n\nEstado: `EN_EJECUCIÓN / SOURCE_COMPLETE / READY_FOR_INTEGRATION`.\n\nResultado: lifecycle/restart/stop/health child usa post-condiciones observadas; legacy pre-V7 se adopta sólo desde child evidence; auto-heal es recover idempotente; heartbeat timeout queda durable in-doubt y no se redispatchea tras crash hasta reconciliación. No se creó segundo supervisor/lifecycle store ni se reabrió P-010.\n\nEl drift `PROJECT.md §7.4` queda reconciliado puntualmente dentro de P-004 sin declarar P-004 HECHO.',
              '## P-011 — cierre verificable\n\nResultado integrado: lifecycle/restart/stop/health child usa post-condiciones observadas; legacy pre-V7 se adopta sólo desde child evidence; auto-heal es recover idempotente; heartbeat timeout queda durable in-doubt y no se redispatchea tras crash hasta reconciliación. No se creó segundo supervisor/lifecycle store ni se reabrió P-010.\n\nEvidencia: source `af2d19fd...` con CI `34914283215` + ProjectOps `34914283237`; exact-head `5c8b9039...`; PR #38; squash merge `cc26ee0c...`; main CI `34915463559` + ProjectOps `34915463657` SUCCESS. Estado: `HECHO / INTEGRATION_VERIFIED` en E3. No acredita E5/E6 provider LIVE.\n\n## P-012 — auditoría activa\n\nBaseline: `main cc26ee0c68f699fe9c2621d896ec98a3ec32bd5a`, con P-011 integrado y main CI `34915463559` + ProjectOps `34915463657` SUCCESS.\n\nEstado: `EN_EJECUCIÓN / AUDIT_REQUIRED`. Debe reconstruir `src/self-mod/`, policy rate guard, persistence/capabilities y entrypoints reales; reproducir write-before-verify/rollback best-effort; mapear transaction boundaries y alcanzar `DECISION_READY` antes de source. P-013 evidence sigue requerida antes del cierre completo.',
          )
          replace_once(
              'ProjectOps/CONTINUITY.md',
              '## Siguiente punto verificable\n\n1. Gatear el head documental exacto posterior a esta reconciliación.\n2. Reconfirmar branch y `main` exactos; no integrar si aparece drift.\n3. Abrir PR P-011 exact-head, revisar mergeability/reviews/threads y diff.\n4. Merge protegido y revalidación CI + ProjectOps sobre `main`.\n5. Sólo después marcar P-011 HECHO y activar el siguiente P-xxx autorizado por `PLAN.md`.',
              '## Siguiente punto verificable\n\n1. Integrar esta transición documental exact-head y revalidar CI + ProjectOps en `main`.\n2. Con P-012 ya canónicamente activo, leer su Required-Context completo antes de source.\n3. Auditar todos los entrypoints de self-modification, protected scope, snapshot/rollback, build/test, activation, audit trail y rate guard.\n4. Registrar hipótesis competidoras, failure matrix, rollback/evidence ladder y `DECISION_READY` en C0008.\n5. Sólo entonces autorizar la primera unidad source P-012.',
          )
          replace_once(
              'ProjectOps/CONTINUITY.md',
              '`C0006` queda CLOSED / HECHO como historia P-010. `C0007` es el único segmento activo para P-011. Nunca se crea un segundo manifest `CONTINUITY.md`.',
              '`C0006` queda CLOSED / HECHO como historia P-010. `C0007` queda CLOSED / HECHO como historia P-011. `C0008` es el único segmento activo para P-012. Nunca se crea un segundo manifest `CONTINUITY.md`.',
          )

          c0008 = '''# ProjectOps — continuity/C0008.md — ABOS

State: ACTIVE
Segment: C0008
Opened: 2026-09-14
Host-Branch: `abos/p011-close-p012-activate`

## Intervención — P-012 — Convertir self-modification en transacción segura y recuperable

State: EN_EJECUCIÓN
Classification: AUDIT_REQUIRED

### Baseline exacto

- P-011 PR: #38.
- P-011 final exact-head: `5c8b903956363c21f6b8b9dc30ae78b25decaeaf`.
- P-011 PR CI `34915270151`: SUCCESS.
- P-011 PR ProjectOps `34915270177`: SUCCESS.
- P-011 squash merge: `main` `cc26ee0c68f699fe9c2621d896ec98a3ec32bd5a`.
- P-011 main CI `34915463559`: SUCCESS.
- P-011 main ProjectOps Integrity `34915463657`: SUCCESS.
- P-011: HECHO / INTEGRATION_VERIFIED en E3.
- P-012 source modificado en esta transición: **NO**.

### Autoridad y alcance inicial

P-012 parte del objetivo de permitir self-modification real sin dejar active source roto por write-before-verify ni convertir un fallo en success. Debe preservar constitution, provenance, policy P-010, recovery P-011, source/runtime separation y una sola authority por responsabilidad.

Required-Context mínimo está definido en `ProjectOps/plan/P-012.md`; antes de source debe leerse completo y expandirse siguiendo producers/consumers reales. En particular deben auditarse `src/self-mod/`, `rate.self_mod_hourly`, state/persistence, capabilities, package/dependency surface y CI/build/test boundaries.

### Pregunta operativa

¿Qué entrypoints pueden modificar hoy el source o tool surface de ABOS, qué parte de cada flujo ocurre antes de verificación, qué autoridad registra/activa/revierte el cambio y cuál es la transacción mínima coherente que mantiene la versión anterior utilizable hasta demostrar la nueva sin convertir un rate-limit fijo en sustituto de juicio?

### Hipótesis iniciales a discriminar

- **H1**: existe write-before-verify en el flujo canónico y un build/test fallido puede dejar el checkout activo parcialmente modificado.
- **H2**: snapshot/rollback actual es best-effort y no constituye una transacción verificable bajo crash o fallo parcial.
- **H3**: ya existen primitives Git/filesystem/audit suficientes para EXTEND/UNIFY sin crear un segundo self-mod authority.
- **H4**: `rate.self_mod_hourly = 10` es un guard anti-runaway útil pero arbitrario como invariante universal; la safety real debe derivar de aislamiento, concurrency, recovery y verification evidence.
- **H5**: dependency/tool acquisition comparte superficie de riesgo supply-chain, pero no debe fusionarse ciegamente con toda capability acquisition futura P-014/P-017.
- **H6**: P-011 recovery primitives resuelven parte de crash/late-effect semantics, pero no sustituyen atomic activation/rollback de source.

### Gate antes de source

1. Leer Required-Context completo y seguir entrypoints/callers/tests reales.
2. Mapear request/provenance → protected scope → write/stage → dependency effects → verify → activate → post-probe → audit/rollback.
3. Reproducir o falsar write-before-verify y rollback best-effort.
4. Auditar concurrencia/locks, crash windows, disk/dependency failures y runtime/source separation.
5. Evaluar alternativas reales: Git/worktree/temp tree/atomic rename u otras ya presentes; no fijar mecanismo antes de evidencia.
6. Reauditar rate guard bajo `CAPABILITY_PRESERVATION_BEFORE_RESTRICTION`.
7. Registrar failure matrix, rollback, impacts y evidence ladder.
8. Alcanzar `DECISION_READY`; hasta entonces source P-012 permanece **NO AUTORIZADO**.

### Límites de evidencia

La transición sólo acredita cierre P-011 y activación documental P-012. No acredita que self-mod transactional ya exista, no ejecuta self-mod LIVE y no eleva CI a E5/E6.

### Siguiente punto verificable

Integrar esta transición exact-head, revalidar `main`, y luego iniciar la auditoría P-012 desde este baseline canónico sin modificar source antes de `DECISION_READY`.
'''
          Path('ProjectOps/continuity/C0008.md').write_text(c0008)

