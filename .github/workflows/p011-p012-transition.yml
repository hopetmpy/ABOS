          replace_once('ProjectOps/continuity/C0007.md', 'State: EN_EJECUCIÓN', 'State: HECHO')
          replace_once('ProjectOps/continuity/C0007.md', 'Classification: SOURCE_COMPLETE / READY_FOR_INTEGRATION', 'Classification: HECHO / INTEGRATION_VERIFIED')
          replace_once(
              'ProjectOps/continuity/C0007.md',
              '### Estado actual\n\nP-011 está **EN_EJECUCIÓN / SOURCE_COMPLETE / READY_FOR_INTEGRATION**. Los defectos H1/H5 fueron corregidos en las rutas demostradas; H2/H4 se resolvieron extendiendo authorities existentes; H3 quedó endurecida con recovery idempotente + timeout durable in-doubt; H6 permaneció refutada para P-010. Falta PR exact-head, merge y revalidación de `main`; por ello aún no es HECHO.\n\n### Siguiente punto verificable\n\nGatear este head documental exacto, reconfirmar `main` sin drift, abrir PR exact-head P-011, revisar mergeability/reviews/threads, integrar y revalidar CI + ProjectOps sobre el merge SHA antes de declarar HECHO.',
              '### Cierre de integración\n\nFecha: 2026-09-14\nEstado: **HECHO / INTEGRATION_VERIFIED**.\n\n- source head `af2d19fdf033c5a5a52a162ab0db3065702fd69c`: CI `34914283215`, ProjectOps `34914283237` SUCCESS;\n- exact-head final `5c8b903956363c21f6b8b9dc30ae78b25decaeaf`: push CI `34915046743`, push ProjectOps `34915046721`, PR CI `34915270151`, PR ProjectOps `34915270177` SUCCESS;\n- PR #38: mergeable, sin reviews ni threads pendientes antes del merge;\n- squash merge `cc26ee0c68f699fe9c2621d896ec98a3ec32bd5a`;\n- main CI `34915463559`: SUCCESS;\n- main ProjectOps Integrity `34915463657`: SUCCESS.\n\nLa Definition of Done P-011 queda satisfecha en E3: las transiciones críticas cubiertas dependen de observación/post-condición, recovery no duplica los efectos demostrados y timeout conserva incertidumbre en vez de habilitar redispatch ciego. E5/E6 provider/Conway LIVE y exactly-once externo no demostrado permanecen fuera del claim.\n\n### Continuidad\n\nC0007 se cierra. P-012 queda habilitado por P-009/P-010/P-011 HECHO, pero inicia sólo como `AUDIT_REQUIRED`: no se autoriza source self-modification hasta reconstruir Required-Context, mapear entrypoints/authority/failure modes, discriminar alternativas y alcanzar `DECISION_READY` en C0008.',
