name: P011 Close P012 Activate

on:
  push:
    branches:
      - abos/p011-close-p012-activate
    paths:
      - .github/workflows/p011-p012-transition.yml
      - scripts/p011_p012_transition.py

permissions:
  contents: write

jobs:
  transition:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: abos/p011-close-p012-activate
          fetch-depth: 0
      - name: Reconcile P-011 closure and P-012 activation atomically
        run: python3 scripts/p011_p012_transition.py
      - name: Remove temporary transition machinery
        run: git rm .github/workflows/p011-p012-transition.yml scripts/p011_p012_transition.py
      - name: Verify and commit transition
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ProjectOps/PLAN.md ProjectOps/PROJECT.md ProjectOps/CONTINUITY.md ProjectOps/plan/P-011.md ProjectOps/plan/P-012.md ProjectOps/continuity/C0007.md ProjectOps/continuity/C0008.md
          git diff --cached --check
          node scripts/projectops-integrity-verify.mjs
          git commit -m "P-011 close and activate P-012"
          git push origin HEAD:abos/p011-close-p012-activate
