name: P011 Close P012 Activate

on:
  push:
    branches:
      - abos/p011-close-p012-activate
    paths:
      - .github/workflows/p011-p012-transition.yml

permissions:
  contents: write

jobs:
  transition:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: abos/p011-close-p012-activate
          fetch-depth: 0
      - name: Reconcile P-011 closure and P-012 activation atomically
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def read(path):
              return Path(path).read_text()

          def write(path, content):
              Path(path).write_text(content)

          def replace_once(path, before, after):
              s = read(path)
              n = s.count(before)
              if n != 1:
                  raise SystemExit(f"expected one anchor in {path}, found {n}: {before[:120]!r}")
              write(path, s.replace(before, after, 1))

          # PLAN manifest: close P-011 and activate P-012 without renumbering or parallel planning.
          replace_once(
              'ProjectOps/PLAN.md',
              '| P-011 | Hacer reales Lifecycle, Health, Restart y Recovery | EN_EJECUCIÓN | P-009 + P-010 HECHO; C0007 activa | plan/P-011.md |',
              '| P-011 | Hacer reales Lifecycle, Health, Restart y Recovery | HECHO | integrado por PR #38; main `cc26ee0c...` CI `34915463559` + ProjectOps `34915463657` green | plan/P-011.md |',
          )
          replace_once(
              'ProjectOps/PLAN.md',
              '| P-012 | Convertir self-modification en transacción segura y recuperable | PLANIFICADO | P-009 + P-010 + P-011; evidence P-013 | plan/P-012.md |',
              '| P-012 | Convertir self-modification en transacción segura y recuperable | EN_EJECUCIÓN | P-009 + P-010 + P-011 HECHO; C0008 activa; evidence P-013 antes de cierre completo | plan/P-012.md |',
          )
          replace_once(
              'ProjectOps/PLAN.md',
              'La deuda heredada de Ola 0 está cerrada; P-008 Runtime Truth, P-009 Authority/Provenance y P-010 Policy/Authorization cerraron las primeras fronteras de Ola 1. P-011 Lifecycle/Recovery es la intervención activa.',
              'La deuda heredada de Ola 0 está cerrada; P-008 Runtime Truth, P-009 Authority/Provenance, P-010 Policy/Authorization y P-011 Lifecycle/Recovery están integrados. P-012 transactional self-modification es la intervención activa de Ola 1.',
          )

          # P-011 module: exact integration evidence closes the module at E3 only.
          replace_once('ProjectOps/plan/P-011.md', 'State: EN_EJECUCIÓN', 'State: HECHO')
          replace_once(
              'ProjectOps/plan/P-011.md',
              '## Estado actual\n\n`EN_EJECUCIÓN / SOURCE_COMPLETE / READY_FOR_INTEGRATION`. La auditoría alcanzó `DECISION_READY` en C0007 antes de source. El source head validado es `af2d19fdf033c5a5a52a162ab0db3065702fd69c`: ProjectOps Integrity `34914283237` SUCCESS y CI `34914283215` SUCCESS. La reconciliación documental auto-limpiada quedó en `5725dae9e16a3487afbac021678acabd5752f3f5`; este registro fuerza el gate del candidato exact-head posterior. La integración en `main` y su revalidación siguen pendientes; por tanto P-011 todavía no es HECHO.\n',
              '## Cierre de integración\n\n`HECHO / INTEGRATION_VERIFIED` para el objetivo exacto P-011. Source validado `af2d19fdf033c5a5a52a162ab0db3065702fd69c` con CI `34914283215` y ProjectOps `34914283237` SUCCESS. Candidato exact-head `5c8b903956363c21f6b8b9dc30ae78b25decaeaf` pasó push CI `34915046743`, push ProjectOps `34915046721`, PR CI `34915270151` y PR ProjectOps `34915270177`. PR #38 fue squash-merged a `main` `cc26ee0c68f699fe9c2621d896ec98a3ec32bd5a`; main CI `34915463559` y ProjectOps `34915463657` finalizaron SUCCESS. Esto acredita E3/integración, no E5/E6 Conway/provider LIVE ni exactly-once externo no demostrado.\n',
