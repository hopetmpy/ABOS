name: P011 ProjectOps Reconcile

on:
  push:
    branches:
      - abos/p011-lifecycle-recovery-v1
    paths:
      - scripts/p011_projectops_reconcile.py
      - .github/workflows/p011-projectops-reconcile.yml

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: abos/p011-lifecycle-recovery-v1
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Normalize exact EOF anchors
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/p011_projectops_reconcile.py')
          s = p.read_text()
          replacements = [
              (
                  'registrar hallazgos/decisión en C0007.\\n""",',
                  'registrar hallazgos/decisión en C0007.""",',
              ),
              (
                  'ejecutar validación dirigida antes de continuar con heartbeat crash recovery.\\n""",',
                  'ejecutar validación dirigida antes de continuar con heartbeat crash recovery.""",',
              ),
          ]
          for old, new in replacements:
              if s.count(old) != 1:
                  raise SystemExit(f'expected one EOF anchor, found {s.count(old)}: {old[:80]}')
              s = s.replace(old, new, 1)
          p.write_text(s)
          PY
      - name: Reconcile P-011 canonical ProjectOps
        run: python scripts/p011_projectops_reconcile.py
      - name: Remove temporary reconciliation machinery
        run: git rm scripts/p011_projectops_reconcile.py .github/workflows/p011-projectops-reconcile.yml
      - name: Commit reconciliation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ProjectOps/PROJECT.md ProjectOps/CONTINUITY.md ProjectOps/continuity/C0007.md ProjectOps/plan/P-011.md
          git diff --cached --check
          git commit -m "P-011 reconcile source-complete ProjectOps"
          git push origin HEAD:abos/p011-lifecycle-recovery-v1
