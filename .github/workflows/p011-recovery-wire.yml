name: P011 Recovery Wire

on:
  push:
    branches:
      - abos/p011-lifecycle-recovery-v1
    paths:
      - scripts/p011_recovery_patch.py
      - .github/workflows/p011-recovery-wire.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: abos/p011-lifecycle-recovery-v1
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply exact P-011 recovery patch
        run: python scripts/p011_recovery_patch.py
      - name: Remove temporary patch machinery
        run: git rm scripts/p011_recovery_patch.py .github/workflows/p011-recovery-wire.yml
      - name: Commit exact patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/replication/runtime-control.ts src/heartbeat/tasks.ts
          git diff --cached --check
          git commit -m "P-011 make auto-heal recovery idempotent"
          git push origin HEAD:abos/p011-lifecycle-recovery-v1
