name: P012 Final Evidence Reconcile

on:
  push:
    branches:
      - abos/p012-transactional-self-modification

permissions:
  contents: write

jobs:
  reconcile:
    if: github.event.head_commit.message == 'P-012 stage final autonomy evidence reconciliation'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reconcile canonical P-012 evidence
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_exact(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'expected block not found in {path}: {old[:100]!r}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          # C0008: preserve full history above, replace only the stale post-reaudit tail.
          p = Path('ProjectOps/continuity/C0008.md')
          text = p.read_text(encoding='utf-8')
          text = text.replace(
              'Classification: PARCIAL — source E3 previo verde; reauditoría de autonomía detectó over-protection y ausencia de edición multiarchivo que deben corregirse antes de integración en `main`; cierre completo sigue dependiendo de P-013 evidence/correlation',
              'Classification: HECHO source/integration E3 en rama; NO HECHO cierre completo hasta integración/revalidación en `main` + P-013 evidence/correlation',
              1,
          )
          marker = '### Estado actual tras reauditoría\n'
          if marker not in text:
              raise SystemExit('C0008 stale re-audit tail marker not found')
          text = text[:text.index(marker)] + '''### Corrección final de autonomía — critical source evolutivo + multiarchivo\n\nLa reauditoría previa al merge se implementó sin cambiar la transaction authority elegida:\n\n- `isProtectedFile()` conserva protección amplia para **raw/direct writes** que no poseen candidate verification; por tanto tools, Policy, self-mod engine y otras piezas críticas siguen sin poder ser sobrescritas por una ruta bruta.\n- `isImmutableFile()` separa la frontera que una transacción verificada tampoco puede cruzar: credenciales/secrets, estado SQLite/config sensible, constitución y paths externos sensibles. **Código crítico ≠ código inmutable.**\n- `self-mod`, tools/router, Policy, skills y `package.json` pueden evolucionar mediante candidate aislado + full verification + activation causal. No se congela la propia maquinaria que ABOS necesita mejorar.\n- `editFiles()` añade una sola transacción multiarchivo; `editFile()` queda como wrapper backward-compatible. Una modificación coherente como `package.json + pnpm-lock.yaml + source` comparte candidate, verification, commit y activation.\n- El tool `edit_own_file` acepta el contrato histórico `path + content` o `edits=[{path,content}, ...]`; mezclar ambos se rechaza como intent ambiguo. Policy valida todos los paths de una request multiarchivo.\n- Duplicate targets se rechazan antes de crear journal/lease; paths unchanged no abren cambio material.\n- Se retiró el threshold arbitrario de 100 KB por archivo como supuesta safety authority. El tamaño válido sigue sujeto a límites reales de transporte/recursos cuando existan; activation safety depende de isolation/verification/CAS/recovery.\n- Tests Git reales prueban que source crítico + metadata de dependencias activan atómicamente cuando el candidate pasa y que **ningún archivo activo cambia** cuando la verification falla.\n- `constitution.md` y las demás fronteras realmente inmutables se rechazan antes de abrir una transacción.\n\n### Evidencia de aplicación y falsación\n\n- Primer aplicador `34925472567`: **FAIL antes de source** en `actions/setup-node` porque `cache: pnpm` se inicializó antes de instalar pnpm. Todos los pasos de aplicación quedaron skipped; clasificación: scaffolding temporal, 0 product source.\n- Segundo aplicador `34925559023`: install/apply/typecheck PASS; targeted tests **124/125 PASS**. El único rojo fue una expectativa textual (`immutable` vs `constitutional immutability boundary`); los tests materiales multiarchivo/isolation/routing/security pasaron. No se creó product commit.\n- Aplicador reconciliado `34925618440`: frozen install, apply, typecheck, **125/125 targeted tests**, ProjectOps y `git diff --check` PASS; sólo entonces creó el source limpio y eliminó sus propios helpers.\n- Source limpio: `84399f491856ca8a6195bbb8c08940ab8201f5d8` (`P-012 preserve transactional autonomy for critical multi-file self-mod`). Los helpers temporales `.github/p012_autonomy_apply.py` y `.github/workflows/p012-autonomy-apply.yml` están ausentes en ese tree.\n- Como el push del `GITHUB_TOKEN` no redisparó los workflows normales, se creó `991650ce5deb7e170a99647bf5246982bc7cd37a` con el **mismo tree** `b2a83d7f4caedcc72716f7ceb7e17909c3f6d91d`; compare `84399f... → 991650...` = **0 archivos cambiados**. No es una alteración de source, sólo el exact-head verificable por CI normal.\n- Exact-head `991650ce5deb7e170a99647bf5246982bc7cd37a`: CI `34925701691` **SUCCESS**; ProjectOps `34925701696` **SUCCESS**. Node 22/24 typecheck + build + full tests + security tests, Windows 22/24, public-distribution smoke 22/24, dependency audit y rebrand integrity todos PASS.\n\n### Estado verificable final de source P-012\n\n**HECHO en rama / E3:** journal/lease v17, candidate isolation, multi-file atomic self-edit, critical-source evolution through verified candidates, exact commit, stale-base/dirty protection, activation CAS, post-probe/causal recovery, edit/revert/reset/pull convergence, write-to-runtime routing, alias/symlink hardening, no frequency-as-safety y no arbitrary per-file size-as-safety.\n\n**NO HECHO todavía:** squash/integración de este tree en `main`, revalidación del `main` resultante y P-013 evidence/correlation transversal. Por tanto P-012 permanece `EN_EJECUCIÓN`; no se declara HECHO completo.\n\n### Siguiente punto verificable\n\n1. Reconciliar `ProjectOps/CONTINUITY.md`, `ProjectOps/PLAN.md` y `ProjectOps/plan/P-012.md` con `991650...` y gatear este head documental.\n2. Confirmar que `main` no tiene drift incompatible, abrir PR P-012 contra `main`, verificar exact-head/reviews/threads y squash merge.\n3. Revalidar el `main` resultante con CI + ProjectOps.\n4. Activar P-013 desde ese `main` verde y correlacionar decision/request → self-mod transaction → verification → activation/recovery/outcome.\n5. Sólo con evidencia P-013 suficiente elevar P-012 a HECHO completo; no reabrir su arquitectura salvo defecto reproducible.\n'''
          p.write_text(text, encoding='utf-8')

          # Root continuity: update final authority while preserving earlier historical gate evidence.
          replace_exact(
              'ProjectOps/CONTINUITY.md',
              'Last-Reconciled-Host-Head: a1df8fbd6bd8014cba47d61db8132eb900b43843\nLast-Reconciled-Head-Semantics: P012_SOURCE_E3_GREEN_PRE_MAIN_INTEGRATION',
              'Last-Reconciled-Host-Head: 991650ce5deb7e170a99647bf5246982bc7cd37a\nLast-Reconciled-Head-Semantics: P012_FINAL_AUTONOMY_SOURCE_E3_GREEN_PRE_MAIN_INTEGRATION',
          )
          replace_exact(
              'ProjectOps/CONTINUITY.md',
              'P012-Final-Source-Head: a1df8fbd6bd8014cba47d61db8132eb900b43843\nP012-Final-Source-CI: 34923711742 SUCCESS\nP012-Final-Source-ProjectOps: 34923711160 SUCCESS\nP012-Continuity-Reconcile-Head: 887bc5107245bf538db7cd272b9034a97ac2a579',
              'P012-Pre-Autonomy-Source-Head: a1df8fbd6bd8014cba47d61db8132eb900b43843\nP012-Pre-Autonomy-Source-CI: 34923711742 SUCCESS\nP012-Pre-Autonomy-Source-ProjectOps: 34923711160 SUCCESS\nP012-Autonomy-Targeted-Apply: 34925618440 SUCCESS\nP012-Final-Source-Commit: 84399f491856ca8a6195bbb8c08940ab8201f5d8\nP012-Final-Gate-Head: 991650ce5deb7e170a99647bf5246982bc7cd37a\nP012-Final-Source-CI: 34925701691 SUCCESS\nP012-Final-Source-ProjectOps: 34925701696 SUCCESS\nP012-Continuity-Reconcile-Head: 887bc5107245bf538db7cd272b9034a97ac2a579',
          )
          replace_exact(
              'ProjectOps/CONTINUITY.md',
              '`Last-Reconciled-Host-Head` es el product/test exact-head P-012 `a1df8fbd6bd8014cba47d61db8132eb900b43843`, validado por CI `34923711742` y ProjectOps `34923711160`. La rama contiene además reconciliación documental posterior, sin cambios de product source desde ese exact-head.',
              '`Last-Reconciled-Host-Head` es `991650ce5deb7e170a99647bf5246982bc7cd37a`, exact-head normal-gated del tree productivo P-012 final `b2a83d7f4caedcc72716f7ceb7e17909c3f6d91d`; CI `34925701691` y ProjectOps `34925701696` son SUCCESS. El source real fue producido en `84399f491856ca8a6195bbb8c08940ab8201f5d8`; `991650...` apunta al mismo tree y sólo existe para obtener un gate normal después del push de GitHub Actions.',
          )
          replace_exact(
              'ProjectOps/CONTINUITY.md',
              '- P-012: EN_EJECUCIÓN — source/integration E3 **HECHO en rama** sobre `a1df8fbd...`; integración `main` y evidence/correlation P-013 siguen NO HECHO, por lo que no se eleva todavía a HECHO completo.',
              '- P-012: EN_EJECUCIÓN — source/integration E3 **HECHO en rama** sobre `991650ce...` (mismo product tree que `84399f49...`), incluida autonomía crítica multiarchivo; integración `main` y evidence/correlation P-013 siguen NO HECHO, por lo que no se eleva todavía a HECHO completo.',
          )
          replace_exact(
              'ProjectOps/CONTINUITY.md',
              '- `10/hour` y `20/hour` fueron retirados como safety authority; cada cambio se decide por isolation/verification/recovery.\n\nFrontera consciente:',
              '- `10/hour` y `20/hour` fueron retirados como safety authority; cada cambio se decide por isolation/verification/recovery;\n- direct-write protection se separa de transactional immutability: código crítico (self-mod, tools, Policy, skills, dependencies) puede evolucionar sólo por candidate verificado;\n- `edit_own_file` soporta single-file backward-compatible y `edits[]` multiarchivo atómico mediante una única `editFiles()` authority;\n- el threshold fijo de 100 KB fue retirado como falsa safety authority; límites reales de recursos/transporte siguen aplicando cuando el entorno los demuestre.\n\nFrontera consciente:',
          )
          replace_exact(
              'ProjectOps/CONTINUITY.md',
              'Evidencia branch final product/test: `a1df8fbd6bd8014cba47d61db8132eb900b43843`; CI `34923711742` SUCCESS; ProjectOps `34923711160` SUCCESS; Node 22/24 full+security, Windows 22/24, public smoke 22/24, dependency audit y rebrand PASS. Node 24 registró 122 archivos / 1969 tests full PASS y 22 archivos / 154 tests security focalizado PASS.',
              'Evidencia final branch: aplicador dirigido `34925618440` PASS con 125/125 tests focalizados; source limpio `84399f491856ca8a6195bbb8c08940ab8201f5d8`; exact-head normal-gated `991650ce5deb7e170a99647bf5246982bc7cd37a` sobre el mismo tree, CI `34925701691` SUCCESS y ProjectOps `34925701696` SUCCESS. Node 22/24 full+security, Windows 22/24, public smoke 22/24, dependency audit y rebrand todos PASS.',
          )

          # PLAN manifest.
          replace_exact(
              'ProjectOps/PLAN.md',
              '| P-012 | Convertir self-modification en transacción segura y recuperable | EN_EJECUCIÓN | source E3 green en rama `a1df8fbd...`; integrar/revalidar `main`; evidence P-013 antes de cierre completo | plan/P-012.md |',
              '| P-012 | Convertir self-modification en transacción segura y recuperable | EN_EJECUCIÓN | source E3 green final en rama `991650ce...` (tree `84399f49...`); integrar/revalidar `main`; evidence P-013 antes de cierre completo | plan/P-012.md |',
          )
          replace_exact(
              'ProjectOps/PLAN.md',
              'P-012 ya implementó y branch-gateó su source transaccional: journal/lease SQLite v17, candidate Git worktree aislado, verification previa, candidate commit exacto, activation compare-and-swap, post-probe/rollback/recovery causal y convergencia de edit/revert/reset/pull/write-to-runtime. Se retiraron `10/hour` y `20/hour` como safety authority; autonomía de self-mod permanece abierta y auditable, sin creator approval por cada corrección. Exact-head product/test `a1df8fbd6bd8014cba47d61db8132eb900b43843`: CI `34923711742` + ProjectOps `34923711160` SUCCESS. Todavía no es `HECHO`: falta integración/revalidación de `main` y evidence/correlation P-013 exigida por su Definition of Done.',
              'P-012 ya implementó y branch-gateó su source transaccional final: journal/lease SQLite v17, candidate Git worktree aislado, verification previa, candidate commit exacto, activation compare-and-swap, post-probe/rollback/recovery causal y convergencia de edit/revert/reset/pull/write-to-runtime. La reauditoría final separó direct-write protection de verdadera immutability: código crítico y dependencias pueden evolucionar en candidate verificado, `edit_own_file` soporta cambios multiarchivo atómicos y se retiró el threshold arbitrario de 100 KB además de `10/hour`/`20/hour` como falsas safety authorities. Source limpio `84399f491856ca8a6195bbb8c08940ab8201f5d8`; exact-head con el mismo tree `991650ce5deb7e170a99647bf5246982bc7cd37a`: CI `34925701691` + ProjectOps `34925701696` SUCCESS. Todavía no es `HECHO`: falta integración/revalidación de `main` y evidence/correlation P-013 exigida por su Definition of Done.',
          )

          # P-012 module.
          replace_exact(
              'ProjectOps/plan/P-012.md',
              '- constitution/core protection no se desactiva por self-mod;',
              '- constitution/credentials/runtime-state/config-secret boundaries no se desactivan por self-mod;\n- código crítico no se confunde con inmutabilidad: self-mod engine, tools, Policy, skills y dependency source pueden evolucionar únicamente mediante candidate verificado;',
          )
          replace_exact(
              'ProjectOps/plan/P-012.md',
              '7. Más de 10 cambios pequeños/verificados pueden ser legítimos sin usar frecuencia como safety authority; un solo cambio no recuperable se bloquea aunque el contador esté vacío.\n8. Node 22/24, Windows 22/24, full tests, security, rebrand, dependency audit, public smoke y ProjectOps Integrity.\n9. P-013 evidence/correlation sigue requerida antes de cierre completo.',
              '7. Más de 10 cambios pequeños/verificados pueden ser legítimos sin usar frecuencia como safety authority; un solo cambio no recuperable se bloquea aunque el contador esté vacío.\n8. Critical-source + dependency metadata multiarchivo se verifican/activan como una sola transacción; candidate failure conserva todos los archivos activos.\n9. Node 22/24, Windows 22/24, full tests, security, rebrand, dependency audit, public smoke y ProjectOps Integrity.\n10. P-013 evidence/correlation sigue requerida antes de cierre completo.',
          )
          replace_exact(
              'ProjectOps/plan/P-012.md',
              '- `10/hour` policy y `20/hour` local fueron retirados como safety authority; 50 self-edits históricos no producen deny por frecuencia en la prueba de autoridad;\n- exact-head product/test `a1df8fbd6bd8014cba47d61db8132eb900b43843`: CI `34923711742` SUCCESS y ProjectOps `34923711160` SUCCESS;\n- Node 22/24 full+security, Windows 22/24, public smoke 22/24, dependency audit y rebrand PASS.',
              '- `10/hour` policy y `20/hour` local fueron retirados como safety authority; 50 self-edits históricos no producen deny por frecuencia en la prueba de autoridad;\n- direct-write protection y transactional immutability están separadas: source crítico permanece protegido frente a bypass bruto pero puede evolucionar mediante candidate verificado;\n- `editFiles()` implementa multiarchivo atómico y `editFile()` conserva compatibilidad single-file; tool/Policy aceptan y validan todos los paths de `edits[]`;\n- el threshold fijo de 100 KB fue retirado como falsa source-safety authority;\n- targeted autonomy applicator `34925618440`: typecheck + 125/125 tests focalizados + ProjectOps + diff-check PASS; source limpio `84399f491856ca8a6195bbb8c08940ab8201f5d8`;\n- exact-head normal-gated sobre el mismo product tree `991650ce5deb7e170a99647bf5246982bc7cd37a`: CI `34925701691` SUCCESS y ProjectOps `34925701696` SUCCESS;\n- Node 22/24 full+security, Windows 22/24, public smoke 22/24, dependency audit y rebrand PASS.',
          )

          print('P-012 final evidence reconciled')
          PY
      - name: Verify ProjectOps
        run: node scripts/projectops-integrity-verify.mjs
      - name: Verify diff syntax
        run: git diff --check
      - name: Commit reconciliation and remove helper
        shell: bash
        run: |
          git config user.name "ABOS P-012 Automation"
          git config user.email "actions@users.noreply.github.com"
          git add ProjectOps/CONTINUITY.md ProjectOps/PLAN.md ProjectOps/continuity/C0008.md ProjectOps/plan/P-012.md
          git rm .github/workflows/p012-doc-reconcile.yml
          git commit -m "P-012 reconcile final autonomy evidence before main integration"
          git push origin HEAD:${GITHUB_REF_NAME}
