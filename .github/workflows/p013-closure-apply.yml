name: P013 Causal Invariant And Restart E2E Apply

on:
  push:
    branches:
      - abos/p013-observability-evidence-fabric
    paths:
      - .github/workflows/p013-closure-apply.yml

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply causal invariant and restart E2E
        run: python .github/p013_closure_apply.py
      - name: Normalize remaining adaptive causation producers
        run: python .github/p013_closure_fix_apply.py
      - name: Inspect causation producers
        run: |
          echo '--- causationId producers after normalization ---'
          grep -R -n --include='*.ts' 'causationId:' src || true
          echo '--- forbidden adaptive domain-id causations ---'
          if grep -R -n --include='*.ts' 'causationId:.*correlationIdFor("adaptive_' src/intelligence; then
            echo 'Found domain identifiers in causation_id' >&2
            exit 1
          fi
      - name: Typecheck
        run: pnpm run typecheck
      - name: Targeted P-013 closure and regressions
        run: >-
          pnpm exec vitest run
          src/__tests__/p013-e2e-restart-correlation.test.ts
          src/__tests__/p013-evidence-fabric.test.ts
          src/__tests__/p013-inference-correlation.test.ts
          src/__tests__/p013-unified-inference-correlation.test.ts
          src/__tests__/p013-adaptive-correlation.test.ts
          src/__tests__/p013-environment-correlation.test.ts
          src/__tests__/p013-heartbeat-correlation.test.ts
          src/__tests__/p013-policy-selfmod-correlation.test.ts
          src/__tests__/p011-heartbeat-timeout-recovery.test.ts
          src/__tests__/inference-router.test.ts
          src/__tests__/inference/inference-client.test.ts
          src/__tests__/orchestration/planner.test.ts
          src/__tests__/orchestration/orchestrator.test.ts
          src/__tests__/policy-engine.test.ts
      - name: ProjectOps integrity
        run: node scripts/projectops-integrity-verify.mjs
      - name: Diff check
        run: git diff --check
      - name: Commit clean product source
        env:
          BRANCH: abos/p013-observability-evidence-fabric
        run: |
          rm -f .github/p013_closure_apply.py .github/p013_closure_fix_apply.py .github/workflows/p013-closure-apply.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git diff --cached --quiet && { echo "No source changes to commit"; exit 1; }
          git commit -m "P-013: enforce event causation and prove restart reconstruction"
          git push origin "HEAD:${BRANCH}"
