name: P013 Integration Ready Reconcile

on:
  push:
    branches:
      - abos/p013-observability-evidence-fabric
    paths:
      - .github/workflows/p013-integration-ready-reconcile.yml

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: abos/p013-observability-evidence-fabric
          fetch-depth: 0

      - name: Verify audited parent
        shell: bash
        run: |
          test "$(git rev-parse HEAD^)" = "1800d610dbbdfe14fb991117c7a4061dab8ec8e5"
          git fetch origin main
          test "$(git rev-parse origin/main)" = "c94dbeba2d4672cd843580d3019d3af93d0ae728"

      - name: Reconcile integration-ready authorities
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          exact_head = "1800d610dbbdfe14fb991117c7a4061dab8ec8e5"
          ci = "35406279606"
          projectops = "35406279579"
          main = "c94dbeba2d4672cd843580d3019d3af93d0ae728"

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              if old not in text:
                  raise SystemExit(f"missing expected text in {path}: {old[:120]}")
              p.write_text(text.replace(old, new, 1), encoding="utf-8")

          replace_once(
              "ProjectOps/continuity/C0009.md",
              "Classification: E3_BRANCH_GREEN / MAIN_PROJECTOPS_SEMANTIC_UNION_APPLIED / MERGE_ANCESTRY_PENDING",
              "Classification: E3_BRANCH_GREEN / MAIN_ANCESTRY_AND_EXACT_GATE_VERIFIED / READY_FOR_INTEGRATION",
          )
          p = Path("ProjectOps/continuity/C0009.md")
          text = p.read_text(encoding="utf-8")
          marker = "## Main ancestry + exact gate checkpoint — 2026-09-18"
          if marker not in text:
              text += f'''\n\n{marker}\n\nState: EN_EJECUCIÓN / READY_FOR_INTEGRATION\nPlan-Reference: P-013\nExact-Head: `{exact_head}`\nCurrent-Main-Parent: `{main}`\nExact-Head-CI: `{ci}` SUCCESS\nExact-Head-ProjectOps: `{projectops}` SUCCESS\n\nLa divergencia de integración quedó resuelta sin alterar el tree semánticamente auditado: el merge commit `{exact_head}` tiene como parents el head P-013 reconciliado y `main {main}`; compare `ec91faef735df03c840fa0b5c73cf78da29687fc → {exact_head}` = 0 archivos, y compare `main → {exact_head}` reporta `behind_by=0`.\n\nEl gate ordinario del exact-head completó SUCCESS: Node 22/24 full+security, Windows 22/24, public distribution smoke 22/24, dependency audit, rebrand y ProjectOps. No existe defecto productivo conocido que invalide P-013.\n\nDecisión: recuperar `READY_FOR_INTEGRATION`; todavía NO `HECHO`. Siguiente frontera válida: gatear este cierre documental, abrir PR contra `main`, verificar mergeability/checks/review state, integrar y revalidar el HEAD exacto de `main`. P-012 permanece PARCIAL hasta esa integración.\n'''
          p.write_text(text, encoding="utf-8")

          replace_once(
              "ProjectOps/plan/P-013.md",
              "Evidence-State: E3_BRANCH_GREEN / MAIN_PROJECTOPS_SEMANTIC_UNION_APPLIED / MERGE_ANCESTRY_PENDING",
              "Evidence-State: E3_BRANCH_GREEN / MAIN_ANCESTRY_AND_EXACT_GATE_VERIFIED / READY_FOR_INTEGRATION",
          )
          p = Path("ProjectOps/plan/P-013.md")
          text = p.read_text(encoding="utf-8")
          anchor = "- branch ProjectOps `35397538980`: SUCCESS\n"
          addition = anchor + f"- main ancestry merge exact-head: `{exact_head}`; second parent `main {main}`; compare from prior reconciled head = 0 files\n- ancestry exact-head CI `{ci}`: SUCCESS\n- ancestry exact-head ProjectOps `{projectops}`: SUCCESS\n"
          if "- ancestry exact-head CI `35406279606`: SUCCESS" not in text:
              if anchor not in text:
                  raise SystemExit("missing P-013 branch ProjectOps anchor")
              text = text.replace(anchor, addition, 1)
          text = text.replace(
              "- P-013 permanece `EN_EJECUCIÓN / READY_FOR_INTEGRATION`; no se declara `HECHO` antes del merge y revalidación de `main`.",
              "- P-013 permanece `EN_EJECUCIÓN / READY_FOR_INTEGRATION`; ancestry de `main` y exact-head E3 ya están verificados; no se declara `HECHO` antes del PR/merge y revalidación de `main`.",
              1,
          )
          p.write_text(text, encoding="utf-8")

          replace_once(
              "ProjectOps/CONTINUITY.md",
              "Active-Intervention: P013_OBSERVABILITY_EVIDENCE_FABRIC — E3_BRANCH_GREEN / MAIN_PROJECTOPS_SEMANTIC_UNION_APPLIED / MERGE_ANCESTRY_PENDING",
              "Active-Intervention: P013_OBSERVABILITY_EVIDENCE_FABRIC — E3_BRANCH_GREEN / MAIN_ANCESTRY_AND_EXACT_GATE_VERIFIED / READY_FOR_INTEGRATION",
          )
          replace_once(
              "ProjectOps/CONTINUITY.md",
              "Last-Reconciled-Host-Head: 326149d1ce18d65674006d8c13db95d068acb01a",
              f"Last-Reconciled-Host-Head: {exact_head}",
          )
          replace_once(
              "ProjectOps/CONTINUITY.md",
              "Last-Reconciled-Head-Semantics: P013_E3_BRANCH_GREEN_MAIN_DIVERGENCE_DISCOVERED",
              "Last-Reconciled-Head-Semantics: P013_E3_BRANCH_GREEN_MAIN_ANCESTRY_AND_EXACT_GATE_VERIFIED",
          )
          replace_once(
              "ProjectOps/CONTINUITY.md",
              "Main-ProjectOps-Reconciliation-State: SEMANTIC_UNION_APPLIED / ANCESTRY_AND_EXACT_GATE_PENDING",
              "Main-ProjectOps-Reconciliation-State: SEMANTIC_UNION_APPLIED / ANCESTRY_AND_EXACT_GATE_VERIFIED",
          )
          replace_once(
              "ProjectOps/CONTINUITY.md",
              "- P-013: EN_EJECUCIÓN / E3_BRANCH_GREEN — product fabric, critical chains, restart/E2E y economía correlacionada continúan validados; la autoridad ProjectOps de `main c94dbeba...` fue semánticamente unificada, pero ancestry merge + exact gate siguen pendientes. No está HECHO ni READY_FOR_INTEGRATION hasta cruzar esos gates.",
              "- P-013: EN_EJECUCIÓN / READY_FOR_INTEGRATION — product fabric, critical chains, restart/E2E y economía correlacionada continúan validados; la autoridad ProjectOps de `main c94dbeba...`, su ancestry y el exact-head E3 quedaron verificados. No está HECHO: faltan PR/merge y revalidación exacta de `main`.",
          )
          p = Path("ProjectOps/CONTINUITY.md")
          text = p.read_text(encoding="utf-8")
          anchor = "P013-Integration-State: READY_FOR_INTEGRATION / NOT_HECHO\n"
          extra = anchor + f"P013-Ancestry-Gate-Head: {exact_head}\nP013-Ancestry-Gate-CI: {ci} SUCCESS\nP013-Ancestry-Gate-ProjectOps: {projectops} SUCCESS\n"
          if "P013-Ancestry-Gate-Head:" not in text:
              if anchor not in text:
                  raise SystemExit("missing CONTINUITY P013 integration anchor")
              text = text.replace(anchor, extra, 1)
          p.write_text(text, encoding="utf-8")

          replace_once(
              "ProjectOps/PLAN.md",
              "| P-013 | Unificar Observability, Audit y Evidence Fabric | EN_EJECUCIÓN | P-008 + P-009; product E3-green; main `c94dbeba...` ProjectOps semantic union applied; ancestry merge + exact gate + PR/main revalidation pendientes | plan/P-013.md |",
              "| P-013 | Unificar Observability, Audit y Evidence Fabric | EN_EJECUCIÓN | P-008 + P-009; product E3-green; main ancestry + exact gate verified; READY_FOR_INTEGRATION; PR/merge + main revalidation pendientes | plan/P-013.md |",
          )

          p = Path("ProjectOps/PROJECT.md")
          text = p.read_text(encoding="utf-8")
          old = "P-013 Observability/Audit/Evidence Fabric es la intervención activa: el product tree está E3-green; antes del PR debe reconciliar e incorporar la autoridad ProjectOps de `main c94dbeba...`."
          new = "P-013 Observability/Audit/Evidence Fabric es la intervención activa: el product tree está E3-green y la autoridad/ancestry ProjectOps de `main c94dbeba...` ya fue reconciliada y exact-head gateada; la siguiente frontera es PR/merge + revalidación exacta de `main`."
          if old not in text:
              raise SystemExit("missing PROJECT active P-013 statement")
          p.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY

          node scripts/projectops-integrity-verify.mjs
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ProjectOps/CONTINUITY.md ProjectOps/PLAN.md ProjectOps/PROJECT.md ProjectOps/continuity/C0009.md ProjectOps/plan/P-013.md
          git commit -m "ProjectOps: mark P-013 integration ready after ancestry gate"
          git push origin HEAD:abos/p013-observability-evidence-fabric

      - name: Remove one-shot reconciler
        shell: bash
        run: |
          git rm .github/workflows/p013-integration-ready-reconcile.yml
          git commit -m "chore(p013): retire integration-ready reconciler"
          git push origin HEAD:abos/p013-observability-evidence-fabric
