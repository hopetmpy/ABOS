name: P013 P012 Test Reconcile

on:
  push:
    branches:
      - abos/p013-observability-evidence-fabric

permissions:
  contents: write

jobs:
  reconcile:
    if: ${{ !contains(github.event.head_commit.message, '[p013-p012-test-reconciled]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile
      - name: Restore exact historical test and apply minimal reconciliation
        run: python .github/p013_p012_test_reconcile.py
      - name: Verify only intended test semantics changed
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git diff --numstat ab54ef565e76e254071a8a1cbc68477a76d169d7 -- src/__tests__/p012-self-mod-transaction.test.ts
      - name: Run affected P-012 and P-013 tests
        run: pnpm exec vitest run src/__tests__/p012-self-mod-transaction.test.ts src/__tests__/p013-evidence-fabric.test.ts
      - name: Typecheck
        run: pnpm run typecheck
      - name: Verify ProjectOps integrity
        run: node scripts/projectops-integrity-verify.mjs
      - name: Commit clean reconciliation and remove helpers
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/p013_p012_test_reconcile.py .github/workflows/p013-p012-test-reconcile.yml
          git config user.name "hopetmpy"
          git config user.email "hope.tmpy@gmail.com"
          git add -A
          git diff --cached --check
          git commit -m "P-013 minimally reconcile P-012 schema evolution test [p013-p012-test-reconciled]"
          git push origin HEAD:abos/p013-observability-evidence-fabric
