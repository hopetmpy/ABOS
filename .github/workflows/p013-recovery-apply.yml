name: P013 Recovery Apply

on:
  push:
    branches:
      - abos/p013-observability-evidence-fabric
    paths:
      - .github/workflows/p013-recovery-apply.yml

permissions:
  contents: write

jobs:
  reconcile-and-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: abos/p013-observability-evidence-fabric
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Reconcile recoverable P-013 state before source edit
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          continuity = Path('ProjectOps/CONTINUITY.md')
          text = continuity.read_text(encoding='utf-8')
          replacements = {
            'Active-Intervention: P013_OBSERVABILITY_EVIDENCE_FABRIC — CORE_V18_E3_GREEN / CRITICAL_CHAIN_PENDING':
              'Active-Intervention: P013_OBSERVABILITY_EVIDENCE_FABRIC — MULTI_DOMAIN_EVIDENCE_IMPLEMENTED / ECONOMIC_GATE_BLOCKED_LEGACY_POLICY_FIXTURE',
            'Last-Reconciled-Host-Head: 04d2dee9349910bc8664073bfa58f34917e3e6fb':
              'Last-Reconciled-Host-Head: 6b0ee960baae6ffdc871628777a1acc0f4ea6a26',
            'Last-Reconciled-Head-Semantics: P013_CORE_V18_E3_GREEN_CRITICAL_CHAIN_PENDING':
              'Last-Reconciled-Head-Semantics: P013_MULTI_DOMAIN_IMPLEMENTED_ECONOMIC_GATE_BLOCKED_TEST_FIXTURE',
          }
          for old, new in replacements.items():
            if old not in text:
              raise SystemExit(f'missing continuity marker: {old}')
            text = text.replace(old, new, 1)
          anchor = 'P013-Core-ProjectOps: 34928243697 SUCCESS\n'
          addition = '''P013-Recovery-Audit-Head: 6b0ee960baae6ffdc871628777a1acc0f4ea6a26
P013-Economic-Source-Head: 3941b2299b620a117cb59956b58933e992371664
P013-Economic-Gate-Head: 6b0ee960baae6ffdc871628777a1acc0f4ea6a26
P013-Economic-Gate-CI: 35395401873 FAILURE — 2009/2011 PASS; 2 legacy Policy fixture failures (missing evidence_events)
P013-Economic-Gate-ProjectOps: 35395401886 SUCCESS
'''
          if 'P013-Recovery-Audit-Head:' not in text:
            if anchor not in text:
              raise SystemExit('missing P013 core anchor')
            text = text.replace(anchor, anchor + addition, 1)
          old_sem = '`Last-Reconciled-Host-Head` es `04d2dee9349910bc8664073bfa58f34917e3e6fb`, exact-head del Core v18 P-013 después de reconciliar el único test histórico P-012 que fijaba schema 17. CI `34928243681` y ProjectOps `34928243697` son SUCCESS. El source Core fue producido en `4e24c068...`; `04d2dee...` conserva el mismo tree productivo más la reconciliación mínima del test histórico.'
          new_sem = '`Last-Reconciled-Host-Head` es `6b0ee960baae6ffdc871628777a1acc0f4ea6a26`. La rama ya avanzó más allá del Core v18: Policy/self-mod, inference, adaptive, environment, heartbeat, unificación causal/restart y la unidad económica están materialmente presentes. El source económico más reciente es `3941b229...`; el gate same-tree `6b0ee960...` conserva ese producto. ProjectOps `35395401886` es SUCCESS, pero CI `35395401873` es FAILURE: 2009/2011 tests PASS y los únicos dos fallos provienen del helper legacy `createRawTestDb()` de `policy-engine.test.ts`, que fabrica Policy/spend pero no la tabla v18 `evidence_events`. El runtime fresh/migrado sí exige v18; por tanto la decisión es CORRECT sobre el fixture, no debilitar el fail-closed productivo.'
          if old_sem not in text:
            raise SystemExit('missing reconciled semantics paragraph')
          text = text.replace(old_sem, new_sem, 1)
          continuity.write_text(text, encoding='utf-8')

          plan = Path('ProjectOps/plan/P-013.md')
          text = plan.read_text(encoding='utf-8')
          old = 'Evidence-State: E3_CORE_V18_GREEN / CRITICAL_CHAIN_PENDING'
          new = 'Evidence-State: E3_MULTI_DOMAIN_IMPLEMENTED / ECONOMIC_GATE_BLOCKED_LEGACY_POLICY_FIXTURE'
          if old not in text:
            raise SystemExit('missing P-013 evidence state')
          text = text.replace(old, new, 1)
          anchor = '- Core v18 ProjectOps `34928243697`: SUCCESS\n'
          addition = '''- recovery audit head: `6b0ee960baae6ffdc871628777a1acc0f4ea6a26`
- latest economic source: `3941b2299b620a117cb59956b58933e992371664`
- latest economic gate CI `35395401873`: FAILURE — 2009/2011 tests PASS; only 2 legacy Policy fixture failures because its hand-built DB omits v18 `evidence_events`
- latest economic gate ProjectOps `35395401886`: SUCCESS
'''
          if 'recovery audit head:' not in text:
            if anchor not in text:
              raise SystemExit('missing P-013 activation anchor')
            text = text.replace(anchor, anchor + addition, 1)
          state_section = '''
## Estado de ejecución reconciliado — 2026-09-18

La realidad de la rama invalida el antiguo supuesto `CRITICAL_CHAIN_PENDING`; ese texto había quedado atrás de la ejecución y no debe gobernar nuevas modificaciones.

- Core v18 ya está implementado y tuvo gate E3 aceptado.
- Policy/self-mod, inference, adaptive, environment, heartbeat, unificación de identidad causal y E2E restart ya tienen source dedicado en la rama; sus suites P-013 aparecen PASS en el gate económico actual.
- La unidad económica está implementada en `3941b229...` y conserva authorities financieras/Policy separadas del evidence fabric; el gate `6b0ee960...` no demuestra E3 porque CI está rojo.
- La causa discriminada del rojo actual no es un defecto productivo demostrado: `policy-engine.test.ts` construye una SQLite parcial pre-v18 y `executeTool` protegido ahora exige evidencia v18 fail-closed. Runtime fresh/migrado crea/migra schema 18.
- Decisión antes de continuar source: `CORRECT` el fixture legacy reutilizando `MIGRATION_V18_EVIDENCE_FABRIC`; no introducir fallback productivo ni una segunda schema authority.
- P-013 permanece `EN_EJECUCIÓN`. Tras recuperar CI hay que auditar explícitamente las proyecciones operacionales y los criterios de cierre antes de declarar `HECHO`.

'''
          if '## Estado de ejecución reconciliado — 2026-09-18' not in text:
            obj = '## Objetivo\n'
            if obj not in text:
              raise SystemExit('missing P-013 objective marker')
            text = text.replace(obj, state_section + obj, 1)
          plan.write_text(text, encoding='utf-8')

          segment = Path('ProjectOps/continuity/C0009.md')
          text = segment.read_text(encoding='utf-8')
          checkpoint = '''

## Recovery checkpoint — 2026-09-18 — economic gate / legacy Policy fixture

State: EN_EJECUCIÓN
Plan-Reference: P-013
Recovery-Head: `6b0ee960baae6ffdc871628777a1acc0f4ea6a26`
Latest-Product-Source: `3941b2299b620a117cb59956b58933e992371664`
Gate-CI: `35395401873` FAILURE
Gate-ProjectOps: `35395401886` SUCCESS

La reconstrucción desde Git/source/evidence confirmó que P-013 avanzó materialmente después del último checkpoint Core `04d2dee...`: existen unidades Policy/self-mod, inference, adaptive, environment, heartbeat, causal restart y económica. La corrección transversal de cadencia ProjectOps también ya está incorporada en `AGENTS.md`; no es una intervención pendiente separada.

El gate económico actual ejecutó 2011 tests: 2009 PASS y 2 FAIL, ambos en `src/__tests__/policy-engine.test.ts`. Los P-013 dedicados, incluido `p013-economic-correlation`, pasaron. Ambos fallos legacy reciben `Policy persistence failed closed: no such table: evidence_events`.

Hipótesis discriminadas:
- H_FIXTURE_DRIFT — CONFIRMADA: `createRawTestDb()` fabrica manualmente `policy_decisions` y `spend_tracking`, pero omite la tabla v18; `createTestDb()` y `createDatabase()` sí crean/migran al schema 18.
- H_RUNTIME_COMPAT — FALSADA para este fallo: el contrato runtime actual es schema 18; añadir un fallback silencioso a Policy degradaría el invariante de evidencia fail-closed.
- NO_CHANGE — FALSADA: el gate está rojo y los dos tests pretenden verificar semántica allow/deny, no ausencia deliberada de schema.

Decision: `CORRECT` exclusivamente el fixture legacy reutilizando `MIGRATION_V18_EVIDENCE_FABRIC`. No cambiar product source, no crear schema paralela y no debilitar Policy fail-closed. Validación inmediata: Policy legacy + P-013 Policy/self-mod + P-013 economía, typecheck, build, full suite y ProjectOps; después gate normal exact-head Node 22/24/Windows/public/security.
'''
          if '## Recovery checkpoint — 2026-09-18 — economic gate / legacy Policy fixture' not in text:
            text += checkpoint
          segment.write_text(text, encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ProjectOps/CONTINUITY.md ProjectOps/plan/P-013.md ProjectOps/continuity/C0009.md
          git commit -m "ProjectOps: reconcile P-013 economic gate recovery"
          git push origin HEAD:abos/p013-observability-evidence-fabric

      - name: Correct legacy Policy fixture against canonical v18 evidence schema
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/__tests__/policy-engine.test.ts')
          text = p.read_text(encoding='utf-8')
          import_anchor = 'import Database from "better-sqlite3";\n'
          import_line = 'import { MIGRATION_V18_EVIDENCE_FABRIC } from "../state/schema.js";\n'
          if import_line not in text:
            if import_anchor not in text:
              raise SystemExit('missing better-sqlite3 import anchor')
            text = text.replace(import_anchor, import_anchor + import_line, 1)
          needle = '  `);\n\n  return db;\n}\n\nfunction createMockSpendTracker()'
          replacement = '''  `);

  // This fixture intentionally remains smaller than the full runtime DB, but
  // protected executeTool paths now require the canonical v18 evidence
  // contract. Reuse its migration DDL instead of duplicating that schema here.
  db.exec(MIGRATION_V18_EVIDENCE_FABRIC);

  return db;
}

function createMockSpendTracker()'''
          if 'db.exec(MIGRATION_V18_EVIDENCE_FABRIC);' not in text:
            if needle not in text:
              raise SystemExit('missing createRawTestDb return anchor')
            text = text.replace(needle, replacement, 1)
          p.write_text(text, encoding='utf-8')
          PY

      - name: Targeted adversarial validation
        run: pnpm exec vitest run src/__tests__/policy-engine.test.ts src/__tests__/p013-policy-selfmod-correlation.test.ts src/__tests__/p013-economic-correlation.test.ts
      - name: Typecheck
        run: pnpm run typecheck
      - name: Build
        run: pnpm run build
      - name: Full test suite
        run: pnpm test
      - name: ProjectOps integrity
        run: node scripts/projectops-integrity-verify.mjs

      - name: Commit validated fixture correction
        shell: bash
        run: |
          git add src/__tests__/policy-engine.test.ts
          git commit -m "test(p013): align Policy fixture with evidence schema v18"
          git push origin HEAD:abos/p013-observability-evidence-fabric

      - name: Remove one-shot applicator
        if: success()
        shell: bash
        run: |
          git rm .github/workflows/p013-recovery-apply.yml
          git commit -m "chore(p013): retire recovery applicator"
          git push origin HEAD:abos/p013-observability-evidence-fabric
