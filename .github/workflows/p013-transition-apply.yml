name: P013 Transition Apply

on:
  push:
    branches:
      - abos/p013-observability-evidence-fabric

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[p013-transition-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply P-012 to P-013 transition
        run: python .github/p013_transition_apply.py

      - name: Verify ProjectOps integrity
        run: node scripts/projectops-integrity-verify.mjs

      - name: Diff check
        run: git diff --check

      - name: Commit clean transition and remove helpers
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/p013_transition_apply.py .github/workflows/p013-transition-apply.yml
          git config user.name "hopetmpy"
          git config user.email "hope.tmpy@gmail.com"
          git add -A
          git diff --cached --check
          git commit -m "P-013 activate evidence-fabric audit [p013-transition-applied]"
          git push origin HEAD:abos/p013-observability-evidence-fabric
