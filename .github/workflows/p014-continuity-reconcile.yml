name: P014 Root Continuity Reconcile

on:
  push:
    branches:
      - abos/p014-capability-fabric
    paths:
      - .github/workflows/p014-continuity-reconcile.yml

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Guard exact starting point
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "8747f52ddcd1bcaac163af31d6c15cc6ed1f5060"
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/p014-continuity-reconcile.yml"
          test -f scripts/p014-root-reconcile.py

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Reconcile root continuity
        run: python3 scripts/p014-root-reconcile.py

      - name: Verify ProjectOps after reconciliation
        run: node scripts/projectops-integrity-verify.mjs

      - name: Diff integrity
        run: git diff --check

      - name: Retire helpers and commit reconciliation
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/p014-continuity-reconcile.yml scripts/p014-root-reconcile.py
          git add ProjectOps/CONTINUITY.md
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs(projectops): reconcile P-014 root continuity"
          git push origin HEAD:abos/p014-capability-fabric
