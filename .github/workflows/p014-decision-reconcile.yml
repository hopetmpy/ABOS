name: P014 Decision Reconciler

on:
  push:
    branches:
      - abos/p014-capability-fabric
    paths:
      - .github/workflows/p014-decision-reconcile.yml

permissions:
  contents: write

jobs:
  reconcile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Record P-014 audit decision before source
        run: python scripts/p014-decision-reconcile.py
      - name: Verify decision checkpoint
        run: |
          node scripts/projectops-integrity-verify.mjs
          git diff --check
      - name: Commit decision checkpoint and retire temporary reconciler
        shell: bash
        run: |
          rm .github/workflows/p014-decision-reconcile.yml
          rm scripts/p014-decision-reconcile.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ProjectOps .github/workflows/p014-decision-reconcile.yml scripts/p014-decision-reconcile.py
          git diff --cached --check
          git commit -m "ProjectOps: record P-014 DECISION_READY"
          git push origin HEAD:abos/p014-capability-fabric
