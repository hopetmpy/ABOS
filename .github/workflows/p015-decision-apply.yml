name: P015 Decision Reconcile Apply

on:
  push:
    branches:
      - abos/p015-mcp-runtime
    paths:
      - .github/workflows/p015-decision-apply.yml

permissions:
  contents: write

concurrency:
  group: p015-decision-reconcile-apply
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Guard exact parent and branch
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = "abos/p015-mcp-runtime"
          test "$(git rev-parse HEAD^)" = "e70aa963b8bdc792ad239d1104e13275b04552bd"
          test -f scripts/p015-decision-reconcile.py
      - name: Apply DECISION_READY reconciliation
        run: python3 scripts/p015-decision-reconcile.py
      - name: Validate ProjectOps and diff integrity
        shell: bash
        run: |
          set -euo pipefail
          node scripts/projectops-integrity-verify.mjs
          git diff --check
          actual="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' 'ProjectOps/CONTINUITY.md' 'ProjectOps/continuity/C0011.md' 'ProjectOps/plan/P-015.md' | sort)"
          test "$actual" = "$expected"
      - name: Produce clean reconciliation commit
        shell: bash
        run: |
          set -euo pipefail
          rm scripts/p015-decision-reconcile.py .github/workflows/p015-decision-apply.yml
          node scripts/projectops-integrity-verify.mjs
          git diff --check
          actual="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' '.github/workflows/p015-decision-apply.yml' 'ProjectOps/CONTINUITY.md' 'ProjectOps/continuity/C0011.md' 'ProjectOps/plan/P-015.md' 'scripts/p015-decision-reconcile.py' | sort)"
          test "$actual" = "$expected"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'ProjectOps: P-015 decision ready'
          git push origin HEAD:abos/p015-mcp-runtime
