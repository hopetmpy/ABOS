name: P015 Hardening Close HTTP Audit

on:
  push:
    branches:
      - abos/p015-mcp-runtime
    paths:
      - .github/workflows/p015-hardening-close-http-audit.yml

permissions:
  contents: write

concurrency:
  group: p015-hardening-close-http-audit
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Guard exact parent
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = "abos/p015-mcp-runtime"
          test "$(git rev-parse HEAD^)" = "b2b50fc9f4c4e1810064d39f51c809163e659932"
          test -f scripts/p015-hardening-close-http-audit.py
      - name: Apply ProjectOps reconciliation
        run: python3 scripts/p015-hardening-close-http-audit.py
      - name: Validate reconciliation
        shell: bash
        run: |
          set -euo pipefail
          node scripts/projectops-integrity-verify.mjs
          git diff --check
          actual="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' 'ProjectOps/CONTINUITY.md' 'ProjectOps/continuity/C0011.md' 'ProjectOps/plan/P-015.md' | sort)"
          test "$actual" = "$expected"
      - name: Commit clean checkpoint
        shell: bash
        run: |
          set -euo pipefail
          rm scripts/p015-hardening-close-http-audit.py .github/workflows/p015-hardening-close-http-audit.yml
          node scripts/projectops-integrity-verify.mjs
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'ProjectOps: close MCP lifecycle hardening and open HTTP auth audit'
          git push origin HEAD:abos/p015-mcp-runtime
