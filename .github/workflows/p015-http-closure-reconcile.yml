name: P015 HTTP Bearer Closure Reconcile

on:
  push:
    branches:
      - abos/p015-mcp-runtime
    paths:
      - .github/workflows/p015-http-closure-reconcile.yml

permissions:
  contents: write

concurrency:
  group: p015-http-closure-reconcile
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 3
      - name: Guard exact E3 parent
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = "abos/p015-mcp-runtime"
          test "$(git rev-parse HEAD^)" = "e2fea4d5717061bad99306397280886ec70f1ab2"
          test "$(git rev-parse HEAD^^)" = "d1e23d9f142d73305f0abbfaea5cff38b8da3608"
          test -f scripts/p015-http-closure-reconcile.py
      - name: Apply closure reconciliation
        run: python3 scripts/p015-http-closure-reconcile.py
      - name: Validate ProjectOps closure
        shell: bash
        run: |
          set -euo pipefail
          node scripts/projectops-integrity-verify.mjs
          git diff --check
          actual="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' \
            'ProjectOps/CONTINUITY.md' \
            'ProjectOps/PLAN.md' \
            'ProjectOps/continuity/C0011.md' \
            'ProjectOps/plan/P-015.md' | sort)"
          test "$actual" = "$expected"
      - name: Commit clean technical closure
        shell: bash
        run: |
          set -euo pipefail
          rm scripts/p015-http-closure-reconcile.py .github/workflows/p015-http-closure-reconcile.yml
          node scripts/projectops-integrity-verify.mjs
          git diff --check
          actual="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' \
            '.github/workflows/p015-http-closure-reconcile.yml' \
            'ProjectOps/CONTINUITY.md' \
            'ProjectOps/PLAN.md' \
            'ProjectOps/continuity/C0011.md' \
            'ProjectOps/plan/P-015.md' \
            'scripts/p015-http-closure-reconcile.py' | sort)"
          test "$actual" = "$expected"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'ProjectOps: close P-015 technical objective in branch'
          git push origin HEAD:abos/p015-mcp-runtime
