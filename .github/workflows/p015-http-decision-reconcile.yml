name: P015 HTTP Bearer Decision Reconcile

on:
  push:
    branches:
      - abos/p015-mcp-runtime
    paths:
      - .github/workflows/p015-http-decision-reconcile.yml

permissions:
  contents: write

concurrency:
  group: p015-http-decision-reconcile
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Guard exact parent
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = "abos/p015-mcp-runtime"
          test "$(git rev-parse HEAD^)" = "447e141a8377c8a61c7e8352443feac94776d9e9"
          test -f scripts/p015-http-decision-reconcile.py
      - name: Apply decision reconciliation
        run: python3 scripts/p015-http-decision-reconcile.py
      - name: Validate reconciliation
        shell: bash
        run: |
          set -euo pipefail
          node scripts/projectops-integrity-verify.mjs
          git diff --check
          actual="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' 'ProjectOps/CONTINUITY.md' 'ProjectOps/continuity/C0011.md' 'ProjectOps/plan/P-015.md' | sort)"
          test "$actual" = "$expected"
      - name: Commit clean decision checkpoint
        shell: bash
        run: |
          set -euo pipefail
          rm scripts/p015-http-decision-reconcile.py .github/workflows/p015-http-decision-reconcile.yml
          node scripts/projectops-integrity-verify.mjs
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'ProjectOps: record P-015 Streamable HTTP bearer decision'
          git push origin HEAD:abos/p015-mcp-runtime
