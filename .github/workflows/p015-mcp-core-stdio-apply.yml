name: P015 MCP Core Stdio Apply

on:
  push:
    branches:
      - abos/p015-mcp-runtime
    paths:
      - .github/workflows/p015-mcp-core-stdio-apply.yml

permissions:
  contents: write

concurrency:
  group: p015-mcp-core-stdio-apply
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Guard exact parent and branch
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = "abos/p015-mcp-runtime"
          test "$(git rev-parse HEAD^)" = "d18fd7ac0bc5ad64abe66aa98624bcbe8572b51c"
          test -f scripts/p015-mcp-core-stdio-apply.py

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.1

      - name: Install baseline dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply MCP_CORE_STDIO transformation
        run: python3 scripts/p015-mcp-core-stdio-apply.py

      - name: Add official MCP SDK dependencies
        shell: bash
        run: |
          set -euo pipefail
          pnpm add @modelcontextprotocol/client@2.0.0 --save-exact
          pnpm add -D @modelcontextprotocol/server@2.0.0 zod@4

      - name: Validate intended source tree
        shell: bash
        run: |
          set -euo pipefail
          node scripts/projectops-integrity-verify.mjs
          git diff --check
          actual="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' \
            '.github/workflows/p015-mcp-core-stdio-apply.yml' \
            'ProjectOps/CONTINUITY.md' \
            'ProjectOps/continuity/C0011.md' \
            'ProjectOps/plan/P-015.md' \
            'package.json' \
            'pnpm-lock.yaml' \
            'scripts/p015-mcp-core-stdio-apply.py' \
            'src/__tests__/fixtures/mcp-stdio-server.mjs' \
            'src/__tests__/mcp-runtime.test.ts' \
            'src/agent/loop.ts' \
            'src/agent/tools-core.ts' \
            'src/mcp/runtime.ts' \
            'src/state/database.ts' \
            'src/types.ts' | sort)"
          test "$actual" = "$expected"

      - name: Targeted MCP protocol tests
        run: pnpm exec vitest run src/__tests__/mcp-runtime.test.ts src/__tests__/installed-tools-runtime-truth.test.ts

      - name: Typecheck
        run: pnpm run typecheck

      - name: Build
        run: pnpm run build

      - name: Security regression
        run: pnpm run test:security

      - name: Produce clean source commit
        shell: bash
        run: |
          set -euo pipefail
          rm scripts/p015-mcp-core-stdio-apply.py .github/workflows/p015-mcp-core-stdio-apply.yml
          node scripts/projectops-integrity-verify.mjs
          git diff --check
          actual="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' \
            'ProjectOps/CONTINUITY.md' \
            'ProjectOps/continuity/C0011.md' \
            'ProjectOps/plan/P-015.md' \
            'package.json' \
            'pnpm-lock.yaml' \
            'src/__tests__/fixtures/mcp-stdio-server.mjs' \
            'src/__tests__/mcp-runtime.test.ts' \
            'src/agent/loop.ts' \
            'src/agent/tools-core.ts' \
            'src/mcp/runtime.ts' \
            'src/state/database.ts' \
            'src/types.ts' | sort)"
          test "$actual" = "$expected"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat(mcp): add verified stdio runtime core'
          git push origin HEAD:abos/p015-mcp-runtime
