name: P015 P016 Transition Reconcile

on:
  push:
    branches:
      - abos/p016-computer-browser-gui-hands
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reconcile:
    if: github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, 'ProjectOps: close P-015 and activate P-016 audit')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: abos/p016-computer-browser-gui-hands
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Guard exact transition baseline
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git branch --show-current)" = "abos/p016-computer-browser-gui-hands"
          test "$(git rev-parse origin/main)" = "6e620ffcdddbe630ace58be67d5abb0826ed19b9"
          test "$(git merge-base HEAD origin/main)" = "6e620ffcdddbe630ace58be67d5abb0826ed19b9"
          git diff --name-only 6e620ffcdddbe630ace58be67d5abb0826ed19b9...HEAD | sort > /tmp/pre.txt
          printf '%s\n' '.github/workflows/p015-p016-transition.yml' 'scripts/p015-p016-transition.py' | sort > /tmp/expected-pre.txt
          diff -u /tmp/expected-pre.txt /tmp/pre.txt

      - name: Apply canonical transition
        run: python3 scripts/p015-p016-transition.py

      - name: Verify documentary-only scope
        shell: bash
        run: |
          set -euo pipefail
          git add -N ProjectOps/continuity/C0012.md
          git diff --name-only | sort > /tmp/changed.txt
          awk '!/^ProjectOps\//' /tmp/changed.txt > /tmp/non_projectops.txt
          test ! -s /tmp/non_projectops.txt

      - name: Verify ProjectOps integrity
        run: node scripts/projectops-integrity-verify.mjs

      - name: Verify diff integrity
        run: git diff --check

      - name: Commit clean transition
        shell: bash
        run: |
          set -euo pipefail
          git rm scripts/p015-p016-transition.py .github/workflows/p015-p016-transition.yml
          git add ProjectOps
          git diff --cached --name-only | sort > /tmp/staged.txt
          printf '%s\n' \
            'ProjectOps/CONTINUITY.md' \
            'ProjectOps/PLAN.md' \
            'ProjectOps/PROJECT.md' \
            'ProjectOps/continuity/C0011.md' \
            'ProjectOps/continuity/C0012.md' \
            'ProjectOps/plan/P-015.md' \
            'ProjectOps/plan/P-016.md' | sort > /tmp/expected.txt
          diff -u /tmp/expected.txt /tmp/staged.txt
          node scripts/projectops-integrity-verify.mjs
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'ProjectOps: close P-015 and activate P-016 audit'
          git push origin HEAD:abos/p016-computer-browser-gui-hands
