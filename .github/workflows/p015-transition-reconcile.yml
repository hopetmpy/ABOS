name: P015 Transition Reconcile

on:
  push:
    branches:
      - abos/p015-mcp-runtime
    paths:
      - .github/workflows/p015-transition-reconcile.yml

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Guard exact starting point
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "3333aa6099c3274b3c23d6cd3092dad9480f0509"
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/p015-transition-reconcile.yml"
          test -f scripts/p015-transition-reconcile.py
          test "$(git show HEAD^^:ProjectOps/CONTINUITY.md | sed -n 's/^Active-Plan: //p')" = "P-014"
          test "$(git show HEAD^^:ProjectOps/CONTINUITY.md | sed -n 's/^Active-Segment: //p')" = "continuity/C0010.md"

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Reconcile P-014 closure and activate P-015 audit
        run: python3 scripts/p015-transition-reconcile.py

      - name: Ensure transition is documentary only
        shell: bash
        run: |
          set -euo pipefail
          if git diff --name-only | grep -E '^(src/|package.json|pnpm-lock.yaml|constitution.md$)'; then
            echo "::error::P-015 transition modified product source"
            exit 1
          fi
          test -f ProjectOps/continuity/C0011.md
          grep -Fq 'Active-Plan: P-015' ProjectOps/CONTINUITY.md
          grep -Fq 'State: HECHO' ProjectOps/plan/P-014.md
          grep -Fq 'Decision-State: AUDIT_OPEN' ProjectOps/plan/P-015.md
          grep -Fq 'Classification: AUDIT_OPEN / SOURCE_UNMODIFIED' ProjectOps/continuity/C0011.md

      - name: Verify ProjectOps integrity
        run: node scripts/projectops-integrity-verify.mjs

      - name: Diff integrity
        run: git diff --check

      - name: Retire temporary helpers and commit transition
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/p015-transition-reconcile.yml scripts/p015-transition-reconcile.py
          node scripts/projectops-integrity-verify.mjs
          git diff --check
          git status --short
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "ProjectOps: close P-014 and activate P-015 audit"
          git push origin HEAD:abos/p015-mcp-runtime
