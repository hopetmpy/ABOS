name: P016 Branch Acceptance Reconcile

on:
  push:
    branches:
      - abos/p016-computer-browser-gui-hands
    paths:
      - .github/workflows/p016-branch-acceptance-reconcile.yml

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: abos/p016-computer-browser-gui-hands
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
      - name: Reconcile accepted P016 branch state
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os

          manifest = Path('ProjectOps/CONTINUITY.md')
          text = manifest.read_text()
          old = 'Active-Intervention: P016_COMPUTER_BROWSER_GUI_HANDS — EN_EJECUCIÓN / GUI_ACCESSIBILITY / SOURCE_VALIDATED / WINDOWS_E2E_PASS / CLEAN_HEAD_CI_PENDING'
          new = 'Active-Intervention: P016_COMPUTER_BROWSER_GUI_HANDS — EN_EJECUCIÓN / TECHNICAL_OBJECTIVE_SATISFIED / E3_BRANCH_GREEN / MAIN_INTEGRATION_PENDING'
          if old not in text:
              raise SystemExit('expected active P016 state not found')
          text = text.replace(old, new, 1)
          for prefix in ('Last-Reconciled-Host-Head: ', 'Last-Reconciled-Head-Semantics: '):
              lines = text.splitlines()
              for i, line in enumerate(lines):
                  if line.startswith(prefix):
                      lines[i] = prefix + (os.environ['GITHUB_SHA'] if 'Host-Head' in prefix else 'P016_TECHNICAL_OBJECTIVE_SATISFIED_E3_BRANCH_GREEN_MAIN_INTEGRATION_PENDING')
                      break
              text = '\n'.join(lines) + ('\n' if text.endswith('\n') else '')
          manifest.write_text(text)

          segment = Path('ProjectOps/continuity/C0012.md')
          s = segment.read_text()
          s = s.replace('Classification: EN_EJECUCIÓN / GUI_ACCESSIBILITY / SOURCE_VALIDATED / WINDOWS_E2E_PASS / CLEAN_HEAD_CI_PENDING', 'Classification: EN_EJECUCIÓN / TECHNICAL_OBJECTIVE_SATISFIED / E3_BRANCH_GREEN / MAIN_INTEGRATION_PENDING', 1)
          s = s.rstrip() + '''\n\n## P-016 — aceptación técnica de rama / integración en main pendiente\n\nState: EN_EJECUCIÓN / TECHNICAL_OBJECTIVE_SATISFIED / E3_BRANCH_GREEN / MAIN_INTEGRATION_PENDING / NOT_HECHO\n\nReauditoría final de rama:\n- los tres subtracks canónicos están materialmente satisfechos en la rama: `STRUCTURED_BROWSER_LOCAL`, `LOCAL_COMPUTER_COMPLETION` y `GUI_ACCESSIBILITY`;\n- `GUI_ACCESSIBILITY` conserva selección semántica fail-closed, readiness separada para accessibility/screen/input y low-level input explícito;\n- material Windows GUI E2E `35804240533`: SUCCESS sobre SHA exacto `7f258f219f3834488ad8a8de1c46d1ee74b2fbb7`, 4 archivos / 203 tests PASS, incluyendo UIAutomation real, semantic invoke, low-level pointer click, promotion de input readiness sólo tras éxito y captura PNG confinada;\n- los workflows/helpers one-shot de recuperación, hardening y diagnóstico P-016 fueron retirados; el diff final conserva sólo source/tests/CI/ProjectOps permanentes;\n- branch vs `main d5f752e2223fc312296ba2b6d93899a195f4f1d9`: ahead, 0 behind; no PR de producto P-016 abierto al momento de esta reconciliación.\n\nGate ordinario y adversarial:\n- clean-head CI previo `35807990558`: FAILURE informativo, no aceptado como PASS; 2073/2074 tests pasaron y el único fallo en Node 22/24 fue `p012-tool-routing` porque un contrato histórico exigía igualdad exacta entre el catálogo core y el catálogo routed, contradiciendo las cuatro extensiones GUI legítimas; Windows 22/24, distribución 22/24, audit y rebrand sí pasaron;\n- hipótesis `GUI_RUNTIME_BROKE_P012_ROUTING`: FALSADA; runtime y GUI tests pasaron. Causa: `P012_EXACT_CATALOG_TEST_DRIFT`;\n- decisión: CORRECT test contract, preservando que todo core tool siga presente y permitiendo únicamente las extensiones registradas `gui_act`, `gui_capture`, `gui_input`, `gui_snapshot`; no se eliminó GUI ni se debilitó P-012;\n- correction commit `41bd217486f03c0c0d5ec752e3428fe97b5a79c9`;\n- final ordinary CI `35808379662`: SUCCESS, 8/8 jobs — full build/test/security Node 22+24, Windows 22+24, public distribution 22+24, dependency audit y rebrand;\n- final ProjectOps Integrity `35808379658`: SUCCESS;\n- final branch evidence level para el objetivo técnico P-016: E3 branch integration; GUI además posee material Windows sandbox E2E.\n\nNo demostrado / no cerrar aún:\n- P-016 todavía no está integrado ni revalidado en `main`; por regla absoluta no es HECHO;\n- no se reclama GUI/browser E5 en el host físico del usuario ni provider externo autenticado;\n- P-017 no se activa antes del merge + main green + transición ProjectOps canónica.\n\nSiguiente punto verificable: retirar este reconciliador temporal, validar CI + ProjectOps sobre el HEAD final limpio, abrir PR de producto P-016 a `main`, exigir checks del PR, mergear sólo si están verdes y revalidar el `main` resultante. Después, y sólo después, ejecutar el PR ProjectOps de cierre P-016 → activación de la siguiente unidad permitida por el grafo.\n'''
          segment.write_text(s)
          PY
          node scripts/projectops-integrity-verify.mjs
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ProjectOps/CONTINUITY.md ProjectOps/continuity/C0012.md
          git commit -m 'docs(p016): accept branch technical objective'
          git push origin HEAD:abos/p016-computer-browser-gui-hands
