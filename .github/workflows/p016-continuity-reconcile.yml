name: P016 Continuity Reconcile

on:
  push:
    branches:
      - abos/p016-computer-browser-gui-hands
    paths:
      - .github/workflows/p016-continuity-reconcile.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: abos/p016-computer-browser-gui-hands
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Reconcile P016 local-computer completion and open GUI audit
        shell: bash
        run: |
          python - <<'PY'
          import base64
          from pathlib import Path

          segment = Path('ProjectOps/continuity/C0012.md')
          marker = '## LOCAL_COMPUTER_COMPLETION — source integrated / E3 branch green'
          addition = base64.b64decode('').decode('utf-8')
          text = segment.read_text(encoding='utf-8')
          if marker not in text:
              segment.write_text(text.rstrip() + addition + '\n', encoding='utf-8')

          root = Path('ProjectOps/CONTINUITY.md')
          text = root.read_text(encoding='utf-8')
          replacements = {
              'Active-Intervention: P016_COMPUTER_BROWSER_GUI_HANDS — EN_EJECUCIÓN / LOCAL_COMPUTER_COMPLETION / DECISION_READY / SOURCE_UNMODIFIED': 'Active-Intervention: P016_COMPUTER_BROWSER_GUI_HANDS — EN_EJECUCIÓN / GUI_ACCESSIBILITY / AUDIT_OPEN / SOURCE_UNMODIFIED',
              'Last-Reconciled-Host-Head: 92faa53302ede575e6b5c4a8f148ee6ba57b6cd5': 'Last-Reconciled-Host-Head: a999ac704c2eeb6a9fc3c66e42db4598934ce55c',
              'Last-Reconciled-Head-Semantics: P016_STRUCTURED_BROWSER_LOCAL_E3_GREEN_LOCAL_COMPUTER_COMPLETION_AUDIT_OPEN': 'Last-Reconciled-Head-Semantics: P016_LOCAL_COMPUTER_COMPLETION_E3_GREEN_GUI_ACCESSIBILITY_AUDIT_OPEN',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'expected canonical continuity line missing: {old}')
              text = text.replace(old, new, 1)
          root.write_text(text, encoding='utf-8')
          PY
      - name: Verify canonical ProjectOps after reconciliation
        run: node scripts/projectops-integrity-verify.mjs
      - name: Commit reconciliation and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/p016-continuity-reconcile.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add ProjectOps/CONTINUITY.md ProjectOps/continuity/C0012.md .github/workflows/p016-continuity-reconcile.yml
          if git diff --cached --quiet; then
            echo 'No reconciliation changes required.'
            exit 0
          fi
          git commit -m 'docs(p016): reconcile local computer completion'
          git push origin HEAD:abos/p016-computer-browser-gui-hands
