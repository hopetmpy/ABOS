name: P016 Decision Reconcile

on:
  push:
    branches:
      - abos/p016-computer-browser-gui-hands

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: abos/p016-computer-browser-gui-hands
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Guard exact decision baseline
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "d5f752e2223fc312296ba2b6d93899a195f4f1d9"
          test "$(git merge-base HEAD origin/main)" = "d5f752e2223fc312296ba2b6d93899a195f4f1d9"
          test "$(git rev-parse HEAD^^)" = "b8b91acf5c4445b5bc3c7627387281f0415fcb48"
          git diff --name-only b8b91acf5c4445b5bc3c7627387281f0415fcb48...HEAD | sort > /tmp/pre.txt
          printf '%s\n' '.github/workflows/p016-decision-reconcile.yml' 'scripts/p016-decision-reconcile.py' | sort > /tmp/expected-pre.txt
          diff -u /tmp/expected-pre.txt /tmp/pre.txt

      - name: Apply P-016 decision reconciliation
        run: python3 scripts/p016-decision-reconcile.py

      - name: Verify ProjectOps and diff
        shell: bash
        run: |
          set -euo pipefail
          node scripts/projectops-integrity-verify.mjs
          git diff --check
          git diff --name-only | sort > /tmp/changed.txt
          printf '%s\n' 'ProjectOps/CONTINUITY.md' 'ProjectOps/continuity/C0012.md' 'ProjectOps/plan/P-016.md' | sort > /tmp/expected.txt
          diff -u /tmp/expected.txt /tmp/changed.txt

      - name: Commit clean decision checkpoint
        shell: bash
        run: |
          set -euo pipefail
          git rm scripts/p016-decision-reconcile.py .github/workflows/p016-decision-reconcile.yml
          git add ProjectOps/CONTINUITY.md ProjectOps/continuity/C0012.md ProjectOps/plan/P-016.md
          node scripts/projectops-integrity-verify.mjs
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'ProjectOps: record P-016 structured browser decision'
          git push origin HEAD:abos/p016-computer-browser-gui-hands
