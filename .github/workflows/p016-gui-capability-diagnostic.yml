name: P016 GUI Decision Reconcile

on:
  push:
    branches:
      - abos/p016-computer-browser-gui-hands
    paths:
      - .github/workflows/p016-gui-capability-diagnostic.yml

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: abos/p016-computer-browser-gui-hands
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Register GUI decision-ready evidence
        shell: bash
        run: |
          python - <<'PY'
          import base64
          from pathlib import Path

          segment = Path('ProjectOps/continuity/C0012.md')
          marker = '## GUI_ACCESSIBILITY — host discrimination complete / decision ready'
          addition = base64.b64decode('').decode('utf-8')
          text = segment.read_text(encoding='utf-8')
          if marker not in text:
              segment.write_text(text.rstrip() + addition + '\n', encoding='utf-8')
          text = segment.read_text(encoding='utf-8')
          old_class = 'Classification: P016_COMPUTER_BROWSER_GUI_HANDS / EN_EJECUCIÓN / LOCAL_COMPUTER_COMPLETION / DECISION_READY / SOURCE_UNMODIFIED'
          new_class = 'Classification: P016_COMPUTER_BROWSER_GUI_HANDS / EN_EJECUCIÓN / GUI_ACCESSIBILITY / DECISION_READY / SOURCE_UNMODIFIED'
          if old_class in text:
              text = text.replace(old_class, new_class, 1)
              segment.write_text(text, encoding='utf-8')
          elif new_class not in text:
              raise SystemExit('expected C0012 classification line missing')

          root = Path('ProjectOps/CONTINUITY.md')
          text = root.read_text(encoding='utf-8')
          replacements = {
              'Active-Intervention: P016_COMPUTER_BROWSER_GUI_HANDS — EN_EJECUCIÓN / GUI_ACCESSIBILITY / AUDIT_OPEN / SOURCE_UNMODIFIED': 'Active-Intervention: P016_COMPUTER_BROWSER_GUI_HANDS — EN_EJECUCIÓN / GUI_ACCESSIBILITY / DECISION_READY / SOURCE_UNMODIFIED',
              'Last-Reconciled-Host-Head: a999ac704c2eeb6a9fc3c66e42db4598934ce55c': 'Last-Reconciled-Host-Head: c42bdf584abb0996ee7ebbfd52865b77c49d9c22',
              'Last-Reconciled-Head-Semantics: P016_LOCAL_COMPUTER_COMPLETION_E3_GREEN_GUI_ACCESSIBILITY_AUDIT_OPEN': 'Last-Reconciled-Head-Semantics: P016_GUI_ACCESSIBILITY_DECISION_READY_SOURCE_UNMODIFIED',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'expected canonical continuity line missing: {old}')
              text = text.replace(old, new, 1)
          root.write_text(text, encoding='utf-8')
          PY
      - name: Verify canonical ProjectOps after GUI decision
        run: node scripts/projectops-integrity-verify.mjs
      - name: Commit decision and remove diagnostic workflow
        shell: bash
        run: |
          rm .github/workflows/p016-gui-capability-diagnostic.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add ProjectOps/CONTINUITY.md ProjectOps/continuity/C0012.md .github/workflows/p016-gui-capability-diagnostic.yml
          git commit -m 'docs(p016): register GUI decision-ready gate'
          git push origin HEAD:abos/p016-computer-browser-gui-hands
