name: P016 GUI Decision Reconcile

on:
  push:
    branches:
      - abos/p016-computer-browser-gui-hands
    paths:
      - .github/workflows/p016-gui-capability-diagnostic.yml

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: abos/p016-computer-browser-gui-hands
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Register GUI decision-ready evidence
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          segment = Path('ProjectOps/continuity/C0012.md')
          marker = '## GUI_ACCESSIBILITY — host discrimination complete / decision ready'
          addition = '''

          ## GUI_ACCESSIBILITY — host discrimination complete / decision ready

          State: EN_EJECUCIÓN / DECISION_READY / SOURCE_UNMODIFIED

          Discriminación material:
          - diagnostic commit: `c42bdf584abb0996ee7ebbfd52865b77c49d9c22`;
          - diagnostic workflow `35690269742`: SUCCESS en Windows Server 2025 y Ubuntu 24.04;
          - Windows: `userInteractive=true`, session id 2, ventanas interactivas presentes, UIAutomation RootElement observable, 1 pantalla 1024x768, CopyFromScreen funcional, user32 desktop/cursor observable y API de input cargable;
          - Notepad real abrió MainWindowHandle y fue encontrado por UIAutomation como `Untitled - Notepad`;
          - Ubuntu CI: DISPLAY/WAYLAND/XDG session y session DBus ausentes; xdotool/ydotool/wmctrl/screenshot tools ausentes; `/dev/uinput` presente sin read/write. GUI observado = UNAVAILABLE e input low-level = UNAUTHORIZED, no IMPOSSIBLE.

          Hipótesis:
          - H0 `NO_CHANGE`: FALSADA; Windows demuestra primitives provider-native reales que P-016 exige y el source actual no expone.
          - H1 `REUSE_STRUCTURED_BROWSER_AS_OS_GUI`: FALSADA; DOM/accessibility browser no prueba desktop/window/input.
          - H2 `EXTEND_LOCAL_ENVIRONMENT_WITH_PROVIDER_NATIVE_GUI_PROBE_AND_TOOLS`: CONFIRMADA.
          - H3 `SILENTLY_INSTALL_GUI_AUTOMATION_DEPENDENCIES`: REJECTED; no es necesario en Windows y violaría ownership/provisioning.
          - H4 `MONOLITHIC_GUI_AVAILABLE_BOOLEAN`: FALSADA; observation/accessibility/screen/input pueden divergir.
          - H5 `PERSIST_UIAUTOMATION_ELEMENT_HANDLES_ACROSS_CALLS`: REJECTED por stale/restart risk.
          - H6 `SEMANTIC_FIRST_WITH_EXPLICIT_COORDINATE_FALLBACK`: CONFIRMADA.

          Decisión canónica:
          `EXTEND_EXISTING_LOCAL_ENVIRONMENT / WINDOWS_PROVIDER_NATIVE_UIAUTOMATION_PLUS_USER32 / SPLIT_GUI_OBSERVATION_SCREEN_INPUT_CAPABILITIES / SEMANTIC_FIRST / EXPLICIT_LOW_LEVEL_INPUT / NO_PERSISTED_UI_ELEMENT_HANDLES / NON_WINDOWS_FAIL_CLOSED / NO_ACQUISITION`.

          Arquitectura prevista:
          1. una única `LocalGuiRuntime` subordinada al environment local, con probe por primitive;
          2. Windows reutiliza PowerShell/.NET/Win32 ya presentes; no se agrega dependencia npm/native;
          3. `gui_snapshot` entrega observación window/accessibility acotada y external/untrusted;
          4. `gui_capture` materializa PNG únicamente dentro del home local;
          5. `gui_act` re-resuelve selector semántico actual y falla cerrado ante cero o múltiples matches; no hace click por coordenada implícito;
          6. `gui_input` expone low-level pointer/keyboard sólo de forma explícita;
          7. `LocalEnvironmentProvider` publica capabilities separadas para accessibility/semantic action, screen capture e input desde probe real;
          8. `runAgentLoop` registra las GUI tools en el CapabilityRegistry/reserved-name/final-tool pipeline existente;
          9. hosts sin provider validado permanecen UNAVAILABLE; ausencia de display/permiso no se convierte en IMPOSSIBLE.

          Invariantes/adversarial obligatorios:
          - probe sin input ni side effects;
          - no silent semantic→coordinate fallback;
          - no stale persisted UI element handles;
          - selector ambiguo falla cerrado;
          - coordenadas validadas contra pantalla observada;
          - screenshots confinados al home;
          - texto accessibility/window tratado como external/untrusted;
          - API cargable no equivale a input realmente permitido;
          - capability state deriva del probe, no de tool registration;
          - restart vuelve a resolver desktop/targets;
          - headless no fabrica disponibilidad;
          - Windows real debe lanzar app controlada, observarla, actuar semánticamente, ejecutar input explícito, capturar pantalla y limpiar proceso.

          Siguiente paso: implementar esta arquitectura en la authority local existente y atacar con regresiones Windows/headless antes de promover evidencia.
          '''
          addition = '\n'.join(line[10:] if line.startswith('          ') else line for line in addition.splitlines())
          text = segment.read_text(encoding='utf-8')
          if marker not in text:
              text = text.rstrip() + addition + '\n'
          old_class = 'Classification: EN_EJECUCIÓN / LOCAL_COMPUTER_COMPLETION / DECISION_READY / SOURCE_UNMODIFIED'
          new_class = 'Classification: EN_EJECUCIÓN / GUI_ACCESSIBILITY / DECISION_READY / SOURCE_UNMODIFIED'
          if old_class in text:
              text = text.replace(old_class, new_class, 1)
          elif new_class not in text:
              raise SystemExit('expected C0012 classification line missing')
          segment.write_text(text, encoding='utf-8')

          root = Path('ProjectOps/CONTINUITY.md')
          text = root.read_text(encoding='utf-8')
          replacements = {
              'Active-Intervention: P016_COMPUTER_BROWSER_GUI_HANDS — EN_EJECUCIÓN / GUI_ACCESSIBILITY / AUDIT_OPEN / SOURCE_UNMODIFIED': 'Active-Intervention: P016_COMPUTER_BROWSER_GUI_HANDS — EN_EJECUCIÓN / GUI_ACCESSIBILITY / DECISION_READY / SOURCE_UNMODIFIED',
              'Last-Reconciled-Host-Head: a999ac704c2eeb6a9fc3c66e42db4598934ce55c': 'Last-Reconciled-Host-Head: c42bdf584abb0996ee7ebbfd52865b77c49d9c22',
              'Last-Reconciled-Head-Semantics: P016_LOCAL_COMPUTER_COMPLETION_E3_GREEN_GUI_ACCESSIBILITY_AUDIT_OPEN': 'Last-Reconciled-Head-Semantics: P016_GUI_ACCESSIBILITY_DECISION_READY_SOURCE_UNMODIFIED',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'expected canonical continuity line missing: {old}')
              text = text.replace(old, new, 1)
          root.write_text(text, encoding='utf-8')
          PY
      - name: Verify canonical ProjectOps after GUI decision
        run: node scripts/projectops-integrity-verify.mjs
      - name: Commit decision and remove diagnostic workflow
        shell: bash
        run: |
          rm .github/workflows/p016-gui-capability-diagnostic.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add ProjectOps/CONTINUITY.md ProjectOps/continuity/C0012.md .github/workflows/p016-gui-capability-diagnostic.yml
          git commit -m 'docs(p016): register GUI decision-ready gate'
          git push origin HEAD:abos/p016-computer-browser-gui-hands
