name: P016 GUI Windows Material Validation

on:
  push:
    branches:
      - abos/p016-computer-browser-gui-hands
    paths:
      - .github/workflows/p016-gui-diagnostic.yml

jobs:
  windows-material-validation:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: 7f258f219f3834488ad8a8de1c46d1ee74b2fbb7
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
      - uses: pnpm/action-setup@v4

      - name: Assert exact source and test SHA
        shell: pwsh
        run: |
          $actual = git rev-parse HEAD
          if ($actual -ne '7f258f219f3834488ad8a8de1c46d1ee74b2fbb7') { throw "unexpected source SHA $actual" }

      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm run build

      - name: Real Windows GUI and adversarial security regression
        shell: pwsh
        run: pnpm exec vitest run src/__tests__/p016-local-gui-runtime.test.ts src/__tests__/p016-local-computer-runtime.test.ts src/__tests__/tools-security.test.ts src/__tests__/command-injection.test.ts

      - name: ProjectOps integrity on exact SHA
        shell: pwsh
        run: node scripts/projectops-integrity-verify.mjs
