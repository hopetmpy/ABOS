name: P016 GUI Reconcile

on:
  push:
    branches:
      - abos/p016-computer-browser-gui-hands
    paths:
      - .github/workflows/p016-gui-reconcile.yml

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: abos/p016-computer-browser-gui-hands
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
      - name: Reconcile P016 GUI material validation
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os

          manifest = Path('ProjectOps/CONTINUITY.md')
          text = manifest.read_text()
          old = 'Active-Intervention: P016_COMPUTER_BROWSER_GUI_HANDS — EN_EJECUCIÓN / GUI_ACCESSIBILITY / SOURCE_PARTIAL / CORRECTION_REQUIRED / DECISION_READY'
          new = 'Active-Intervention: P016_COMPUTER_BROWSER_GUI_HANDS — EN_EJECUCIÓN / GUI_ACCESSIBILITY / SOURCE_VALIDATED / WINDOWS_E2E_PASS / CLEAN_HEAD_CI_PENDING'
          if old not in text:
              raise SystemExit('expected active intervention state not found')
          text = text.replace(old, new, 1)
          text = text.replace('Last-Reconciled-Host-Head: c42bdf584abb0996ee7ebbfd52865b77c49d9c22', f"Last-Reconciled-Host-Head: {os.environ['GITHUB_SHA']}", 1)
          text = text.replace('Last-Reconciled-Head-Semantics: P016_GUI_ACCESSIBILITY_DECISION_READY_SOURCE_UNMODIFIED', 'Last-Reconciled-Head-Semantics: P016_GUI_SOURCE_VALIDATED_WINDOWS_E2E_CLEAN_HEAD_CI_PENDING', 1)
          manifest.write_text(text)

          segment = Path('ProjectOps/continuity/C0012.md')
          s = segment.read_text()
          s = s.replace('Classification: EN_EJECUCIÓN / GUI_ACCESSIBILITY / DECISION_READY / SOURCE_UNMODIFIED', 'Classification: EN_EJECUCIÓN / GUI_ACCESSIBILITY / SOURCE_VALIDATED / WINDOWS_E2E_PASS / CLEAN_HEAD_CI_PENDING', 1)
          s = s.rstrip() + '''\n\n## GUI_ACCESSIBILITY — source/material validation satisfied; clean-head gate pending\n\nState: EN_EJECUCIÓN / SOURCE_VALIDATED / WINDOWS_E2E_PASS / CLEAN_HEAD_CI_PENDING / NOT_YET_P016_CLOSED\n\nCorrecciones e integración observadas:\n- el verificador ProjectOps stale fue reconciliado contra el root kernel vigente sin reinyectar semántica retirada;\n- las tools `gui_snapshot`, `gui_capture`, `gui_act` y `gui_input` quedaron conectadas al builtin/capability/policy pipeline existente;\n- `gui_capture` re-confina el realpath materializado bajo HOME;\n- input readiness no se eleva desde un probe side-effect-free: permanece `probed` hasta una acción low-level explícita aceptada;\n- estados explícitos de capabilities GUI dejan de colapsarse por availability del environment;\n- el provider Windows conserva selección semántica fail-closed ante cero/múltiples matches y no introduce fallback silencioso a coordenadas;\n- el transporte PowerShell dejó de usar el provider completo en `-EncodedCommand` después de que Windows demostrara `ENAMETOOLONG`; ahora el provider se materializa en un directorio temporal aleatorio, recibe protocolo por stdin y se limpia en `finally`; no se redujo capability para acomodar el límite de línea de comandos.\n\nEvidencia ejecutada:\n- Linux/source correction workflow `35803882547`: SUCCESS — apply determinista del transport fix, install, typecheck, build, targeted P-016/capability regressions, security regressions, ProjectOps y diff integrity; product commit resultante `6b582a68db8ff6f250f17c1edd8fea40ce8c7728`;\n- Windows diagnostic `35803423245`: SUCCESS — `UserInteractive=True`, session 2, UIAutomation RootElement presente, virtual screen 1024x768 y `CopyFromScreen=true`; este run falsó falta de GUI del runner y aisló `ENAMETOOLONG` como defecto de transporte;\n- primer material Windows post-transport `35804008354`: FAILURE informativo — 202/203 tests PASS; el único fallo fue selector de ventana ambiguo. El runtime falló cerrado correctamente; se corrigió el test para enfocar el control de nombre único en vez de debilitar la selección semántica;\n- test correction commit `7f258f219f3834488ad8a8de1c46d1ee74b2fbb7`;\n- material Windows final `35804240533`: SUCCESS sobre el SHA exacto `7f258f219f3834488ad8a8de1c46d1ee74b2fbb7` — install, typecheck, build, GUI E2E real + security regressions y ProjectOps Integrity PASS; 4 archivos / 203 tests PASS;\n- el E2E Windows lanzó una UI controlada, la observó por UIAutomation, ejecutó acción semántica, efectuó click low-level explícito y verificó el efecto, promovió input readiness sólo después de éxito y verificó captura PNG confinada;\n- Ubuntu/headless conserva GUI/input como UNAVAILABLE/UNAUTHORIZED según probe; no se fabrica availability ni IMPOSSIBLE.\n\nHipótesis cerradas:\n- `GUI_PRIMITIVES_UNAVAILABLE_ON_WINDOWS_RUNNER`: FALSADA;\n- `PROVIDER_TRANSPORT_TOO_LARGE`: CONFIRMADA y CORREGIDA;\n- `AMBIGUOUS_SELECTOR_SHOULD_PICK_ONE`: REJECTED; fail-closed preservado;\n- `GUI_TOOL_WIRING_MISSING`: CONFIRMADA y CORREGIDA;\n- `CAPTURE_REALPATH_ESCAPE`: CONFIRMADA y CORREGIDA;\n- `INPUT_READINESS_OVERCLAIM`: CONFIRMADA y CORREGIDA;\n- `CAPABILITY_STATE_COLLAPSE`: CONFIRMADA y CORREGIDA.\n\nScaffolding temporal de apply/recovery/diagnóstico fue retirado del árbol de trabajo de la rama.\n\nNo demostrado todavía:\n- ordinary exact-head CI + ProjectOps sobre el árbol limpio posterior a la retirada de scaffolding;\n- integración de P-016 en `main`;\n- GUI/browser LIVE en el host físico del usuario o E5 externo.\n\nSiguiente punto verificable: retirar este reconciliador temporal, ejecutar CI ordinario + ProjectOps sobre el HEAD limpio final de rama y sólo entonces decidir aceptación de `GUI_ACCESSIBILITY` y cierre técnico/integración de P-016.\n'''
          segment.write_text(s)
          PY
          node scripts/projectops-integrity-verify.mjs
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ProjectOps/CONTINUITY.md ProjectOps/continuity/C0012.md
          git commit -m 'docs(p016): reconcile GUI material validation'
          git push origin HEAD:abos/p016-computer-browser-gui-hands
