name: P016 GUI Recovery

on:
  push:
    branches:
      - abos/p016-computer-browser-gui-hands

permissions:
  contents: write

jobs:
  apply-and-linux-validate:
    if: github.event.head_commit.message == 'chore(p016): stage GUI recovery executor'
    runs-on: ubuntu-24.04
    outputs:
      source_sha: ${{ steps.source.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: abos/p016-computer-browser-gui-hands
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
      - uses: pnpm/action-setup@v4

      - name: Register recovered divergence before product source
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os

          manifest = Path('ProjectOps/CONTINUITY.md')
          text = manifest.read_text()
          old = 'Active-Intervention: P016_COMPUTER_BROWSER_GUI_HANDS — EN_EJECUCIÓN / GUI_ACCESSIBILITY / DECISION_READY / SOURCE_UNMODIFIED'
          new = 'Active-Intervention: P016_COMPUTER_BROWSER_GUI_HANDS — EN_EJECUCIÓN / GUI_ACCESSIBILITY / SOURCE_PARTIAL / CORRECTION_REQUIRED / DECISION_READY'
          if old not in text:
              raise SystemExit('expected Active-Intervention checkpoint not found')
          manifest.write_text(text.replace(old, new, 1))

          segment = Path('ProjectOps/continuity/C0012.md')
          s = segment.read_text().rstrip() + '\n\n'
          s += f'''## GUI_ACCESSIBILITY — recovered source divergence / correction checkpoint\n\nState: EN_EJECUCIÓN / SOURCE_PARTIAL / CORRECTION_REQUIRED / DECISION_READY / NOT_ACCEPTED\n\nRecovery-Head: `{os.environ['GITHUB_SHA']}`\n\nRealidad recuperada antes de modificar source adicional:\n- commits posteriores al gate `c42bdf584abb0996ee7ebbfd52865b77c49d9c22` ya añadieron `src/gui/local-runtime.ts`, `src/gui/tools.ts` y proyección GUI en `src/environments/local.ts`; por tanto `SOURCE_UNMODIFIED` quedó invalidado por Git y se corrige aquí antes de continuar;\n- **HARD — TOOL_WIRING_MISSING**: `gui_snapshot/gui_capture/gui_act/gui_input` existen como definiciones pero no están incorporadas al catálogo que `runAgentLoop` ingiere/reserva/expone; la capability podía proyectarse sin una tool ejecutable correspondiente;\n- **HARD — CAPTURE_REALPATH_ESCAPE**: `gui_capture` confinaba lexicalmente el path pero no reconfinaba el directorio materializado por `realpath`, por lo que un symlink preexistente bajo HOME podía redirigir la escritura fuera de la authority local;\n- **HARD — INPUT_OUTCOME_TRUTH**: pointer click usa `mouse_event` sin resultado verificable y key modifiers pueden quedar presionados si una pulsación intermedia falla;\n- **HARD — INPUT_READINESS_OVERCLAIM**: cargar user32 + leer cursor no demuestra que low-level input haya sido aceptado; el estado debe permanecer `probed` hasta una acción explícita exitosa, sin emitir input durante el probe;\n- **HARD — CAPABILITY_STATE_COLLAPSE**: `CapabilityRegistry.registerEnvironmentSnapshot()` colapsa cualquier capability explícita no disponible de un environment `available` a `unavailable`, perdiendo `probed/unauthorized/unknown`; P-016 necesita preservar el estado explícito por primitive;\n- no existe test P-016 GUI dedicado ni evidencia de CI sobre el source GUI recuperado; el HEAD de recuperación no tiene workflow runs asociados.\n\nHipótesis:\n- `NO_CHANGE`: FALSADA por wiring ausente y claims de input/path no suficientemente demostrados.\n- `REPLACE_GUI_RUNTIME`: REJECTED; la authority y arquitectura decididas son correctas y requieren `CORRECT/EXTEND` en sitio.\n- `CORRECT_EXISTING_GUI_RUNTIME_AND_PIPELINE`: CONFIRMADA / DECISION_READY.\n\nCorrección autorizada: preservar `LocalGuiRuntime` como única authority local GUI; conectar las tools al catálogo existente, reconfinar capture por realpath, verificar pointer click por `SendInput`, liberar teclas/modifiers en failure, mantener input `probed` hasta éxito explícito, preservar estados explícitos de capabilities de environment y añadir regresiones + E2E Windows real.\n'''
          segment.write_text(s)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ProjectOps/CONTINUITY.md ProjectOps/continuity/C0012.md
          git commit -m 'docs(p016): recover partial GUI intervention state'
          git push origin HEAD:abos/p016-computer-browser-gui-hands

      - name: Apply GUI correction in place
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f'pattern not found in {path}: {old[:100]!r}')
              p.write_text(text.replace(old, new, 1))

          # Runtime truth: explicit primitive state and successful-input promotion.
          replace_once('src/gui/local-runtime.ts',
            'export interface GuiPrimitiveProbe { available: boolean; evidence: string[]; }',
            'export type GuiPrimitiveState = "verified_available" | "probed" | "unavailable";\nexport interface GuiPrimitiveProbe { available: boolean; state: GuiPrimitiveState; evidence: string[]; }')

          replace_once('src/gui/local-runtime.ts',
            '    private const uint INPUT_KEYBOARD = 1;\n    private const uint KEYEVENTF_KEYUP = 0x0002;\n    private const uint KEYEVENTF_UNICODE = 0x0004;',
            '    private const uint INPUT_MOUSE = 0;\n    private const uint INPUT_KEYBOARD = 1;\n    private const uint KEYEVENTF_KEYUP = 0x0002;\n    private const uint KEYEVENTF_UNICODE = 0x0004;')

          replace_once('src/gui/local-runtime.ts',
            '    public static bool SendVirtualKey(ushort key, bool keyUp) {\n        var input = new INPUT { type = INPUT_KEYBOARD, U = new INPUTUNION { ki = new KEYBDINPUT { wVk = key, dwFlags = keyUp ? KEYEVENTF_KEYUP : 0 } } };\n        return SendInput(1, new[] { input }, Marshal.SizeOf(typeof(INPUT))) == 1;\n    }',
            '    public static bool SendVirtualKey(ushort key, bool keyUp) {\n        var input = new INPUT { type = INPUT_KEYBOARD, U = new INPUTUNION { ki = new KEYBDINPUT { wVk = key, dwFlags = keyUp ? KEYEVENTF_KEYUP : 0 } } };\n        return SendInput(1, new[] { input }, Marshal.SizeOf(typeof(INPUT))) == 1;\n    }\n    public static uint SendMouseClick(uint downFlag, uint upFlag) {\n        var inputs = new[] {\n            new INPUT { type = INPUT_MOUSE, U = new INPUTUNION { mi = new MOUSEINPUT { dwFlags = downFlag } } },\n            new INPUT { type = INPUT_MOUSE, U = new INPUTUNION { mi = new MOUSEINPUT { dwFlags = upFlag } } },\n        };\n        return SendInput(2, inputs, Marshal.SizeOf(typeof(INPUT)));\n    }')

          replace_once('src/gui/local-runtime.ts',
            '$accessibility = $false; $screen = $false; $input = $false; $bounds = $null',
            '$accessibility = $false; $screen = $false; $inputProviderReady = $false; $bounds = $null')
          replace_once('src/gui/local-runtime.ts',
            'try { Load-Input; $point = New-Object AbosGuiInput+POINT; $desktop = [AbosGuiInput]::GetDesktopWindow(); $cursor = [AbosGuiInput]::GetCursorPos([ref]$point); $input = ($desktop -ne [IntPtr]::Zero) -and $cursor; [void]$inputEvidence.Add("user32 desktop=$($desktop -ne [IntPtr]::Zero); cursorReadable=$cursor; per-target UIPI may still deny an action") } catch { [void]$inputEvidence.Add("input probe failed: $($_.Exception.Message)") }',
            'try { Load-Input; $point = New-Object AbosGuiInput+POINT; $desktop = [AbosGuiInput]::GetDesktopWindow(); $cursor = [AbosGuiInput]::GetCursorPos([ref]$point); $inputProviderReady = ($desktop -ne [IntPtr]::Zero) -and $cursor; [void]$inputEvidence.Add("user32 providerReady=$inputProviderReady; desktop=$($desktop -ne [IntPtr]::Zero); cursorReadable=$cursor; no input emitted by probe; per-target UIPI may still deny an action") } catch { [void]$inputEvidence.Add("input probe failed: $($_.Exception.Message)") }')
          replace_once('src/gui/local-runtime.ts',
            'Result @{ userInteractive = [Environment]::UserInteractive; accessibility = @{ available = $accessibility; evidence = @($accessibilityEvidence) }; screen = @{ available = $screen; bounds = $bounds; evidence = @($screenEvidence) }; input = @{ available = $input; evidence = @($inputEvidence) } }',
            'Result @{ userInteractive = [Environment]::UserInteractive; accessibility = @{ available = $accessibility; evidence = @($accessibilityEvidence) }; screen = @{ available = $screen; bounds = $bounds; evidence = @($screenEvidence) }; input = @{ providerReady = $inputProviderReady; evidence = @($inputEvidence) } }')

          replace_once('src/gui/local-runtime.ts',
            "          'left' { [AbosGuiInput]::mouse_event(0x0002,0,0,0,[UIntPtr]::Zero); [AbosGuiInput]::mouse_event(0x0004,0,0,0,[UIntPtr]::Zero) }\n          'right' { [AbosGuiInput]::mouse_event(0x0008,0,0,0,[UIntPtr]::Zero); [AbosGuiInput]::mouse_event(0x0010,0,0,0,[UIntPtr]::Zero) }\n          'middle' { [AbosGuiInput]::mouse_event(0x0020,0,0,0,[UIntPtr]::Zero); [AbosGuiInput]::mouse_event(0x0040,0,0,0,[UIntPtr]::Zero) }",
            "          'left' { $sent = [AbosGuiInput]::SendMouseClick(0x0002,0x0004) }\n          'right' { $sent = [AbosGuiInput]::SendMouseClick(0x0008,0x0010) }\n          'middle' { $sent = [AbosGuiInput]::SendMouseClick(0x0020,0x0040) }")
          replace_once('src/gui/local-runtime.ts',
            "          default { throw \"unsupported pointer button: $button\" }\n        }\n      }",
            "          default { throw \"unsupported pointer button: $button\" }\n        }\n        if ($sent -ne 2) { throw \"SendInput accepted $sent of 2 mouse inputs\" }\n      }")

          old_key = '''    if ($action -eq 'key_press') {
      $key = Virtual-Key ([string]$protocol.key); $modifierMap = @{ CTRL = [ushort]0x11; ALT = [ushort]0x12; SHIFT = [ushort]0x10; WIN = [ushort]0x5B }; $mods = @($protocol.modifiers | ForEach-Object { ([string]$_).ToUpperInvariant() })
      foreach ($mod in $mods) { if (-not $modifierMap.ContainsKey($mod)) { throw "unsupported modifier: $mod" }; if (-not [AbosGuiInput]::SendVirtualKey($modifierMap[$mod], $false)) { throw "failed to press modifier: $mod" } }
      try { if (-not [AbosGuiInput]::SendVirtualKey($key, $false)) { throw 'failed to press key' }; if (-not [AbosGuiInput]::SendVirtualKey($key, $true)) { throw 'failed to release key' } } finally { [array]::Reverse($mods); foreach ($mod in $mods) { [void][AbosGuiInput]::SendVirtualKey($modifierMap[$mod], $true) } }
      Result @{ action = $action; key = [string]$protocol.key; modifiers = @($mods) }
    }'''
          new_key = '''    if ($action -eq 'key_press') {
      $key = Virtual-Key ([string]$protocol.key); $modifierMap = @{ CTRL = [ushort]0x11; ALT = [ushort]0x12; SHIFT = [ushort]0x10; WIN = [ushort]0x5B }; $mods = @($protocol.modifiers | ForEach-Object { ([string]$_).ToUpperInvariant() })
      $pressed = New-Object System.Collections.ArrayList; $keyDown = $false
      try {
        foreach ($mod in $mods) {
          if (-not $modifierMap.ContainsKey($mod)) { throw "unsupported modifier: $mod" }
          if (-not [AbosGuiInput]::SendVirtualKey($modifierMap[$mod], $false)) { throw "failed to press modifier: $mod" }
          [void]$pressed.Add($mod)
        }
        if (-not [AbosGuiInput]::SendVirtualKey($key, $false)) { throw 'failed to press key' }
        $keyDown = $true
        if (-not [AbosGuiInput]::SendVirtualKey($key, $true)) { throw 'failed to release key' }
        $keyDown = $false
      } finally {
        if ($keyDown) { [void][AbosGuiInput]::SendVirtualKey($key, $true) }
        $release = @($pressed); [array]::Reverse($release)
        foreach ($mod in $release) { [void][AbosGuiInput]::SendVirtualKey($modifierMap[$mod], $true) }
      }
      Result @{ action = $action; key = [string]$protocol.key; modifiers = @($mods) }
    }'''
          replace_once('src/gui/local-runtime.ts', old_key, new_key)

          insert_before = 'export class LocalGuiRuntime {'
          helper = '''export function prepareGuiCaptureTarget(
  captureRoot = path.join(getHomeDir(), ".abos", "gui-captures"),
  idFactory: () => string = randomUUID,
): string {
  const lexicalRoot = confinePathToLocalHome(captureRoot, "gui capture root");
  if (typeof lexicalRoot === "object") throw new Error(lexicalRoot.error);
  fs.mkdirSync(lexicalRoot, { recursive: true });
  const realRoot = fs.realpathSync(lexicalRoot);
  const confinedRoot = confinePathToLocalHome(realRoot, "gui capture real root");
  if (typeof confinedRoot === "object") throw new Error(confinedRoot.error);
  const proposed = path.join(confinedRoot, `gui-${Date.now()}-${idFactory()}.png`);
  const confined = confinePathToLocalHome(proposed, "gui capture");
  if (typeof confined === "object") throw new Error(confined.error);
  if (fs.existsSync(confined)) throw new Error(`gui capture target already exists: ${confined}`);
  return confined;
}

export class LocalGuiRuntime {'''
          replace_once('src/gui/local-runtime.ts', insert_before, helper)
          replace_once('src/gui/local-runtime.ts',
            'export class LocalGuiRuntime {\n  private runWindows',
            'export class LocalGuiRuntime {\n  private inputVerifiedAt: string | null = null;\n\n  private runWindows')

          replace_once('src/gui/local-runtime.ts',
            'return { observedAt, platform: process.platform, accessibility: { available: false, evidence: [...evidence] }, screen: { available: false, bounds: null, evidence: [...evidence] }, input: { available: false, evidence: [...evidence] } };',
            'return { observedAt, platform: process.platform, accessibility: { available: false, state: "unavailable", evidence: [...evidence] }, screen: { available: false, state: "unavailable", bounds: null, evidence: [...evidence] }, input: { available: false, state: "unavailable", evidence: [...evidence] } };')

          old_return = '''      return {
        observedAt, platform: process.platform,
        accessibility: { available: accessibility.available === true, evidence: asEvidence(accessibility.evidence) },
        screen: { available: screen.available === true, bounds: asBounds(screen.bounds), evidence: asEvidence(screen.evidence) },
        input: { available: input.available === true, evidence: asEvidence(input.evidence) },
      };'''
          new_return = '''      const accessibilityAvailable = accessibility.available === true;
      const screenAvailable = screen.available === true;
      const inputProviderReady = input.providerReady === true;
      const inputAvailable = inputProviderReady && this.inputVerifiedAt !== null;
      const inputEvidence = asEvidence(input.evidence);
      inputEvidence.push(inputAvailable
        ? `Low-level input was explicitly accepted at ${this.inputVerifiedAt}.`
        : inputProviderReady
          ? "Low-level input provider is present, but no input effect is emitted during probe; execution readiness remains probed until an explicit gui_input succeeds."
          : "Low-level input provider was not observed ready.");
      return {
        observedAt, platform: process.platform,
        accessibility: { available: accessibilityAvailable, state: accessibilityAvailable ? "verified_available" : "unavailable", evidence: asEvidence(accessibility.evidence) },
        screen: { available: screenAvailable, state: screenAvailable ? "verified_available" : "unavailable", bounds: asBounds(screen.bounds), evidence: asEvidence(screen.evidence) },
        input: { available: inputAvailable, state: inputAvailable ? "verified_available" : inputProviderReady ? "probed" : "unavailable", evidence: inputEvidence },
      };'''
          replace_once('src/gui/local-runtime.ts', old_return, new_return)

          replace_once('src/gui/local-runtime.ts',
            'return { observedAt, platform: process.platform, accessibility: { available: false, evidence: [...evidence] }, screen: { available: false, bounds: null, evidence: [...evidence] }, input: { available: false, evidence: [...evidence] } };',
            'return { observedAt, platform: process.platform, accessibility: { available: false, state: "unavailable", evidence: [...evidence] }, screen: { available: false, state: "unavailable", bounds: null, evidence: [...evidence] }, input: { available: false, state: "unavailable", evidence: [...evidence] } };')

          old_capture = '''    const dir = path.join(getHomeDir(), ".abos", "gui-captures"); fs.mkdirSync(dir, { recursive: true });
    const proposed = path.join(dir, `gui-${Date.now()}-${randomUUID()}.png`); const confined = confinePathToLocalHome(proposed, "gui capture");
    if (typeof confined === "object") throw new Error(confined.error);
    const result = this.runWindows({ op: "capture", path: confined }); const bounds = asBounds(result.bounds);
    if (!bounds) throw new Error("GUI capture provider returned invalid screen bounds");
    if (!fs.existsSync(confined)) throw new Error("GUI capture provider did not materialize the PNG");
    const signature = fs.readFileSync(confined).subarray(0, 8).toString("hex");'''
          new_capture = '''    const confined = prepareGuiCaptureTarget();
    const result = this.runWindows({ op: "capture", path: confined }); const bounds = asBounds(result.bounds);
    if (!bounds) throw new Error("GUI capture provider returned invalid screen bounds");
    if (!fs.existsSync(confined)) throw new Error("GUI capture provider did not materialize the PNG");
    const outputStat = fs.lstatSync(confined);
    if (outputStat.isSymbolicLink() || !outputStat.isFile()) { fs.rmSync(confined, { force: true }); throw new Error("GUI capture output is not a regular file"); }
    const signature = fs.readFileSync(confined).subarray(0, 8).toString("hex");'''
          replace_once('src/gui/local-runtime.ts', old_capture, new_capture)

          replace_once('src/gui/local-runtime.ts',
            '    if (!probe.input.available) throw new Error(`GUI low-level input is unavailable: ${probe.input.evidence.join("; ")}`);',
            '    if (probe.input.state === "unavailable") throw new Error(`GUI low-level input provider is unavailable: ${probe.input.evidence.join("; ")}`);')
          replace_once('src/gui/local-runtime.ts',
            '    const result = this.runWindows(protocol); const { ok: _ok, ...output } = result;\n    return { ...output, observedAt: new Date().toISOString() };',
            '    const result = this.runWindows(protocol); const { ok: _ok, ...output } = result;\n    const observedAt = new Date().toISOString();\n    this.inputVerifiedAt = observedAt;\n    return { ...output, observedAt };')

          # Environment capability state must preserve probed vs verified per primitive.
          replace_once('src/environments/local.ts',
            '''    if (!gui.input.available) {
      constraints.push(
        "Local low-level GUI input is currently unavailable or not authorized on this host.",
      );
    }''',
            '''    if (gui.input.state === "probed") {
      constraints.push(
        "Local low-level GUI input provider is present, but execution readiness is not verified until an explicit input action succeeds.",
      );
    } else if (!gui.input.available) {
      constraints.push(
        "Local low-level GUI input is currently unavailable on this host.",
      );
    }''')
          replace_once('src/environments/local.ts',
            '        guiInputAvailable: gui.input.available,\n        guiObservedAt: gui.observedAt,',
            '        guiInputAvailable: gui.input.available,\n        guiInputState: gui.input.state,\n        guiObservedAt: gui.observedAt,')
          replace_once('src/environments/local.ts',
            '          state: gui.accessibility.available ? "verified_available" : "unavailable",',
            '          state: gui.accessibility.state,')
          replace_once('src/environments/local.ts',
            '          state: gui.screen.available ? "verified_available" : "unavailable",',
            '          state: gui.screen.state,')
          replace_once('src/environments/local.ts',
            '          state: gui.input.available ? "verified_available" : "unavailable",',
            '          state: gui.input.state,')

          # P-014 registry: retain an explicit provider state when the environment itself is available.
          replace_once('src/capabilities/registry.ts',
            '''  if (snapshot.availability === "available") {
    return capability.available ? "verified_available" : "unavailable";
  }''',
            '''  if (snapshot.availability === "available") {
    const explicitState = typeof capability.state === "string" && capability.state.trim()
      ? capability.state.trim()
      : null;
    if (explicitState) {
      if (explicitState === "verified_available" && !capability.available) return "probed";
      return explicitState;
    }
    return capability.available ? "verified_available" : "unavailable";
  }''')

          # Wire GUI tools through the existing builtin/policy/capability pipeline.
          replace_once('src/agent/tools.ts',
            'import { applyP012ToolRouting } from "./tools-p012-adapter.js";',
            'import { applyP012ToolRouting } from "./tools-p012-adapter.js";\nimport { createGuiTools } from "../gui/tools.js";')
          replace_once('src/agent/tools.ts',
            '  return applyP012ToolRouting(createCoreBuiltinTools(sandboxId), sandboxId);',
            '  return applyP012ToolRouting([\n    ...createCoreBuiltinTools(sandboxId),\n    ...createGuiTools(),\n  ], sandboxId);')

          # Fail closed on programmatic calls that bypass JSON-schema validation.
          replace_once('src/gui/tools.ts',
            '''          const modifiers = Array.isArray(args.modifiers)
            ? args.modifiers.filter((entry): entry is "CTRL" | "ALT" | "SHIFT" | "WIN" => ["CTRL", "ALT", "SHIFT", "WIN"].includes(String(entry)))
            : undefined;
          return encode(runtime.input({ action, key: args.key, modifiers }));''',
            '''          let modifiers: Array<"CTRL" | "ALT" | "SHIFT" | "WIN"> | undefined;
          if (Array.isArray(args.modifiers)) {
            const allowed = new Set(["CTRL", "ALT", "SHIFT", "WIN"]);
            if (args.modifiers.some((entry) => typeof entry !== "string" || !allowed.has(entry))) {
              throw new Error("gui_input key_press received an unsupported modifier");
            }
            modifiers = args.modifiers as Array<"CTRL" | "ALT" | "SHIFT" | "WIN">;
          }
          return encode(runtime.input({ action, key: args.key, modifiers }));''')
          PY

          cat > src/__tests__/p016-local-gui-runtime.test.ts <<'EOF'
          import { spawn, type ChildProcess } from "node:child_process";
          import { randomUUID } from "node:crypto";
          import fs from "node:fs";
          import os from "node:os";
          import path from "node:path";
          import { afterEach, describe, expect, it } from "vitest";
          import { createBuiltinTools } from "../agent/tools.js";
          import { CapabilityRegistry } from "../capabilities/registry.js";
          import { LocalEnvironmentProvider } from "../environments/local.js";
          import { LocalGuiRuntime, prepareGuiCaptureTarget } from "../gui/local-runtime.js";
          import { createGuiTools } from "../gui/tools.js";
          import { getHomeDir } from "../platform/home.js";

          const cleanupPaths: string[] = [];
          const cleanupProcesses: ChildProcess[] = [];

          afterEach(() => {
            for (const child of cleanupProcesses.splice(0)) {
              try { child.kill(); } catch {}
            }
            for (const entry of cleanupPaths.splice(0)) {
              try { fs.rmSync(entry, { recursive: true, force: true }); } catch {}
            }
          });

          async function waitUntil<T>(probe: () => T | null | undefined, timeoutMs = 15_000): Promise<T> {
            const deadline = Date.now() + timeoutMs;
            let last: T | null | undefined;
            while (Date.now() < deadline) {
              last = probe();
              if (last) return last;
              await new Promise((resolve) => setTimeout(resolve, 250));
            }
            throw new Error(`condition not observed before timeout; last=${String(last)}`);
          }

          describe("P016 local GUI runtime", () => {
            it("wires GUI tools through the canonical builtin tool pipeline", () => {
              const names = new Set(createBuiltinTools("").map((tool) => tool.name));
              for (const name of ["gui_snapshot", "gui_capture", "gui_act", "gui_input"]) {
                expect(names.has(name)).toBe(true);
              }
            });

            it("preserves a probed per-capability state from an available environment", () => {
              const registry = new CapabilityRegistry();
              registry.registerEnvironmentSnapshot({
                id: "local",
                label: "Local",
                availability: "available",
                observedAt: new Date().toISOString(),
                evidence: ["host observed"],
                constraints: [],
                capabilities: [{
                  id: "local:gui-input",
                  type: "executor",
                  provider: "local-gui",
                  description: "input provider",
                  requirements: ["gui input"],
                  provides: ["gui input"],
                  permissions: ["desktop-input"],
                  available: false,
                  state: "probed",
                  observedAt: new Date().toISOString(),
                  authority: "local-gui-runtime:input-probe",
                  evidence: ["provider present; no input emitted"],
                }],
              });
              expect(registry.get("local:gui-input")?.state).toBe("probed");
              expect(registry.get("local:gui-input")?.available).toBe(false);
            });

            it("projects split GUI primitive state without fabricating input readiness", async () => {
              const provider = new LocalEnvironmentProvider(
                { probe: async () => ({ available: false, observedAt: new Date().toISOString(), evidence: ["no browser"] }) } as any,
                { probe: () => ({ available: true, observedAt: new Date().toISOString(), shell: "shell", evidence: ["shell ready"] }) } as any,
                { probe: () => ({
                  observedAt: new Date().toISOString(), platform: "win32",
                  accessibility: { available: true, state: "verified_available", evidence: ["uia root"] },
                  screen: { available: true, state: "verified_available", bounds: { x: 0, y: 0, width: 100, height: 100 }, evidence: ["capture works"] },
                  input: { available: false, state: "probed", evidence: ["provider only"] },
                }) } as any,
              );
              const snapshot = await provider.inspect();
              expect(snapshot.capabilities.find((entry) => entry.id === "local:gui-accessibility")?.state).toBe("verified_available");
              expect(snapshot.capabilities.find((entry) => entry.id === "local:gui-screen")?.state).toBe("verified_available");
              expect(snapshot.capabilities.find((entry) => entry.id === "local:gui-input")?.state).toBe("probed");
              expect(snapshot.constraints.join(" ")).toContain("not verified until an explicit input action succeeds");
            });

            it("rejects unsupported modifiers instead of silently dropping them", async () => {
              const runtime = { input: () => ({ ok: true }) } as any;
              const tool = createGuiTools(runtime).find((entry) => entry.name === "gui_input")!;
              await expect(tool.execute({ action: "key_press", key: "A", modifiers: ["CTRL", "NOPE"] } as any, {} as any))
                .rejects.toThrow("unsupported modifier");
            });

            if (process.platform !== "win32") {
              it("classifies unsupported host GUI primitives as unavailable, not impossible", () => {
                const probe = new LocalGuiRuntime().probe();
                expect(probe.accessibility.state).toBe("unavailable");
                expect(probe.screen.state).toBe("unavailable");
                expect(probe.input.state).toBe("unavailable");
                expect(probe.input.evidence.join(" ")).toContain("No validated provider-native GUI adapter");
              });

              it("rejects a capture root whose materialized realpath escapes HOME", () => {
                const inside = fs.mkdtempSync(path.join(getHomeDir(), ".abos-gui-path-"));
                const outside = fs.mkdtempSync(path.join(os.tmpdir(), "abos-gui-outside-"));
                cleanupPaths.push(inside, outside);
                const link = path.join(inside, "capture-link");
                fs.symlinkSync(outside, link, "dir");
                expect(() => prepareGuiCaptureTarget(link, () => "fixed-id"))
                  .toThrow("outside the allowed directory");
              });
            }

            if (process.platform === "win32") {
              it("observes and controls a real Windows UI, verifies explicit input, captures screen and cleans up", async () => {
                const runtime = new LocalGuiRuntime();
                const initial = runtime.probe();
                expect(initial.accessibility.state).toBe("verified_available");
                expect(initial.screen.state).toBe("verified_available");
                expect(["probed", "verified_available"]).toContain(initial.input.state);
                expect(initial.screen.bounds).not.toBeNull();

                const token = randomUUID().replace(/-/g, "");
                const title = `ABOS GUI ${token}`;
                const buttonName = `ABOS Trigger ${token}`;
                const marker = path.join(getHomeDir(), `.abos-gui-marker-${token}.txt`);
                cleanupPaths.push(marker);
                const q = (value: string) => `'${value.replace(/'/g, "''")}'`;
                const script = [
                  "Add-Type -AssemblyName System.Windows.Forms",
                  "$form = New-Object System.Windows.Forms.Form",
                  `$form.Text = ${q(title)}`,
                  "$form.Width = 420; $form.Height = 220",
                  "$button = New-Object System.Windows.Forms.Button",
                  `$button.Text = ${q(buttonName)}`,
                  "$button.Left = 40; $button.Top = 60; $button.Width = 280; $button.Height = 50",
                  `$button.Add_Click({ [System.IO.File]::WriteAllText(${q(marker)}, 'invoked') })`,
                  "$form.Controls.Add($button)",
                  "[void]$form.ShowDialog()",
                ].join("; ");
                const child = spawn("powershell.exe", ["-NoLogo", "-NoProfile", "-STA", "-Command", script], { windowsHide: false, stdio: "ignore" });
                cleanupProcesses.push(child);

                const observed = await waitUntil(() => {
                  try {
                    const snapshot = runtime.snapshot({ maxDepth: 6, maxNodes: 500 });
                    return snapshot.elements.find((entry) => entry.name === title) ?? null;
                  } catch {
                    return null;
                  }
                });
                expect(observed.processId).toBeGreaterThan(0);

                runtime.act("focus", { name: title, processId: observed.processId });
                runtime.act("invoke", { name: buttonName, processId: observed.processId });
                await waitUntil(() => fs.existsSync(marker) ? true : null);
                expect(fs.readFileSync(marker, "utf8")).toBe("invoked");

                const bounds = initial.screen.bounds!;
                const x = bounds.x + Math.max(0, Math.min(10, bounds.width - 1));
                const y = bounds.y + Math.max(0, Math.min(10, bounds.height - 1));
                const input = runtime.input({ action: "pointer_move", x, y });
                expect(input.action).toBe("pointer_move");
                const afterInput = runtime.probe();
                expect(afterInput.input.state).toBe("verified_available");
                expect(afterInput.input.available).toBe(true);

                const capture = runtime.capture();
                cleanupPaths.push(capture.path);
                expect(fs.readFileSync(capture.path).subarray(0, 8).toString("hex")).toBe("89504e470d0a1a0a");
                expect(path.resolve(capture.path).startsWith(path.resolve(getHomeDir()) + path.sep)).toBe(true);
              }, 60_000);
            }
          });
          EOF

      - name: Install and validate Linux/source surface
        run: |
          pnpm install --frozen-lockfile
          pnpm run typecheck
          pnpm run build
          pnpm exec vitest run src/__tests__/p016-local-gui-runtime.test.ts src/__tests__/capability-registry.test.ts src/__tests__/p016-local-computer-runtime.test.ts
          pnpm run test:diagnose
          pnpm run test:security
          pnpm audit
          node scripts/projectops-integrity-verify.mjs
          git diff --check

      - name: Commit validated product correction
        id: source
        shell: bash
        run: |
          git add src/gui/local-runtime.ts src/gui/tools.ts src/environments/local.ts src/capabilities/registry.ts src/agent/tools.ts src/__tests__/p016-local-gui-runtime.test.ts
          git commit -m 'fix(p016): complete and harden local GUI hands'
          SOURCE_SHA=$(git rev-parse HEAD)
          echo "sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
          git push origin HEAD:abos/p016-computer-browser-gui-hands

  windows-material-validate:
    needs: apply-and-linux-validate
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: abos/p016-computer-browser-gui-hands
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
      - uses: pnpm/action-setup@v4
      - name: Assert exact product source head
        shell: pwsh
        run: |
          $expected = '${{ needs.apply-and-linux-validate.outputs.source_sha }}'
          $actual = git rev-parse HEAD
          if ($actual -ne $expected) { throw "expected source head $expected but checked out $actual" }
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm run build
      - name: Real Windows GUI/accessibility regression
        shell: pwsh
        run: pnpm exec vitest run src/__tests__/p016-local-gui-runtime.test.ts src/__tests__/p016-local-computer-runtime.test.ts src/__tests__/tools-security.test.ts src/__tests__/command-injection.test.ts
      - name: ProjectOps integrity
        shell: pwsh
        run: node scripts/projectops-integrity-verify.mjs
