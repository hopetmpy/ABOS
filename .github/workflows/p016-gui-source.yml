name: P016 GUI Source Correction

on:
  push:
    branches:
      - abos/p016-computer-browser-gui-hands
    paths:
      - .github/workflows/p016-gui-source.yml

permissions:
  contents: write

jobs:
  apply-and-linux-validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: abos/p016-computer-browser-gui-hands
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
      - uses: pnpm/action-setup@v4

      - name: Apply Windows GUI launcher transport fix
        run: python3 scripts/p016-gui-launch-fix.py

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Build
        run: pnpm run build

      - name: Targeted P016 and capability regressions
        run: pnpm exec vitest run src/__tests__/p016-local-gui-runtime.test.ts src/__tests__/p016-local-computer-runtime.test.ts src/__tests__/capability-registry.test.ts

      - name: Security regressions
        run: pnpm run test:security

      - name: ProjectOps and diff integrity
        run: |
          node scripts/projectops-integrity-verify.mjs
          git diff --check

      - name: Commit validated launcher correction
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/gui/local-runtime.ts
          git commit -m 'fix(p016): avoid Windows GUI command-line overflow'
          git push origin HEAD:abos/p016-computer-browser-gui-hands
