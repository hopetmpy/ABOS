name: P016 Structured Browser Apply R2

on:
  push:
    branches:
      - abos/p016-computer-browser-gui-hands
    paths:
      - .github/workflows/p016-structured-browser-apply-r2.yml

permissions:
  contents: write

jobs:
  apply-validate-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: pnpm/action-setup@v4

      - name: Configure bot commit identity
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Correct first-attempt transform and apply source
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path("scripts/p016-structured-browser-apply.py")
          s = p.read_text(encoding="utf-8")
          raw_prefix = "dedent(r'''" + chr(92) + "\n"
          count = s.count(raw_prefix)
          if count == 0:
              raise SystemExit("expected raw dedent prefixes from first attempt")
          s = s.replace(raw_prefix, "dedent(r'''\n")
          fragile = '    replace_once("src/__tests__/path-protection.test.ts", test_anchor, test_replacement)\n'
          if fragile not in s:
              raise SystemExit("expected fragile path-protection test edit from first attempt")
          s = s.replace(fragile, "", 1)
          p.write_text(s, encoding="utf-8")
          print(f"corrected {count} raw-dedent prefixes and retired fragile test splice")
          PY
          python scripts/p016-structured-browser-apply.py
          cat > src/__tests__/p016-browser-upload-policy.test.ts <<'EOF'
          import { describe, expect, it } from "vitest";
          import { createPathProtectionRules } from "../agent/policy-rules/path-protection.js";
          import type { AbosTool, PolicyRequest, ToolContext } from "../types.js";

          function tool(): AbosTool {
            return {
              name: "browser_upload",
              description: "P-016 policy fixture",
              category: "browser",
              riskLevel: "caution",
              parameters: {},
              execute: async () => "",
            };
          }

          function request(paths: string[]): PolicyRequest {
            return {
              tool: tool(),
              args: { paths },
              context: {} as ToolContext,
              turnContext: {
                inputSource: undefined,
                turnToolCallCount: 0,
                sessionSpend: {
                  recordSpend: () => {},
                  getHourlySpend: () => 0,
                  getDailySpend: () => 0,
                  getTotalSpend: () => 0,
                  checkLimit: () => ({
                    allowed: true,
                    currentHourlySpend: 0,
                    currentDailySpend: 0,
                    limitHourly: 0,
                    limitDaily: 0,
                  }),
                  pruneOldRecords: () => 0,
                },
              },
            };
          }

          describe("P-016 browser upload policy", () => {
            const rule = createPathProtectionRules().find(
              (candidate) => candidate.id === "path.read_sensitive",
            )!;

            it("denies the whole upload when any path is sensitive", () => {
              const result = rule.evaluate(request(["notes.txt", "wallet.json"]));
              expect(result).not.toBeNull();
              expect(result!.action).toBe("deny");
              expect(result!.reasonCode).toBe("SENSITIVE_FILE_READ");
            });

            it("does not manufacture a denial for ordinary upload files", () => {
              expect(rule.evaluate(request(["notes.txt", "report.csv"]))).toBeNull();
            });
          });
          EOF
          pnpm add --save-exact playwright-core@1.63.0

      - name: Install frozen dependency graph
        run: pnpm install --frozen-lockfile

      - name: Run targeted adversarial regressions
        shell: bash
        run: >-
          pnpm exec vitest run
          src/__tests__/p016-url-trust.test.ts
          src/__tests__/p016-local-browser-runtime.test.ts
          src/__tests__/p016-browser-upload-policy.test.ts
          src/__tests__/path-protection.test.ts
          src/__tests__/http-client.test.ts
          src/__tests__/mcp-http-runtime.test.ts

      - name: Typecheck
        run: pnpm run typecheck

      - name: Build
        run: pnpm run build

      - name: Run full test suite
        timeout-minutes: 7
        shell: bash
        run: |
          set +e
          timeout 360 pnpm run test:diagnose
          RC=$?
          set -e
          if [ "$RC" -eq 124 ]; then
            echo "::error::Full test suite timed out or left active handles"
          fi
          exit "$RC"

      - name: Run security-focused regressions
        timeout-minutes: 4
        shell: bash
        run: |
          set +e
          timeout 210 pnpm exec vitest run -t "security|injection|policy|financial"
          RC=$?
          set -e
          if [ "$RC" -eq 124 ]; then
            echo "::error::Security-focused suite timed out or left active handles"
          fi
          exit "$RC"

      - name: Audit dependency graph
        run: pnpm audit

      - name: Probe a real installed browser when available
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          import http from "node:http";
          import os from "node:os";
          import path from "node:path";
          import { LocalBrowserRuntime } from "./dist/browser/local-runtime.js";

          const statusPath = ".p016-browser-smoke-status";
          const server = http.createServer((req, res) => {
            if (req.url === "/download") {
              res.writeHead(200, {
                "content-type": "text/plain",
                "content-disposition": 'attachment; filename="artifact.txt"',
              });
              res.end("ABOS-P016-download");
              return;
            }
            res.writeHead(200, { "content-type": "text/html; charset=utf-8" });
            res.end(`<!doctype html><html><body>
              <p id="state">ready</p>
              <label>Name <input aria-label="Name"></label>
              <input type="file" aria-label="Upload">
              <button aria-label="Advance" onclick="document.querySelector('#state').textContent='done'">Go</button>
              <a href="/download">Download</a>
              </body></html>`);
          });
          await new Promise((resolve, reject) => {
            server.once("error", reject);
            server.listen(0, "127.0.0.1", resolve);
          });
          const address = server.address();
          if (!address || typeof address === "string") throw new Error("fixture server has no TCP address");

          const runtime = new LocalBrowserRuntime({ probeCacheMs: 0 });
          let sessionId = null;
          let uploadPath = null;
          let downloadedPath = null;
          try {
            const probe = await runtime.probe({ force: true });
            if (!probe.available) {
              const compact = probe.evidence.join(" | ").replace(/\s+/g, " ").slice(0, 800);
              fs.writeFileSync(statusPath, `UNAVAILABLE_ON_APPLY_RUNNER:${compact}\n`);
              console.log("No launchable host browser on this runner; UNAVAILABLE is explicit and no browser was provisioned.");
            } else {
              const opened = await runtime.open(`http://127.0.0.1:${address.port}/`);
              sessionId = opened.sessionId;
              const first = await runtime.snapshot(sessionId);
              if (!first.snapshot.includes("ready")) throw new Error("accessibility snapshot did not expose fixture state");
              await runtime.act(sessionId, "fill", { label: "Name" }, "ABOS");
              await runtime.act(sessionId, "click", { role: "button", name: "Advance" });
              const after = await runtime.snapshot(sessionId);
              if (!after.snapshot.includes("done")) throw new Error("semantic click did not change fixture state");

              uploadPath = path.join(os.homedir(), "p016-browser-upload.txt");
              fs.writeFileSync(uploadPath, "ABOS-P016-upload");
              await runtime.upload(sessionId, { label: "Upload" }, [uploadPath]);
              const downloaded = await runtime.download(sessionId, { text: "Download" });
              downloadedPath = downloaded.path;
              if (downloaded.sizeBytes <= 0) throw new Error("download was empty");
              const home = path.resolve(os.homedir());
              const resolvedDownload = path.resolve(downloaded.path);
              if (resolvedDownload !== home && !resolvedDownload.startsWith(home + path.sep)) {
                throw new Error("download escaped local home confinement");
              }
              fs.writeFileSync(
                statusPath,
                `PASS:browserVersion=${probe.browserVersion ?? "unknown"};target=${probe.target?.label ?? "unknown"};snapshot=aria;semanticActions=fill+click;upload=verified;downloadBytes=${downloaded.sizeBytes}\n`,
              );
            }
          } finally {
            if (sessionId) {
              try { await runtime.close(sessionId); } catch {}
            }
            await runtime.closeAll();
            if (uploadPath) {
              try { fs.unlinkSync(uploadPath); } catch {}
            }
            if (downloadedPath) {
              try { fs.unlinkSync(downloadedPath); } catch {}
            }
            await new Promise((resolve) => server.close(resolve));
          }
          NODE

      - name: Record validated source checkpoint
        shell: bash
        run: |
          set -euo pipefail
          test -s .p016-browser-smoke-status
          python scripts/p016-structured-browser-apply.py --record-success "${GITHUB_RUN_ID}"

      - name: Verify ProjectOps and clean diff
        shell: bash
        run: |
          set -euo pipefail
          node scripts/projectops-integrity-verify.mjs
          git diff --check

      - name: Remove temporary apply machinery and commit clean source tree
        shell: bash
        run: |
          set -euo pipefail
          rm -f scripts/p016-structured-browser-apply.py
          rm -f .github/workflows/p016-structured-browser-apply.yml
          rm -f .github/workflows/p016-structured-browser-apply-r2.yml
          rm -f .p016-browser-smoke-status
          git add -A
          git diff --cached --check
          git status --short
          git diff --cached --stat
          git commit -m "feat(p016): add structured local browser authority"
          git push origin HEAD:abos/p016-computer-browser-gui-hands
