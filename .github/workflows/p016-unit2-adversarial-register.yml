name: P016 Unit2 Adversarial Register

on:
  push:
    branches:
      - abos/p016-computer-browser-gui-hands

permissions:
  contents: write

jobs:
  register:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Register adversarial findings before source correction
        run: python scripts/p016-unit2-adversarial-register.py
      - name: Verify continuity-only diff
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          CHANGED=$(git diff --name-only)
          test "$CHANGED" = "ProjectOps/continuity/C0012.md"
      - name: Commit canonical continuity checkpoint
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ProjectOps/continuity/C0012.md
          git commit -m "docs(p016): record unit2 adversarial findings"
          git push origin HEAD:${GITHUB_REF_NAME}
