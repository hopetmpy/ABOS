name: P016 Unit2 Decision

on:
  push:
    branches:
      - abos/p016-computer-browser-gui-hands
    paths:
      - .github/workflows/p016-unit2-decision.yml

permissions:
  contents: write

jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure bot commit identity
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Record decision before product source
        shell: bash
        run: |
          set -euo pipefail
          python scripts/p016-unit2-decision.py
          node scripts/projectops-integrity-verify.mjs
          git diff --check
          git add ProjectOps/CONTINUITY.md ProjectOps/continuity/C0012.md
          git diff --cached --check
          git commit -m "docs(p016): record local computer decision before source"
          git push origin HEAD:abos/p016-computer-browser-gui-hands
