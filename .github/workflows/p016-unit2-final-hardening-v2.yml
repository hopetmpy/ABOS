name: P016 Unit2 Final Hardening V2

on:
  push:
    branches:
      - abos/p016-computer-browser-gui-hands

permissions:
  contents: write

jobs:
  validate-ubuntu:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile
      - name: Apply deterministic v2 candidate
        run: python scripts/p016-unit2-final-hardening-v2.py
      - name: Inspect candidate diff
        shell: bash
        run: |
          set -euo pipefail
          git status --short
          git diff --check
          git diff --stat
      - name: Targeted unit2 regressions
        run: >
          pnpm exec vitest run
          src/__tests__/p016-local-computer-runtime.test.ts
          src/__tests__/command-injection.test.ts
          src/__tests__/tools-security.test.ts
      - run: pnpm run typecheck
      - run: pnpm run build
      - name: Full suite with hang detection
        shell: bash
        run: |
          set +e
          timeout 360 pnpm run test:diagnose
          RC=$?
          set -e
          if [ $RC -eq 124 ]; then echo "::error::vitest timed out or left active handles"; fi
          exit $RC
      - name: Security and policy regressions
        shell: bash
        run: |
          set +e
          timeout 240 pnpm exec vitest run -t "security|injection|policy|process|filesystem|move|cancel|environment"
          RC=$?
          set -e
          if [ $RC -eq 124 ]; then echo "::error::security/adversarial tests timed out"; fi
          exit $RC
      - run: pnpm audit
      - run: node scripts/projectops-integrity-verify.mjs

  validate-windows:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile
      - name: Apply deterministic v2 candidate
        run: python scripts/p016-unit2-final-hardening-v2.py
      - run: pnpm run typecheck
      - run: pnpm run build
      - name: Windows unit2 regressions
        shell: pwsh
        run: >
          pnpm exec vitest run
          src/__tests__/p016-local-computer-runtime.test.ts
          src/__tests__/command-injection.test.ts
          src/__tests__/tools-security.test.ts

  commit:
    if: github.actor != 'github-actions[bot]'
    needs: [validate-ubuntu, validate-windows]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply validated v2 candidate
        run: python scripts/p016-unit2-final-hardening-v2.py
      - name: Verify ProjectOps remains intact
        run: node scripts/projectops-integrity-verify.mjs
      - name: Commit validated source
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/platform/local-computer-runtime.ts \
            src/agent/tools-core.ts \
            src/__tests__/p016-local-computer-runtime.test.ts
          git commit -m "fix(p016): contain managed process trees"
          git push origin HEAD:${GITHUB_REF_NAME}
