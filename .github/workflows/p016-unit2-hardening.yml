name: P016 Unit2 Adversarial Hardening

on:
  push:
    branches:
      - abos/p016-computer-browser-gui-hands

permissions:
  contents: write

jobs:
  harden-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile
      - name: Apply deterministic adversarial corrections
        run: python scripts/p016-unit2-hardening.py
      - name: Inspect candidate diff
        shell: bash
        run: |
          set -euo pipefail
          git status --short
          git diff --check
          git diff --stat
          test -z "$(git diff --name-only | grep '^.github/workflows/' || true)"
      - name: Targeted unit2 regressions
        run: pnpm exec vitest run src/__tests__/p016-local-computer-runtime.test.ts src/__tests__/command-injection.test.ts src/__tests__/path-protection.test.ts src/__tests__/tools-security.test.ts
      - name: Typecheck
        run: pnpm run typecheck
      - name: Build
        run: pnpm run build
      - name: Full test suite with hang detection
        shell: bash
        run: |
          set +e
          timeout 360 pnpm run test:diagnose
          RC=$?
          set -e
          if [ $RC -eq 124 ]; then echo "::error::vitest timed out or left active handles"; fi
          exit $RC
      - name: Security and policy regressions
        shell: bash
        run: |
          set +e
          timeout 240 pnpm exec vitest run -t "security|injection|policy|process|filesystem|move|cancel|environment"
          RC=$?
          set -e
          if [ $RC -eq 124 ]; then echo "::error::security/adversarial tests timed out"; fi
          exit $RC
      - name: Dependency audit
        run: pnpm audit
      - name: ProjectOps integrity
        run: node scripts/projectops-integrity-verify.mjs
      - name: Commit validated corrections
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          if git diff --quiet; then
            echo "::error::Hardening helper produced no source changes"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(p016): harden local process readiness and waits"
          git push origin HEAD:${GITHUB_REF_NAME}
