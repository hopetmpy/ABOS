name: P016 Unit2 Process Tree Diagnostic

on:
  push:
    branches:
      - abos/p016-computer-browser-gui-hands

permissions:
  contents: read

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - name: Diagnose descendant containment
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import os from 'node:os';
          import path from 'node:path';
          import { LocalComputerRuntime } from './dist/platform/local-computer-runtime.js';

          const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
          let survived = false;

          for (const mode of ['kill', 'cancel']) {
            const dir = fs.mkdtempSync(path.join(os.homedir(), `.abos-p016-tree-${mode}-`));
            const marker = path.join(dir, 'descendant-marker.txt');
            const runtime = new LocalComputerRuntime(() => mode);
            const command = `node -e "setTimeout(()=>require('fs').writeFileSync('descendant-marker.txt','alive'),1200);setTimeout(()=>{},5000)" >/dev/null 2>&1 & wait`;
            const started = await runtime.start(command, { cwd: dir });
            await sleep(200);
            const outcome = mode === 'kill'
              ? await runtime.kill(started.id)
              : await runtime.cancel(started.id);
            await sleep(1800);
            const markerExists = fs.existsSync(marker);
            console.log(`PROCESS_TREE_DIAG platform=${process.platform} mode=${mode} wrapperState=${outcome.state} marker=${markerExists ? 'SURVIVED' : 'ABSENT'} waitTimedOut=${outcome.waitTimedOut}`);
            survived ||= markerExists;
          }

          if (survived) {
            console.error('PROCESS_TREE_DIAG_RESULT=DESCENDANT_SURVIVED');
            process.exit(42);
          }
          console.log('PROCESS_TREE_DIAG_RESULT=CONTAINED');
          NODE
      - name: Diagnose shell launchability probe on Windows
        if: runner.os == 'Windows'
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import os from 'node:os';
          import path from 'node:path';
          import { LocalComputerRuntime } from './dist/platform/local-computer-runtime.js';

          const fake = path.join(os.homedir(), 'abos-fake-bash.exe');
          fs.writeFileSync(fake, 'not-a-real-executable');
          const previous = {
            ABOS_BASH_PATH: process.env.ABOS_BASH_PATH,
            ProgramFiles: process.env.ProgramFiles,
            ProgramFilesX86: process.env['ProgramFiles(x86)'],
            LOCALAPPDATA: process.env.LOCALAPPDATA,
            PATH: process.env.PATH,
          };
          process.env.ABOS_BASH_PATH = fake;
          process.env.ProgramFiles = path.join(os.homedir(), 'missing-program-files');
          process.env['ProgramFiles(x86)'] = path.join(os.homedir(), 'missing-program-files-x86');
          process.env.LOCALAPPDATA = path.join(os.homedir(), 'missing-localappdata');
          process.env.PATH = '';
          const probe = new LocalComputerRuntime().probe();
          console.log(`LAUNCHABILITY_DIAG available=${probe.available} shell=${probe.shell}`);
          Object.assign(process.env, {
            ABOS_BASH_PATH: previous.ABOS_BASH_PATH,
            ProgramFiles: previous.ProgramFiles,
            LOCALAPPDATA: previous.LOCALAPPDATA,
            PATH: previous.PATH,
          });
          if (previous.ProgramFilesX86 === undefined) delete process.env['ProgramFiles(x86)'];
          else process.env['ProgramFiles(x86)'] = previous.ProgramFilesX86;
          fs.rmSync(fake, { force: true });
          if (probe.available) {
            console.error('LAUNCHABILITY_DIAG_RESULT=FALSE_READY');
            process.exit(43);
          }
          console.log('LAUNCHABILITY_DIAG_RESULT=CORRECTLY_UNAVAILABLE');
          NODE
