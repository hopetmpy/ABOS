name: P016 Unit2 Process Tree Register

on:
  push:
    branches:
      - abos/p016-computer-browser-gui-hands

permissions:
  contents: write

jobs:
  register:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Register diagnostic result
        run: python scripts/p016-unit2-process-tree-register.py
      - name: Validate ProjectOps
        run: node scripts/projectops-integrity-verify.mjs
      - name: Commit checkpoint
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ProjectOps/continuity/C0012.md
          git commit -m "docs(p016): record local process-tree falsation"
          git push origin HEAD:${GITHUB_REF_NAME}
