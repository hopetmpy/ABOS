name: P016 Windows Orphan Diagnostic

on:
  push:
    branches:
      - abos/p016-computer-browser-gui-hands

permissions:
  contents: read

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile
      - name: Apply v5 candidate without committing product
        run: python scripts/p016-unit2-readiness-v5.py
      - run: pnpm run build
      - name: Inventory managed process topology and survivors
        run: node scripts/p016-unit2-windows-orphan-diagnostic.mjs
