name: P016 Unit2 Windows Termination V6

on:
  push:
    branches:
      - abos/p016-computer-browser-gui-hands

permissions:
  contents: write

jobs:
  register:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Register v6 decision before product-source candidate
        run: python scripts/p016-unit2-register-v5.py
      - name: Verify ProjectOps before registration commit
        run: |
          git diff --check
          node scripts/projectops-integrity-verify.mjs
      - name: Commit recoverable continuity checkpoint
        shell: bash
        run: |
          set -euo pipefail
          git add ProjectOps/continuity/C0012.md
          if git diff --cached --quiet; then
            echo "v6 continuity checkpoint already present"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs(projectops): register P016 Windows termination retry"
          git push origin HEAD:${GITHUB_REF_NAME}

  validate-ubuntu:
    if: github.actor != 'github-actions[bot]'
    needs: register
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile
      - name: Apply deterministic v6 candidate
        run: python scripts/p016-unit2-readiness-v5.py
      - name: Inspect candidate diff
        shell: bash
        run: |
          set -euo pipefail
          git status --short
          git diff --check
          git diff --stat
          test "$(git diff --name-only | sort)" = $'src/__tests__/p016-local-computer-runtime.test.ts\nsrc/platform/local-computer-runtime.ts'
      - name: Targeted Unit 2 regressions
        run: >
          pnpm exec vitest run
          src/__tests__/p016-local-computer-runtime.test.ts
          src/__tests__/command-injection.test.ts
          src/__tests__/tools-security.test.ts
      - run: pnpm run typecheck
      - run: pnpm run build
      - name: Full suite with hang detection
        shell: bash
        run: |
          set +e
          timeout 360 pnpm run test:diagnose
          RC=$?
          set -e
          if [ $RC -eq 124 ]; then echo "::error::vitest timed out or left active handles"; fi
          exit $RC
      - name: Security and policy regressions
        shell: bash
        run: |
          set +e
          timeout 240 pnpm exec vitest run -t "security|injection|policy|process|filesystem|move|cancel|environment"
          RC=$?
          set -e
          if [ $RC -eq 124 ]; then echo "::error::security/adversarial tests timed out"; fi
          exit $RC
      - run: pnpm audit
      - run: node scripts/projectops-integrity-verify.mjs

  validate-windows:
    if: github.actor != 'github-actions[bot]'
    needs: register
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile
      - name: Apply deterministic v6 candidate
        run: python scripts/p016-unit2-readiness-v5.py
      - run: pnpm run typecheck
      - run: pnpm run build
      - name: Repeated Windows Unit 2 regressions
        shell: pwsh
        run: |
          1..4 | ForEach-Object {
            Write-Host "Windows adversarial pass $_/4"
            pnpm exec vitest run src/__tests__/p016-local-computer-runtime.test.ts src/__tests__/command-injection.test.ts src/__tests__/tools-security.test.ts
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - run: node scripts/projectops-integrity-verify.mjs

  commit:
    if: github.actor != 'github-actions[bot]'
    needs: [validate-ubuntu, validate-windows]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply validated v6 candidate
        run: python scripts/p016-unit2-readiness-v5.py
      - name: Verify candidate scope and ProjectOps integrity
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test "$(git diff --name-only | sort)" = $'src/__tests__/p016-local-computer-runtime.test.ts\nsrc/platform/local-computer-runtime.ts'
          node scripts/projectops-integrity-verify.mjs
      - name: Commit validated source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/platform/local-computer-runtime.ts src/__tests__/p016-local-computer-runtime.test.ts
          git commit -m "fix(p016): retry incomplete Windows tree termination"
          git push origin HEAD:${GITHUB_REF_NAME}
