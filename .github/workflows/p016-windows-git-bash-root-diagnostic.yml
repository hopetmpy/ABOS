name: P016 Windows Job Object Diagnostic V7

on:
  push:
    branches:
      - abos/p016-computer-browser-gui-hands

permissions:
  contents: write

jobs:
  register:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Register v6 falsification and v7 diagnostic before execution
        run: python scripts/p016-unit2-register-v5.py
      - name: Verify ProjectOps before checkpoint
        run: |
          git diff --check
          node scripts/projectops-integrity-verify.mjs
      - name: Commit recoverable diagnostic checkpoint
        shell: bash
        run: |
          set -euo pipefail
          git add ProjectOps/continuity/C0012.md
          if git diff --cached --quiet; then
            echo "v7 diagnostic checkpoint already present"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs(projectops): register P016 Windows job diagnostic"
          git push origin HEAD:${GITHUB_REF_NAME}

  diagnose:
    if: github.actor != 'github-actions[bot]'
    needs: register
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Harden diagnostic instrumentation only
        shell: pwsh
        run: |
          $path = 'scripts/p016-unit2-windows-orphan-diagnostic.mjs'
          $text = Get-Content -Raw $path
          $oldInventory = '  return Array.isArray(parsed) ? parsed : [parsed];'
          $newInventory = @'
          const values = Array.isArray(parsed) ? parsed : [parsed];
          return values.filter((proc) => !String(proc.CommandLine ?? "").includes("Get-CimInstance Win32_Process"));
          '@.Trim()
          if (-not $text.Contains($oldInventory)) { throw 'diagnostic inventory patch anchor missing' }
          $text = $text.Replace($oldInventory, $newInventory)
          $oldProgress = '$ErrorActionPreference = ''Stop'''
          $newProgress = "$oldProgress`n`$ProgressPreference = 'SilentlyContinue'"
          if (-not $text.Contains($oldProgress)) { throw 'diagnostic progress patch anchor missing' }
          $text = $text.Replace($oldProgress, $newProgress)
          Set-Content -Path $path -Value $text -NoNewline
      - name: Prove Windows Job Object containment and clean stdio
        run: node scripts/p016-unit2-windows-orphan-diagnostic.mjs
      - name: Discriminate ProjectOps Windows blob hashing
        shell: pwsh
        run: |
          $p = 'ProjectOps/system/ABOS_OPERATING_PROTOCOL.md'
          Write-Host "core.autocrlf=$(git config --get core.autocrlf)"
          Write-Host "head_blob=$(git rev-parse HEAD:$p)"
          Write-Host "raw_worktree_blob=$(git hash-object --no-filters $p)"
          Write-Host "filtered_worktree_blob=$(git hash-object --path=$p $p)"
          if ((git rev-parse HEAD:$p) -ne 'ba0d546c704d7078fb1471107c29c7174379d134') { throw 'committed protocol blob drifted' }
          if ((git hash-object --path=$p $p) -ne 'ba0d546c704d7078fb1471107c29c7174379d134') { throw 'clean-filtered worktree does not reconstruct canonical protocol blob' }
