name: P016 ProjectOps Cross Platform V8

on:
  push:
    branches:
      - abos/p016-computer-browser-gui-hands

permissions:
  contents: write

jobs:
  validate-ubuntu:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Require registered v7 decision
        run: grep -Fq '## LOCAL_COMPUTER_COMPLETION — v7 confirmed / Job Object DECISION_READY' ProjectOps/continuity/C0012.md
      - name: Apply cross-platform ProjectOps candidate
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/projectops-integrity-verify.mjs')
          s = p.read_text(encoding='utf-8')
          s = s.replace('import {createHash} from "node:crypto";\n', 'import {execFileSync} from "node:child_process";\n')
          old = 'const gitBlobSha=content=>{const b=Buffer.from(content,"utf8");return createHash("sha1").update(Buffer.from(`blob ${b.length}\\0`)).update(b).digest("hex")};\nconst requireBlob=(path,expected)=>{const actual=gitBlobSha(read(path));if(actual!==expected)fail(`${path} blob drift: expected ${expected}, got ${actual}`)};'
          new = 'const gitBlobSha=path=>execFileSync("git",["hash-object",`--path=${path}`,path],{cwd:root,encoding:"utf8"}).trim();\nconst requireBlob=(path,expected)=>{const actual=gitBlobSha(path);if(actual!==expected)fail(`${path} blob drift: expected ${expected}, got ${actual}`)};'
          if old not in s:
              raise SystemExit('ProjectOps candidate anchor missing')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
          git diff --check
          node scripts/projectops-integrity-verify.mjs
          test "$(git diff --name-only)" = 'scripts/projectops-integrity-verify.mjs'

  validate-windows:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Require registered v7 decision
        shell: pwsh
        run: |
          if (-not (Select-String -Path ProjectOps/continuity/C0012.md -SimpleMatch '## LOCAL_COMPUTER_COMPLETION — v7 confirmed / Job Object DECISION_READY')) { throw 'v7 decision checkpoint missing' }
      - name: Apply cross-platform ProjectOps candidate
        shell: pwsh
        run: |
          $p = 'scripts/projectops-integrity-verify.mjs'
          $s = Get-Content -Raw $p
          $oldImport = 'import {createHash} from "node:crypto";'
          $newImport = 'import {execFileSync} from "node:child_process";'
          if (-not $s.Contains($oldImport)) { throw 'ProjectOps import anchor missing' }
          $s = $s.Replace($oldImport, $newImport)
          $old = 'const gitBlobSha=content=>{const b=Buffer.from(content,"utf8");return createHash("sha1").update(Buffer.from(`blob ${b.length}\0`)).update(b).digest("hex")};' + "`n" + 'const requireBlob=(path,expected)=>{const actual=gitBlobSha(read(path));if(actual!==expected)fail(`${path} blob drift: expected ${expected}, got ${actual}`)};'
          $new = 'const gitBlobSha=path=>execFileSync("git",["hash-object",`--path=${path}`,path],{cwd:root,encoding:"utf8"}).trim();' + "`n" + 'const requireBlob=(path,expected)=>{const actual=gitBlobSha(path);if(actual!==expected)fail(`${path} blob drift: expected ${expected}, got ${actual}`)};'
          if (-not $s.Contains($old)) { throw 'ProjectOps hash anchor missing' }
          Set-Content -Path $p -Value ($s.Replace($old, $new)) -NoNewline
          node scripts/projectops-integrity-verify.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $changed = git diff --name-only
          if ($changed -ne 'scripts/projectops-integrity-verify.mjs') { throw "unexpected candidate scope: $changed" }

  commit:
    if: github.actor != 'github-actions[bot]'
    needs: [validate-ubuntu, validate-windows]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - name: Apply validated ProjectOps correction
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/projectops-integrity-verify.mjs')
          s = p.read_text(encoding='utf-8')
          s = s.replace('import {createHash} from "node:crypto";\n', 'import {execFileSync} from "node:child_process";\n')
          old = 'const gitBlobSha=content=>{const b=Buffer.from(content,"utf8");return createHash("sha1").update(Buffer.from(`blob ${b.length}\\0`)).update(b).digest("hex")};\nconst requireBlob=(path,expected)=>{const actual=gitBlobSha(read(path));if(actual!==expected)fail(`${path} blob drift: expected ${expected}, got ${actual}`)};'
          new = 'const gitBlobSha=path=>execFileSync("git",["hash-object",`--path=${path}`,path],{cwd:root,encoding:"utf8"}).trim();\nconst requireBlob=(path,expected)=>{const actual=gitBlobSha(path);if(actual!==expected)fail(`${path} blob drift: expected ${expected}, got ${actual}`)};'
          if old not in s:
              raise SystemExit('ProjectOps candidate anchor missing')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
          git diff --check
          node scripts/projectops-integrity-verify.mjs
          test "$(git diff --name-only)" = 'scripts/projectops-integrity-verify.mjs'
      - name: Commit validated verifier correction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/projectops-integrity-verify.mjs
          git commit -m "fix(projectops): hash canonical blobs across hosts"
          git push origin HEAD:${GITHUB_REF_NAME}
