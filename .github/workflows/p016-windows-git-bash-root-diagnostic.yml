name: P016 Windows Job Object Diagnostic V7

on:
  push:
    branches:
      - abos/p016-computer-browser-gui-hands

permissions:
  contents: write

jobs:
  register:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Register v6 falsification and v7 diagnostic before execution
        run: python scripts/p016-unit2-register-v5.py
      - name: Verify ProjectOps before checkpoint
        run: |
          git diff --check
          node scripts/projectops-integrity-verify.mjs
      - name: Commit recoverable diagnostic checkpoint
        shell: bash
        run: |
          set -euo pipefail
          git add ProjectOps/continuity/C0012.md
          if git diff --cached --quiet; then
            echo "v7 diagnostic checkpoint already present"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs(projectops): register P016 Windows job diagnostic"
          git push origin HEAD:${GITHUB_REF_NAME}

  diagnose:
    if: github.actor != 'github-actions[bot]'
    needs: register
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Prove Windows Job Object containment and stdio
        run: node scripts/p016-unit2-windows-orphan-diagnostic.mjs
      - name: ProjectOps integrity remains valid
        run: node scripts/projectops-integrity-verify.mjs
