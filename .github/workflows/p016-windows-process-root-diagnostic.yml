name: P016 Windows Process Root Diagnostic

on:
  push:
    branches:
      - abos/p016-computer-browser-gui-hands

permissions:
  contents: read

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile
      - name: Apply current candidate for comparison
        run: python scripts/p016-unit2-final-hardening.py
      - run: pnpm run build
      - name: Diagnose bash root versus stable node wrapper
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          @'
          import { spawn, spawnSync } from "node:child_process";
          import fs from "node:fs";
          import os from "node:os";
          import path from "node:path";
          import { LocalComputerRuntime } from "./dist/platform/local-computer-runtime.js";

          const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
          const runtime = new LocalComputerRuntime(() => "diag");
          const dir = fs.mkdtempSync(path.join(os.homedir(), ".abos-win-root-diag-"));
          const started = await runtime.start(`node -e "setInterval(()=>{},1000)"`, { cwd: dir });
          console.log(`RUNTIME_ROOT_PID=${started.pid}`);
          const tasklist = spawnSync("tasklist.exe", ["/FI", `PID eq ${started.pid}`], { encoding: "utf8" });
          console.log(`RUNTIME_TASKLIST=${JSON.stringify(tasklist.stdout)} ERR=${JSON.stringify(tasklist.stderr)} RC=${tasklist.status}`);
          const cim = spawnSync("powershell.exe", ["-NoProfile", "-Command", `Get-CimInstance Win32_Process | Where-Object { $_.ProcessId -eq ${started.pid} -or $_.ParentProcessId -eq ${started.pid} } | Select-Object ProcessId,ParentProcessId,Name,CommandLine | Format-List`], { encoding: "utf8" });
          console.log(`RUNTIME_CIM=${JSON.stringify(cim.stdout)} ERR=${JSON.stringify(cim.stderr)} RC=${cim.status}`);
          const kill = spawnSync("taskkill.exe", ["/PID", String(started.pid), "/T", "/F"], { encoding: "utf8" });
          console.log(`RUNTIME_TASKKILL_RC=${kill.status} OUT=${JSON.stringify(kill.stdout)} ERR=${JSON.stringify(kill.stderr)}`);
          await sleep(300);

          const wrapperPath = path.join(dir, "wrapper.mjs");
          fs.writeFileSync(wrapperPath, `import { spawn } from "node:child_process";\nconst bash = process.env.ABOS_DIAG_BASH;\nconst child = spawn(bash, ["-lc", "node -e \\\"setInterval(()=>{},1000)\\\""], {stdio:["ignore","inherit","inherit"], windowsHide:true});\nchild.on("exit", (code, signal) => process.exit(code ?? (signal ? 1 : 0)));\nsetInterval(()=>{},1000);\n`);
          const bash = "C:/Program Files/Git/bin/bash.exe";
          const wrapper = spawn(process.execPath, [wrapperPath], { env: {...process.env, ABOS_DIAG_BASH: bash}, detached: true, windowsHide: true, stdio: ["ignore","pipe","pipe"] });
          await new Promise((resolve, reject) => { wrapper.once("spawn", resolve); wrapper.once("error", reject); });
          await sleep(500);
          console.log(`NODE_WRAPPER_PID=${wrapper.pid}`);
          const wrapperCim = spawnSync("powershell.exe", ["-NoProfile", "-Command", `Get-CimInstance Win32_Process | Where-Object { $_.ProcessId -eq ${wrapper.pid} -or $_.ParentProcessId -eq ${wrapper.pid} } | Select-Object ProcessId,ParentProcessId,Name,CommandLine | Format-List`], { encoding: "utf8" });
          console.log(`WRAPPER_CIM=${JSON.stringify(wrapperCim.stdout)} ERR=${JSON.stringify(wrapperCim.stderr)} RC=${wrapperCim.status}`);
          const wrapperKill = spawnSync("taskkill.exe", ["/PID", String(wrapper.pid), "/T", "/F"], { encoding: "utf8" });
          console.log(`WRAPPER_TASKKILL_RC=${wrapperKill.status} OUT=${JSON.stringify(wrapperKill.stdout)} ERR=${JSON.stringify(wrapperKill.stderr)}`);
          await sleep(500);
          const after = spawnSync("tasklist.exe", ["/FI", `PID eq ${wrapper.pid}`], { encoding: "utf8" });
          console.log(`WRAPPER_AFTER=${JSON.stringify(after.stdout)}`);
          if (wrapperKill.status !== 0) process.exit(44);
          '@ | node --input-type=module
