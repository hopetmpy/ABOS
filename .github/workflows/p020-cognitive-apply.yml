name: P020 Cognitive Fabric Validation

on:
  push:
    branches:
      - abos/p020-cognitive-fabric
    paths:
      - .github/workflows/p020-cognitive-apply.yml

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: abos/p020-cognitive-fabric
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate persistence, activation, context and build
        shell: bash
        run: |
          corepack enable
          pnpm install --frozen-lockfile
          pnpm exec vitest run \
            src/__tests__/memory/knowledge-store.test.ts \
            src/__tests__/memory/enhanced-retriever.test.ts \
            src/__tests__/memory/context-manager.test.ts \
            src/__tests__/memory/cognitive-fabric.integration.test.ts
          pnpm run typecheck
          pnpm run build
