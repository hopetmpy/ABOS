name: P020 Repair Apply Matcher

on:
  push:
    branches:
      - abos/p020-cognitive-fabric
    paths:
      - .github/workflows/p020-fix-apply.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: abos/p020-cognitive-fabric
          fetch-depth: 0
      - name: Repair constructor matcher
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('.github/workflows/p020-cognitive-apply.yml')
          text = p.read_text()
          old = """          replace_one(path, '''    this.db = db;\n            this.taskStore = taskStore;\n            this.knowledgeStore = new KnowledgeStore(db);\n            feedbackDb = db;\n          }''', '''    this.db = db;\n            this.taskStore = taskStore;\n            this.knowledgeStore = new KnowledgeStore(db);\n          }''')"""
          new = """          replace_one(path, '''    this.db = db;\n    this.taskStore = taskStore;\n    this.knowledgeStore = new KnowledgeStore(db);\n    feedbackDb = db;\n  }''', '''    this.db = db;\n    this.taskStore = taskStore;\n    this.knowledgeStore = new KnowledgeStore(db);\n  }''')"""
          if text.count(old) != 1:
              raise SystemExit(f'expected one workflow matcher to repair, found {text.count(old)}')
          p.write_text(text.replace(old, new, 1))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/p020-cognitive-apply.yml
          git commit -m "chore: repair P-020 apply matcher"
          git push origin HEAD:abos/p020-cognitive-fabric
