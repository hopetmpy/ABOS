name: P021 Skill Evolution Hardening

on:
  push:
    branches:
      - abos/p021-skill-evolution
    paths:
      - .github/workflows/p021-skill-evolution-apply-v2.yml

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: abos/p021-skill-evolution
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Enable Corepack
        run: corepack enable

      - name: Apply audited hardening
        shell: bash
        run: |
          set +e
          python3 - <<'PY' > /tmp/p021-hardening-prepatch.log 2>&1
          from pathlib import Path
          p = Path('.github/p021-skill-evolution-hardening.py')
          text = p.read_text()
          start = text.index('# 9. Registry validates untrusted names before consulting lifecycle storage.')
          end = text.index('# 10. Runtime startup imports any legacy DB projections before Capability Fabric ingestion.')
          replacement = r'''# 9. Registry validates untrusted names before consulting lifecycle storage.
          registry = Path("src/skills/registry.ts")
          text = registry.read_text()
          for function_name in ["installSkillFromGit", "installSkillFromUrl", "createSkill", "removeSkill"]:
              function_start = text.index(f"export async function {function_name}(")
              function_end = text.find("\n/**", function_start)
              if function_end < 0:
                  function_end = len(text)
              segment = text[function_start:function_end]
              lifecycle = re.search(r'''  if \(isSkillEvolutionManaged\(db\.raw, name\)\) \{\n.*?\n  \}\n''', segment, flags=re.S)
              validation = re.search(r'''  if \(!SKILL_NAME_RE\.test\(name\)\) \{\n.*?\n  \}\n''', segment, flags=re.S)
              if not lifecycle or not validation:
                  raise SystemExit(f"src/skills/registry.ts: missing lifecycle/name validation in {function_name}")
              lifecycle_block = lifecycle.group(0)
              segment = segment[:lifecycle.start()] + segment[lifecycle.end():]
              validation = re.search(r'''  if \(!SKILL_NAME_RE\.test\(name\)\) \{\n.*?\n  \}\n''', segment, flags=re.S)
              assert validation is not None
              segment = segment[:validation.end()] + lifecycle_block + segment[validation.end():]
              text = text[:function_start] + segment + text[function_end:]
          registry.write_text(text)

          '''
          p.write_text(text[:start] + replacement + text[end:])
          PY
          status=$?
          if [ "$status" -eq 0 ]; then
            python3 .github/p021-skill-evolution-hardening.py > /tmp/p021-hardening-apply.log 2>&1
            status=$?
          else
            cp /tmp/p021-hardening-prepatch.log /tmp/p021-hardening-apply.log
          fi
          if [ "$status" -eq 0 ]; then
            git diff --check >> /tmp/p021-hardening-apply.log 2>&1
            status=$?
          fi
          cat /tmp/p021-hardening-apply.log
          exit "$status"

      - name: Upload hardening transform evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p021-hardening-transform-evidence
          path: /tmp/p021-hardening-apply.log
          if-no-files-found: error

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Focused adversarial validation
        shell: bash
        run: |
          set +e
          pnpm exec vitest run src/__tests__/skills-evolution.test.ts src/__tests__/skill-runtime-truth.test.ts src/__tests__/skills-hardening.test.ts > /tmp/p021-hardening-tests.log 2>&1
          status=$?
          cat /tmp/p021-hardening-tests.log
          exit "$status"

      - name: Upload focused evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p021-hardening-test-evidence
          path: /tmp/p021-hardening-tests.log
          if-no-files-found: warn

      - name: Typecheck
        run: pnpm run typecheck

      - name: Build
        run: pnpm run build

      - name: Commit hardened product source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src
          if git diff --cached --quiet; then
            echo 'No product source changes to commit.'
            exit 1
          fi
          git commit -m 'fix: harden P-021 skill lifecycle semantics'
          git push origin HEAD:abos/p021-skill-evolution
