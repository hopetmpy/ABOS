name: P021 Skill Evolution Follow-up Hardening

on:
  push:
    branches:
      - abos/p021-skill-evolution
    paths:
      - .github/workflows/p021-skill-evolution-apply-v2.yml

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: abos/p021-skill-evolution
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Enable Corepack
        run: corepack enable

      - name: Apply follow-up hardening
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one match, found {count}: {old[:120]!r}")
              p.write_text(text.replace(old, new, 1))

          replace_once(
              'src/skills/evolution.ts',
              '''  observeFilesystemSkill(skill: Skill): SkillVersionRecord | undefined {\n    const runtime = this.getRuntimeVersion(skill.name);\n    if (!runtime) return undefined;\n''',
              '''  observeFilesystemSkill(skill: Skill): SkillVersionRecord | undefined {\n    const runtime = this.getRuntimeVersion(skill.name)\n      ?? this.listVersions(skill.name).find((version) => version.provenance.legacyBaseline === true);\n    if (!runtime) return undefined;\n''',
          )

          swaps = [
              (
                  '''  if (isSkillEvolutionManaged(db.raw, name)) {\n    throw new Error(`Skill ${name} is managed by Skill Evolution; create a new version instead of overwriting it.`);\n  }\n  // Validate inputs to prevent injection\n  if (!SKILL_NAME_RE.test(name)) {\n    throw new Error(`Invalid skill name: "${name}". Must match ${SKILL_NAME_RE.source}`);\n  }\n''',
                  '''  // Validate inputs before consulting lifecycle storage.\n  if (!SKILL_NAME_RE.test(name)) {\n    throw new Error(`Invalid skill name: "${name}". Must match ${SKILL_NAME_RE.source}`);\n  }\n  if (isSkillEvolutionManaged(db.raw, name)) {\n    throw new Error(`Skill ${name} is managed by Skill Evolution; create a new version instead of overwriting it.`);\n  }\n''',
                  2,
              ),
              (
                  '''  if (isSkillEvolutionManaged(db.raw, name)) {\n    throw new Error(`Skill ${name} is managed by Skill Evolution; create a new version instead of overwriting it.`);\n  }\n  // Validate name to prevent path traversal/injection\n  if (!SKILL_NAME_RE.test(name)) {\n    throw new Error(`Invalid skill name: "${name}". Must match ${SKILL_NAME_RE.source}`);\n  }\n''',
                  '''  // Validate name before consulting lifecycle storage.\n  if (!SKILL_NAME_RE.test(name)) {\n    throw new Error(`Invalid skill name: "${name}". Must match ${SKILL_NAME_RE.source}`);\n  }\n  if (isSkillEvolutionManaged(db.raw, name)) {\n    throw new Error(`Skill ${name} is managed by Skill Evolution; create a new version instead of overwriting it.`);\n  }\n''',
                  1,
              ),
              (
                  '''  if (isSkillEvolutionManaged(db.raw, name)) {\n    throw new Error(`Skill ${name} is managed by Skill Evolution; deprecate it through lifecycle instead of bypassing history.`);\n  }\n  // Validate name to prevent path traversal/injection\n  if (!SKILL_NAME_RE.test(name)) {\n    throw new Error(`Invalid skill name: "${name}". Must match ${SKILL_NAME_RE.source}`);\n  }\n''',
                  '''  // Validate name before consulting lifecycle storage.\n  if (!SKILL_NAME_RE.test(name)) {\n    throw new Error(`Invalid skill name: "${name}". Must match ${SKILL_NAME_RE.source}`);\n  }\n  if (isSkillEvolutionManaged(db.raw, name)) {\n    throw new Error(`Skill ${name} is managed by Skill Evolution; deprecate it through lifecycle instead of bypassing history.`);\n  }\n''',
                  1,
              ),
          ]
          p = Path('src/skills/registry.ts')
          text = p.read_text()
          for old, new, expected in swaps:
              count = text.count(old)
              if count != expected:
                  raise SystemExit(f'src/skills/registry.ts: expected {expected} registry ordering matches, found {count}')
              text = text.replace(old, new)
          p.write_text(text)

          test_path = Path('src/__tests__/skills-evolution.test.ts')
          test_text = test_path.read_text()
          marker = '''\n  it("rejects secret-like material before persistence", () => {'''
          disabled_test = r'''
  it("turns a changed file for a disabled legacy baseline into one candidate without enabling it", () => {
    const { dir, db, engine } = runtime();
    const skillsDir = join(dir, "skills"); const skillDir = join(skillsDir, "disabled-helper"); mkdirSync(skillDir, { recursive: true });
    const skillMdPath = join(skillDir, "SKILL.md");
    db.upsertSkill({ name: "disabled-helper", description: "legacy disabled", autoActivate: true, requires: {}, instructions: "Old disabled instructions.", source: "self", path: skillMdPath, enabled: false, installedAt: new Date().toISOString() });
    writeFileSync(skillMdPath, "---\nname: disabled-helper\ndescription: changed disabled\nauto-activate: true\n---\n\nNew disabled instructions that must become a candidate.");
    loadSkills(skillsDir, db); loadSkills(skillsDir, db);
    const versions = engine.listVersions("disabled-helper");
    expect(versions).toHaveLength(2); expect(versions[0].lifecycleState).toBe("candidate"); expect(versions[0].definition.instructions).toContain("New disabled instructions");
    expect(versions[1].lifecycleState).toBe("disabled"); expect(db.getSkillByName("disabled-helper")?.enabled).toBe(false); expect(db.getSkillByName("disabled-helper")?.instructions).toContain("Old disabled instructions"); db.close();
  });
'''
          if test_text.count(marker) != 1:
              raise SystemExit('skills-evolution.test.ts: insertion marker missing')
          test_path.write_text(test_text.replace(marker, disabled_test + marker, 1))

          hardening_path = Path('src/__tests__/skills-hardening.test.ts')
          hardening = hardening_path.read_text()
          marker2 = '''\n  it("YAML injection via description is prevented", async () => {'''
          ordering_test = r'''
  it("validates skill names before consulting evolution lifecycle storage", async () => {
    const fs = await import("fs");
    const source = fs.readFileSync(fileURLToPath(new URL("../skills/registry.ts", import.meta.url)), "utf-8");
    for (const functionName of ["installSkillFromGit", "installSkillFromUrl", "createSkill", "removeSkill"]) {
      const start = source.indexOf(`export async function ${functionName}(`); const end = source.indexOf("\n/**", start + 1); const segment = source.slice(start, end < 0 ? source.length : end);
      expect(segment.indexOf("SKILL_NAME_RE")).toBeGreaterThanOrEqual(0); expect(segment.indexOf("isSkillEvolutionManaged")).toBeGreaterThanOrEqual(0); expect(segment.indexOf("SKILL_NAME_RE")).toBeLessThan(segment.indexOf("isSkillEvolutionManaged"));
    }
  });
'''
          if hardening.count(marker2) != 1:
              raise SystemExit('skills-hardening.test.ts: ordering insertion marker missing')
          hardening_path.write_text(hardening.replace(marker2, ordering_test + marker2, 1))
          PY
          git diff --check

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Focused adversarial validation
        shell: bash
        run: |
          set +e
          pnpm exec vitest run src/__tests__/skills-evolution.test.ts src/__tests__/skill-runtime-truth.test.ts src/__tests__/skills-hardening.test.ts > /tmp/p021-followup-tests.log 2>&1
          status=$?
          cat /tmp/p021-followup-tests.log
          exit "$status"

      - name: Upload focused evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p021-followup-test-evidence
          path: /tmp/p021-followup-tests.log
          if-no-files-found: warn

      - name: Typecheck
        run: pnpm run typecheck

      - name: Build
        run: pnpm run build

      - name: Commit follow-up hardening
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src
          if git diff --cached --quiet; then
            echo 'No product source changes to commit.'
            exit 1
          fi
          git commit -m 'fix: close P-021 lifecycle edge cases'
          git push origin HEAD:abos/p021-skill-evolution
