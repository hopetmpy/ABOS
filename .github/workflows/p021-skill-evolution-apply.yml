name: P021 Skill Evolution Apply

on:
  push:
    branches:
      - abos/p021-skill-evolution
    paths:
      - .github/workflows/p021-skill-evolution-apply.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: abos/p021-skill-evolution
          fetch-depth: 0

      - name: Apply P-021 product source
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          def replace_one(path: str, old: str, new: str):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one literal match, found {count}: {old[:160]!r}")
              p.write_text(text.replace(old, new, 1))

          def regex_one(path: str, pattern: str, replacement: str):
              p = Path(path)
              text = p.read_text()
              new_text, count = re.subn(pattern, replacement, text, count=1, flags=re.S)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one regex match, found {count}: {pattern[:160]!r}")
              p.write_text(new_text)

          # ── Schema v20: durable skill evolution authority ──────────────────
          replace_one(
              "src/state/schema.ts",
              "export const SCHEMA_VERSION = 19;",
              "export const SCHEMA_VERSION = 20;",
          )
          schema = Path("src/state/schema.ts")
          schema_text = schema.read_text()
          marker = "export const MIGRATION_V19_CAPABILITY_LIFECYCLE = `"
          if marker not in schema_text:
              raise SystemExit("schema.ts: V19 migration marker missing")
          if "MIGRATION_V20_SKILL_EVOLUTION" not in schema_text:
              schema_text += r'''

// === Skill Evolution lifecycle v1 (P-021) ===
// `skills` remains the compatibility/runtime projection. These tables own
// immutable-per-version history and evidence-backed lifecycle observations.
export const MIGRATION_V20_SKILL_EVOLUTION = `
  CREATE TABLE IF NOT EXISTS skill_versions (
    id TEXT PRIMARY KEY,
    skill_name TEXT NOT NULL,
    version INTEGER NOT NULL,
    parent_version_id TEXT REFERENCES skill_versions(id),
    lifecycle_state TEXT NOT NULL,
    definition_json TEXT NOT NULL,
    content_hash TEXT NOT NULL,
    verification_json TEXT NOT NULL DEFAULT '{}',
    applicability_json TEXT NOT NULL DEFAULT '{}',
    provenance_json TEXT NOT NULL DEFAULT '{}',
    evidence_json TEXT NOT NULL DEFAULT '[]',
    created_at TEXT NOT NULL,
    updated_at TEXT NOT NULL,
    activated_at TEXT,
    deprecated_at TEXT,
    UNIQUE(skill_name, version)
  );

  CREATE INDEX IF NOT EXISTS idx_skill_versions_name_version
    ON skill_versions(skill_name, version DESC);
  CREATE INDEX IF NOT EXISTS idx_skill_versions_lifecycle
    ON skill_versions(lifecycle_state, updated_at);
  CREATE UNIQUE INDEX IF NOT EXISTS idx_skill_versions_one_active
    ON skill_versions(skill_name) WHERE lifecycle_state = 'active';

  CREATE TABLE IF NOT EXISTS skill_evaluations (
    id TEXT PRIMARY KEY,
    skill_version_id TEXT NOT NULL REFERENCES skill_versions(id),
    evaluation_kind TEXT NOT NULL,
    outcome TEXT NOT NULL,
    evidence_event_id TEXT NOT NULL REFERENCES evidence_events(id),
    task_id TEXT,
    environment_id TEXT,
    details_json TEXT NOT NULL DEFAULT '{}',
    created_at TEXT NOT NULL,
    UNIQUE(skill_version_id, evaluation_kind, evidence_event_id)
  );

  CREATE INDEX IF NOT EXISTS idx_skill_evaluations_version
    ON skill_evaluations(skill_version_id, created_at);
  CREATE INDEX IF NOT EXISTS idx_skill_evaluations_evidence
    ON skill_evaluations(evidence_event_id);
`;
'''
              schema.write_text(schema_text)

          # ── Database migration runner ──────────────────────────────────────
          replace_one(
              "src/state/database.ts",
              "  MIGRATION_V19_CAPABILITY_LIFECYCLE,\n} from \"./schema.js\";",
              "  MIGRATION_V19_CAPABILITY_LIFECYCLE,\n  MIGRATION_V20_SKILL_EVOLUTION,\n} from \"./schema.js\";",
          )
          replace_one(
              "src/state/database.ts",
              '''    {
      version: 19,
      apply: () => db.exec(MIGRATION_V19_CAPABILITY_LIFECYCLE),
    },
  ];''',
              '''    {
      version: 19,
      apply: () => db.exec(MIGRATION_V19_CAPABILITY_LIFECYCLE),
    },
    {
      version: 20,
      apply: () => db.exec(MIGRATION_V20_SKILL_EVOLUTION),
    },
  ];''',
          )

          # ── Tool context gets the existing CapabilityRegistry authority ────
          replace_one(
              "src/types.ts",
              '''  /** Runtime-scoped policy accounting authority for economic effects. */
  spendTracker?: SpendTrackerInterface;
}''',
              '''  /** Runtime-scoped policy accounting authority for economic effects. */
  spendTracker?: SpendTrackerInterface;
  /** Canonical runtime capability authority; optional for legacy/tests. */
  capabilityRegistry?: import("./capabilities/registry.js").CapabilityRegistry;
}''',
          )

          # ── CapabilityRegistry: versioned skill contract projection ────────
          path = "src/capabilities/registry.ts"
          replace_one(
              path,
              '''export interface CapabilityProbeObservation {
  state: CapabilityState;
  authority: string;
  evidence: string[];
  observedAt?: string;
  metadata?: Record<string, unknown>;
}
''',
              '''export interface CapabilityProbeObservation {
  state: CapabilityState;
  authority: string;
  evidence: string[];
  observedAt?: string;
  metadata?: Record<string, unknown>;
}

export interface SkillCapabilityProjection {
  version?: string | null;
  dependencies?: string[];
  provides?: string[];
  permissions?: string[];
  effects?: string[];
  compatibility?: string[];
  environment?: string | null;
  inputs?: string[];
  outputs?: string[];
  metadata?: Record<string, unknown>;
}
''',
          )
          regex_one(
              path,
              r'''  ingestSkills\(skills: Array<\{ name: string; description\?: string; enabled\?: boolean \}>\): void \{.*?\n  \}\n\}''',
              '''  registerSkillInventory(
    skill: { name: string; description?: string; enabled?: boolean },
    projection?: SkillCapabilityProjection,
  ): CapabilityDescriptor {
    const observedAt = new Date().toISOString();
    const descriptor: CapabilityDescriptor = {
      id: `skill:${skill.name}`,
      type: "skill",
      provider: "abos",
      description: skill.description ?? skill.name,
      requirements: [],
      provides:
        projection?.provides && projection.provides.length > 0
          ? [...projection.provides]
          : [skill.name],
      permissions: [...(projection?.permissions ?? [])],
      effects: projection?.effects ? [...projection.effects] : undefined,
      dependencies: projection?.dependencies
        ? [...projection.dependencies]
        : undefined,
      version: projection?.version ?? null,
      compatibility: projection?.compatibility
        ? [...projection.compatibility]
        : undefined,
      environment: projection?.environment ?? null,
      inputs: projection?.inputs ? [...projection.inputs] : undefined,
      outputs: projection?.outputs ? [...projection.outputs] : undefined,
      available: false,
      state: skill.enabled === false ? "unavailable" : "discovered_unverified",
      observedAt,
      authority: "runtime:skill-inventory",
      evidence: [
        skill.enabled === false
          ? "Skill is disabled in the current inventory."
          : "Skill is enabled in inventory, but inventory state alone is not execution-readiness evidence.",
      ],
      metadata: projection?.metadata ? { ...projection.metadata } : undefined,
    };
    if (skill.enabled === false) {
      this.register(descriptor);
    } else {
      this.registerInventory(descriptor);
    }
    return this.entries.get(descriptor.id)!;
  }

  ingestSkills(
    skills: Array<{ name: string; description?: string; enabled?: boolean }>,
    projectionFor?: (name: string) => SkillCapabilityProjection | undefined,
  ): void {
    for (const skill of skills) {
      this.registerSkillInventory(skill, projectionFor?.(skill.name));
    }
  }
}''',
          )

          # ── New evolution authority ────────────────────────────────────────
          Path("src/skills/evolution.ts").write_text(r'''import { createHash } from "node:crypto";
import type BetterSqlite3 from "better-sqlite3";
import { ulid } from "ulid";
import type {
  Skill,
  SkillRequirements,
  SkillSource,
} from "../types.js";
import type {
  CapabilityRegistry,
  SkillCapabilityProjection,
} from "../capabilities/registry.js";
import {
  appendEvidenceEvent,
  correlationIdFor,
  getEvidenceEvent,
} from "../observability/evidence.js";

export type SkillLifecycleState =
  | "candidate"
  | "validated"
  | "active"
  | "superseded"
  | "degraded"
  | "deprecated";

export interface SkillCapabilityContract {
  requiredCapabilities: string[];
  provides: string[];
  permissions: string[];
  effects: string[];
  compatibility: string[];
  environment: string | null;
  inputs: string[];
  outputs: string[];
}

export interface SkillVerificationPolicy {
  method: string;
  critical: boolean;
  minimumIndependentSuccesses: number;
}

export interface SkillVersionDefinition {
  name: string;
  description: string;
  autoActivate: boolean;
  requires?: SkillRequirements;
  instructions: string;
  source: SkillSource;
  path: string;
  capability: SkillCapabilityContract;
}

export interface SkillVersionRecord {
  id: string;
  skillName: string;
  version: number;
  parentVersionId: string | null;
  lifecycleState: SkillLifecycleState | string;
  definition: SkillVersionDefinition;
  contentHash: string;
  verification: SkillVerificationPolicy;
  applicability: Record<string, unknown>;
  provenance: Record<string, unknown>;
  evidenceEventIds: string[];
  createdAt: string;
  updatedAt: string;
  activatedAt: string | null;
  deprecatedAt: string | null;
}

export interface SkillEvaluationRecord {
  id: string;
  skillVersionId: string;
  evaluationKind: string;
  outcome: string;
  evidenceEventId: string;
  taskId: string | null;
  environmentId: string | null;
  details: Record<string, unknown>;
  createdAt: string;
}

export interface PromotionAssessment {
  eligible: boolean;
  requiredIndependentSuccesses: number;
  successfulEvidenceIds: string[];
  reasons: string[];
}

type Database = BetterSqlite3.Database;

const SECRET_PATTERNS = [
  /-----BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY-----[\s\S]*?-----END (?:RSA |EC |OPENSSH )?PRIVATE KEY-----/i,
  /\bsk-[A-Za-z0-9_-]{16,}\b/,
  /\bBearer\s+[A-Za-z0-9._~+/=-]{16,}/i,
  /\b(?:password|secret|api[_-]?key|access[_-]?token|refresh[_-]?token)\s*[:=]\s*["'][^"']{6,}["']/i,
];

function unique(values: readonly string[] | undefined): string[] {
  return [...new Set((values ?? []).map((value) => value.trim()).filter(Boolean))];
}

function record(value: unknown): Record<string, unknown> {
  return value && typeof value === "object" && !Array.isArray(value)
    ? value as Record<string, unknown>
    : {};
}

function parseJson<T>(raw: string, label: string): T {
  try {
    return JSON.parse(raw) as T;
  } catch (error) {
    throw new Error(
      `Invalid persisted ${label}: ${error instanceof Error ? error.message : String(error)}`,
    );
  }
}

function normalizeDefinition(input: SkillVersionDefinition): SkillVersionDefinition {
  const name = input.name.trim();
  if (!/^[a-zA-Z0-9-]+$/.test(name)) {
    throw new Error(`Invalid skill name for evolution: ${input.name}`);
  }
  const methodFields = input.capability ?? ({} as SkillCapabilityContract);
  return {
    name,
    description: input.description.trim().slice(0, 500),
    autoActivate: Boolean(input.autoActivate),
    requires: input.requires
      ? {
          bins: unique(input.requires.bins),
          env: unique(input.requires.env),
        }
      : undefined,
    instructions: input.instructions.slice(0, 10_000),
    source: input.source,
    path: input.path,
    capability: {
      requiredCapabilities: unique(methodFields.requiredCapabilities),
      provides: unique(methodFields.provides),
      permissions: unique(methodFields.permissions),
      effects: unique(methodFields.effects),
      compatibility: unique(methodFields.compatibility),
      environment: methodFields.environment?.trim() || null,
      inputs: unique(methodFields.inputs),
      outputs: unique(methodFields.outputs),
    },
  };
}

function normalizeVerification(policy: SkillVerificationPolicy): SkillVerificationPolicy {
  const method = policy.method.trim();
  if (!method) throw new Error("Skill verification method is required.");
  const requested = Number.isFinite(policy.minimumIndependentSuccesses)
    ? Math.floor(policy.minimumIndependentSuccesses)
    : 1;
  return {
    method,
    critical: Boolean(policy.critical),
    minimumIndependentSuccesses: Math.max(1, requested),
  };
}

function rejectSecretMaterial(value: unknown): void {
  const serialized = JSON.stringify(value);
  for (const pattern of SECRET_PATTERNS) {
    if (pattern.test(serialized)) {
      throw new Error("Skill evolution candidate contains secret-like material and was rejected.");
    }
  }
}

function contentHash(
  definition: SkillVersionDefinition,
  verification: SkillVerificationPolicy,
  applicability: Record<string, unknown>,
): string {
  return createHash("sha256")
    .update(JSON.stringify({ definition, verification, applicability }))
    .digest("hex");
}

function deserializeVersion(row: any): SkillVersionRecord {
  return {
    id: row.id,
    skillName: row.skill_name,
    version: row.version,
    parentVersionId: row.parent_version_id ?? null,
    lifecycleState: row.lifecycle_state,
    definition: parseJson(row.definition_json, `skill version definition ${row.id}`),
    contentHash: row.content_hash,
    verification: parseJson(row.verification_json, `skill verification ${row.id}`),
    applicability: parseJson(row.applicability_json, `skill applicability ${row.id}`),
    provenance: parseJson(row.provenance_json, `skill provenance ${row.id}`),
    evidenceEventIds: parseJson(row.evidence_json || "[]", `skill evidence ${row.id}`),
    createdAt: row.created_at,
    updatedAt: row.updated_at,
    activatedAt: row.activated_at ?? null,
    deprecatedAt: row.deprecated_at ?? null,
  };
}

function deserializeEvaluation(row: any): SkillEvaluationRecord {
  return {
    id: row.id,
    skillVersionId: row.skill_version_id,
    evaluationKind: row.evaluation_kind,
    outcome: row.outcome,
    evidenceEventId: row.evidence_event_id,
    taskId: row.task_id ?? null,
    environmentId: row.environment_id ?? null,
    details: parseJson(row.details_json || "{}", `skill evaluation details ${row.id}`),
    createdAt: row.created_at,
  };
}

export function isSkillEvolutionManaged(db: Database, skillName: string): boolean {
  const row = db.prepare(
    "SELECT 1 FROM skill_versions WHERE skill_name = ? LIMIT 1",
  ).get(skillName);
  return Boolean(row);
}

export class SkillEvolutionEngine {
  constructor(private readonly db: Database) {}

  isManaged(skillName: string): boolean {
    return isSkillEvolutionManaged(this.db, skillName);
  }

  getVersion(id: string): SkillVersionRecord | undefined {
    const row = this.db.prepare("SELECT * FROM skill_versions WHERE id = ?").get(id) as any | undefined;
    return row ? deserializeVersion(row) : undefined;
  }

  listVersions(skillName: string): SkillVersionRecord[] {
    const rows = this.db.prepare(
      "SELECT * FROM skill_versions WHERE skill_name = ? ORDER BY version DESC",
    ).all(skillName) as any[];
    return rows.map(deserializeVersion);
  }

  getActiveVersion(skillName: string): SkillVersionRecord | undefined {
    const row = this.db.prepare(
      "SELECT * FROM skill_versions WHERE skill_name = ? AND lifecycle_state = 'active' LIMIT 1",
    ).get(skillName) as any | undefined;
    return row ? deserializeVersion(row) : undefined;
  }

  getRuntimeVersion(skillName: string): SkillVersionRecord | undefined {
    const active = this.getActiveVersion(skillName);
    if (active) return active;
    const row = this.db.prepare(
      `SELECT * FROM skill_versions
       WHERE skill_name = ? AND activated_at IS NOT NULL
       ORDER BY datetime(updated_at) DESC, version DESC LIMIT 1`,
    ).get(skillName) as any | undefined;
    return row ? deserializeVersion(row) : undefined;
  }

  listEvaluations(versionId: string): SkillEvaluationRecord[] {
    const rows = this.db.prepare(
      "SELECT * FROM skill_evaluations WHERE skill_version_id = ? ORDER BY created_at ASC, id ASC",
    ).all(versionId) as any[];
    return rows.map(deserializeEvaluation);
  }

  createCandidate(input: {
    definition: SkillVersionDefinition;
    verification: SkillVerificationPolicy;
    applicability?: Record<string, unknown>;
    provenance?: Record<string, unknown>;
    evidenceEventIds: string[];
    parentVersionId?: string | null;
  }): SkillVersionRecord {
    const definition = normalizeDefinition(input.definition);
    const verification = normalizeVerification(input.verification);
    const applicability = record(input.applicability);
    const provenance = record(input.provenance);
    const evidenceEventIds = unique(input.evidenceEventIds);
    if (evidenceEventIds.length === 0) {
      throw new Error("Skill evolution candidate requires at least one existing evidence event.");
    }
    for (const evidenceId of evidenceEventIds) {
      if (!getEvidenceEvent(this.db, evidenceId)) {
        throw new Error(`Unknown evidence event for skill candidate: ${evidenceId}`);
      }
    }
    rejectSecretMaterial({ definition, provenance });

    let parent: SkillVersionRecord | undefined;
    if (input.parentVersionId) {
      parent = this.getVersion(input.parentVersionId);
      if (!parent) throw new Error(`Unknown parent skill version: ${input.parentVersionId}`);
      if (parent.skillName !== definition.name) {
        throw new Error("Parent skill version belongs to a different skill.");
      }
    }

    const latest = this.db.prepare(
      "SELECT COALESCE(MAX(version), 0) AS version FROM skill_versions WHERE skill_name = ?",
    ).get(definition.name) as { version: number };
    const version = latest.version + 1;
    const id = ulid();
    const now = new Date().toISOString();
    const hash = contentHash(definition, verification, applicability);

    this.db.transaction(() => {
      this.db.prepare(
        `INSERT INTO skill_versions (
          id, skill_name, version, parent_version_id, lifecycle_state,
          definition_json, content_hash, verification_json, applicability_json,
          provenance_json, evidence_json, created_at, updated_at
        ) VALUES (?, ?, ?, ?, 'candidate', ?, ?, ?, ?, ?, ?, ?, ?)`,
      ).run(
        id,
        definition.name,
        version,
        parent?.id ?? null,
        JSON.stringify(definition),
        hash,
        JSON.stringify(verification),
        JSON.stringify(applicability),
        JSON.stringify(provenance),
        JSON.stringify(evidenceEventIds),
        now,
        now,
      );
      appendEvidenceEvent(this.db, {
        correlationId: correlationIdFor("skill", definition.name),
        causationId: evidenceEventIds[0],
        eventType: "skill.candidate_created",
        domain: "skill",
        authorityType: "skill_version",
        authorityId: id,
        epistemicStatus: "observation",
        payload: {
          skillName: definition.name,
          version,
          parentVersionId: parent?.id ?? null,
          contentHash: hash,
          verification,
        },
        provenance: {
          source: "SkillEvolutionEngine",
          evidenceEventIds,
        },
      });
    })();

    return this.getVersion(id)!;
  }

  recordEvaluation(input: {
    versionId: string;
    evaluationKind: string;
    outcome: string;
    evidenceEventId: string;
    taskId?: string | null;
    environmentId?: string | null;
    details?: Record<string, unknown>;
  }): SkillEvaluationRecord {
    const version = this.requireVersion(input.versionId);
    const evaluationKind = input.evaluationKind.trim();
    const outcome = input.outcome.trim().toLowerCase();
    if (!evaluationKind) throw new Error("evaluationKind is required.");
    if (!outcome) throw new Error("evaluation outcome is required.");
    const predecessor = getEvidenceEvent(this.db, input.evidenceEventId);
    if (!predecessor) {
      throw new Error(`Evaluation evidence does not exist: ${input.evidenceEventId}`);
    }
    const id = ulid();
    const now = new Date().toISOString();
    const details = record(input.details);
    rejectSecretMaterial(details);

    this.db.transaction(() => {
      this.db.prepare(
        `INSERT INTO skill_evaluations (
          id, skill_version_id, evaluation_kind, outcome, evidence_event_id,
          task_id, environment_id, details_json, created_at
        ) VALUES (?, ?, ?, ?, ?, ?, ?, ?, ?)`,
      ).run(
        id,
        version.id,
        evaluationKind,
        outcome,
        input.evidenceEventId,
        input.taskId ?? null,
        input.environmentId ?? null,
        JSON.stringify(details),
        now,
      );
      appendEvidenceEvent(this.db, {
        correlationId: correlationIdFor("skill", version.skillName),
        causationId: input.evidenceEventId,
        eventType: "skill.evaluation_recorded",
        domain: "skill",
        authorityType: "skill_version",
        authorityId: version.id,
        taskId: input.taskId ?? null,
        epistemicStatus: "observation",
        payload: {
          evaluationId: id,
          evaluationKind,
          outcome,
          environmentId: input.environmentId ?? null,
        },
        provenance: { source: "SkillEvolutionEngine" },
      });
    })();

    return this.listEvaluations(version.id).find((entry) => entry.id === id)!;
  }

  assessPromotion(versionId: string, registry: CapabilityRegistry): PromotionAssessment {
    const version = this.requireVersion(versionId);
    const evaluations = this.listEvaluations(version.id);
    const successfulEvidenceIds = unique(
      evaluations
        .filter((entry) =>
          ["validation", "replay"].includes(entry.evaluationKind.toLowerCase()) &&
          entry.outcome === "success"
        )
        .map((entry) => entry.evidenceEventId),
    );
    const failedValidation = evaluations.some((entry) =>
      ["validation", "replay"].includes(entry.evaluationKind.toLowerCase()) &&
      entry.outcome === "failure"
    );
    const requiredIndependentSuccesses = Math.max(
      version.verification.minimumIndependentSuccesses,
      version.verification.critical ? 2 : 1,
    );
    const reasons: string[] = [];
    if (failedValidation) reasons.push("At least one validation/replay observation failed.");
    if (successfulEvidenceIds.length < requiredIndependentSuccesses) {
      reasons.push(
        `Need ${requiredIndependentSuccesses} independent successful validation/replay evidence events; found ${successfulEvidenceIds.length}.`,
      );
    }
    for (const dependency of version.definition.capability.requiredCapabilities) {
      if (!registry.isExecutionReady(dependency)) {
        reasons.push(`Required capability is not execution-ready: ${dependency}`);
      }
    }
    return {
      eligible: reasons.length === 0,
      requiredIndependentSuccesses,
      successfulEvidenceIds,
      reasons,
    };
  }

  validateVersion(versionId: string, registry: CapabilityRegistry): SkillVersionRecord {
    const version = this.requireVersion(versionId);
    if (!["candidate", "degraded"].includes(version.lifecycleState)) {
      throw new Error(`Skill version ${version.id} cannot be validated from state ${version.lifecycleState}.`);
    }
    const assessment = this.assessPromotion(version.id, registry);
    if (!assessment.eligible) {
      throw new Error(`Skill version is not validation-ready: ${assessment.reasons.join(" ")}`);
    }
    const now = new Date().toISOString();
    this.db.transaction(() => {
      this.db.prepare(
        "UPDATE skill_versions SET lifecycle_state = 'validated', updated_at = ? WHERE id = ?",
      ).run(now, version.id);
      appendEvidenceEvent(this.db, {
        correlationId: correlationIdFor("skill", version.skillName),
        causationId: assessment.successfulEvidenceIds[0],
        eventType: "skill.version_validated",
        domain: "skill",
        authorityType: "skill_version",
        authorityId: version.id,
        epistemicStatus: "observation",
        payload: {
          method: version.verification.method,
          successfulEvidenceIds: assessment.successfulEvidenceIds,
        },
        provenance: { source: "SkillEvolutionEngine" },
      });
    })();
    return this.getVersion(version.id)!;
  }

  activateVersion(versionId: string, registry: CapabilityRegistry): SkillVersionRecord {
    const version = this.requireVersion(versionId);
    if (version.lifecycleState !== "validated") {
      throw new Error(`Skill version ${version.id} must be validated before activation.`);
    }
    const assessment = this.assessPromotion(version.id, registry);
    if (!assessment.eligible) {
      throw new Error(`Skill version is no longer activation-ready: ${assessment.reasons.join(" ")}`);
    }
    this.activateProjection(version, registry, assessment.successfulEvidenceIds, "skill.version_activated");
    return this.getVersion(version.id)!;
  }

  degradeVersion(
    versionId: string,
    evidenceEventId: string,
    reason: string,
    registry: CapabilityRegistry,
  ): SkillVersionRecord {
    const version = this.requireVersion(versionId);
    if (version.lifecycleState !== "active") {
      throw new Error(`Only an active skill version can be degraded; state=${version.lifecycleState}.`);
    }
    this.requireEvidence(evidenceEventId);
    const now = new Date().toISOString();
    this.db.transaction(() => {
      this.db.prepare(
        "UPDATE skill_versions SET lifecycle_state = 'degraded', updated_at = ? WHERE id = ?",
      ).run(now, version.id);
      this.db.prepare("UPDATE skills SET enabled = 0 WHERE name = ?").run(version.skillName);
      appendEvidenceEvent(this.db, {
        correlationId: correlationIdFor("skill", version.skillName),
        causationId: evidenceEventId,
        eventType: "skill.version_degraded",
        domain: "skill",
        authorityType: "skill_version",
        authorityId: version.id,
        epistemicStatus: "observation",
        payload: { reason },
        provenance: { source: "SkillEvolutionEngine" },
      });
    })();
    registry.registerSkillInventory(
      { name: version.skillName, description: version.definition.description, enabled: false },
      this.projectionFor(version),
    );
    registry.recordProbe(`skill:${version.skillName}`, {
      state: "degraded",
      authority: `skill-evolution:${version.id}`,
      evidence: [`Skill version ${version.version} degraded from evidence event ${evidenceEventId}.`],
    });
    return this.getVersion(version.id)!;
  }

  deprecateVersion(
    versionId: string,
    evidenceEventId: string,
    reason: string,
    registry: CapabilityRegistry,
  ): SkillVersionRecord {
    const version = this.requireVersion(versionId);
    this.requireEvidence(evidenceEventId);
    const now = new Date().toISOString();
    this.db.transaction(() => {
      this.db.prepare(
        "UPDATE skill_versions SET lifecycle_state = 'deprecated', deprecated_at = ?, updated_at = ? WHERE id = ?",
      ).run(now, now, version.id);
      if (version.lifecycleState === "active") {
        this.db.prepare("UPDATE skills SET enabled = 0 WHERE name = ?").run(version.skillName);
      }
      appendEvidenceEvent(this.db, {
        correlationId: correlationIdFor("skill", version.skillName),
        causationId: evidenceEventId,
        eventType: "skill.version_deprecated",
        domain: "skill",
        authorityType: "skill_version",
        authorityId: version.id,
        epistemicStatus: "observation",
        payload: { reason },
        provenance: { source: "SkillEvolutionEngine" },
      });
    })();
    registry.registerSkillInventory(
      { name: version.skillName, description: version.definition.description, enabled: false },
      this.projectionFor(version),
    );
    registry.recordProbe(`skill:${version.skillName}`, {
      state: "retired",
      authority: `skill-evolution:${version.id}`,
      evidence: [`Skill version ${version.version} deprecated from evidence event ${evidenceEventId}.`],
    });
    return this.getVersion(version.id)!;
  }

  rollback(
    skillName: string,
    targetVersionId: string,
    evidenceEventId: string,
    registry: CapabilityRegistry,
  ): SkillVersionRecord {
    const target = this.requireVersion(targetVersionId);
    if (target.skillName !== skillName) throw new Error("Rollback target belongs to another skill.");
    if (!target.activatedAt) {
      throw new Error("Rollback target has never been an activated/validated runtime version.");
    }
    if (target.lifecycleState === "deprecated") {
      throw new Error("Deprecated skill version cannot be rollback target without a new evolution candidate.");
    }
    this.requireEvidence(evidenceEventId);
    const dependencyFailures = target.definition.capability.requiredCapabilities.filter(
      (dependency) => !registry.isExecutionReady(dependency),
    );
    if (dependencyFailures.length > 0) {
      throw new Error(`Rollback target dependencies are not execution-ready: ${dependencyFailures.join(", ")}`);
    }
    this.activateProjection(target, registry, [evidenceEventId], "skill.version_rolled_back");
    return this.getVersion(target.id)!;
  }

  getCapabilityProjection(skillName: string): SkillCapabilityProjection | undefined {
    const runtimeVersion = this.getRuntimeVersion(skillName);
    return runtimeVersion ? this.projectionFor(runtimeVersion) : undefined;
  }

  isPromptEligible(skillName: string, registry: CapabilityRegistry): boolean {
    if (!this.isManaged(skillName)) return true;
    const active = this.getActiveVersion(skillName);
    if (!active) {
      // Candidate-only management must not silently disable a pre-existing
      // legacy projection. New candidates with no projected row are absent anyway.
      return true;
    }
    return registry.isExecutionReady(`skill:${skillName}`);
  }

  reconcileCapabilityRegistry(registry: CapabilityRegistry): void {
    const rows = this.db.prepare(
      `SELECT * FROM skill_versions
       WHERE activated_at IS NOT NULL
       ORDER BY skill_name ASC, datetime(updated_at) DESC, version DESC`,
    ).all() as any[];
    const seen = new Set<string>();
    for (const row of rows) {
      const version = deserializeVersion(row);
      if (seen.has(version.skillName)) continue;
      seen.add(version.skillName);
      const enabled = version.lifecycleState === "active";
      registry.registerSkillInventory(
        { name: version.skillName, description: version.definition.description, enabled },
        this.projectionFor(version),
      );
      const state = version.lifecycleState === "active"
        ? "verified_available"
        : version.lifecycleState === "degraded"
          ? "degraded"
          : version.lifecycleState === "deprecated"
            ? "retired"
            : "unavailable";
      registry.recordProbe(`skill:${version.skillName}`, {
        state,
        authority: `skill-evolution:${version.id}`,
        evidence: [
          `Restored skill version ${version.version} lifecycle=${version.lifecycleState} from durable skill evolution authority.`,
          ...version.evidenceEventIds.map((id) => `Evidence event ${id}`),
        ],
        observedAt: version.updatedAt,
      });
    }
  }

  private activateProjection(
    version: SkillVersionRecord,
    registry: CapabilityRegistry,
    evidenceIds: string[],
    eventType: string,
  ): void {
    const now = new Date().toISOString();
    this.db.transaction(() => {
      this.db.prepare(
        `UPDATE skill_versions
         SET lifecycle_state = 'superseded', updated_at = ?
         WHERE skill_name = ? AND lifecycle_state = 'active' AND id <> ?`,
      ).run(now, version.skillName, version.id);
      this.db.prepare(
        `UPDATE skill_versions
         SET lifecycle_state = 'active', activated_at = COALESCE(activated_at, ?),
             deprecated_at = NULL, updated_at = ?
         WHERE id = ?`,
      ).run(now, now, version.id);
      this.projectSkill(version.definition, now);
      appendEvidenceEvent(this.db, {
        correlationId: correlationIdFor("skill", version.skillName),
        causationId: evidenceIds[0] ?? null,
        eventType,
        domain: "skill",
        authorityType: "skill_version",
        authorityId: version.id,
        epistemicStatus: "observation",
        payload: { version: version.version, evidenceIds },
        provenance: { source: "SkillEvolutionEngine" },
      });
    })();

    registry.registerSkillInventory(
      { name: version.skillName, description: version.definition.description, enabled: true },
      this.projectionFor(version),
    );
    registry.recordProbe(`skill:${version.skillName}`, {
      state: "verified_available",
      authority: `skill-evolution:${version.id}`,
      evidence: [
        `Skill version ${version.version} activated from evidence-backed lifecycle.`,
        ...evidenceIds.map((id) => `Validation evidence event ${id}`),
      ],
      observedAt: now,
      metadata: { skillVersionId: version.id, skillVersion: version.version },
    });
  }

  private projectSkill(definition: SkillVersionDefinition, now: string): void {
    this.db.prepare(
      `INSERT INTO skills (
        name, description, auto_activate, requires, instructions,
        source, path, enabled, installed_at
      ) VALUES (?, ?, ?, ?, ?, ?, ?, 1, ?)
      ON CONFLICT(name) DO UPDATE SET
        description = excluded.description,
        auto_activate = excluded.auto_activate,
        requires = excluded.requires,
        instructions = excluded.instructions,
        source = excluded.source,
        path = excluded.path,
        enabled = 1`,
    ).run(
      definition.name,
      definition.description,
      definition.autoActivate ? 1 : 0,
      JSON.stringify(definition.requires ?? {}),
      definition.instructions,
      definition.source,
      definition.path,
      now,
    );
  }

  private projectionFor(version: SkillVersionRecord): SkillCapabilityProjection {
    const contract = version.definition.capability;
    return {
      version: String(version.version),
      dependencies: [...contract.requiredCapabilities],
      provides: contract.provides.length > 0
        ? [...contract.provides]
        : [version.skillName],
      permissions: [...contract.permissions],
      effects: [...contract.effects],
      compatibility: [...contract.compatibility],
      environment: contract.environment,
      inputs: [...contract.inputs],
      outputs: [...contract.outputs],
      metadata: {
        skillEvolutionManaged: true,
        skillVersionId: version.id,
        lifecycleState: version.lifecycleState,
        verificationMethod: version.verification.method,
        contentHash: version.contentHash,
      },
    };
  }

  private requireVersion(id: string): SkillVersionRecord {
    const version = this.getVersion(id);
    if (!version) throw new Error(`Unknown skill version: ${id}`);
    return version;
  }

  private requireEvidence(id: string): void {
    if (!getEvidenceEvent(this.db, id)) {
      throw new Error(`Unknown evidence event: ${id}`);
    }
  }
}

export function skillRecordFromProjection(skill: Skill): Pick<Skill, "name" | "description" | "enabled"> {
  return { name: skill.name, description: skill.description, enabled: skill.enabled };
}
