name: ProjectOps Integrity

on:
  push:
  pull_request:

jobs:
  projectops-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify ABOS ProjectOps authorities
        run: node scripts/projectops-integrity-verify.mjs
